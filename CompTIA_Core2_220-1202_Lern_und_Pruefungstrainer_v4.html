hes für sein Betriebssystem. Ein Administrator erhält eine E-Mail vom Hersteller, in der mitgeteilt wird, dass der Hersteller außerhalb des normalen Patch-Zeitplans einen Patch für eine Zero-Day-Sicherheitslücke in seinem Betriebssystem veröffentlicht hat. Welche der folgenden Maßnahmen sollte der Administrator als Erstes ergreifen, um dieses Problem in einer Produktionsumgebung ordnungsgemäß zu beheben?","options":[["A","Abwarten, bis der nächste monatliche Patch veröffentlicht wird, und diesen zusammen mit den anderen Updates bereitstellen."],["B","Den Patch sofort auf allen firmeneigenen Computern bereitstellen."],["C","Die Bereitstellung des Patches verzögern, um die Produktionsumgebung nicht zu beeinträchtigen."],["D","Den Patch auf einer kleinen Anzahl von Computern bereitstellen, um ihn in einer Testumgebung zu prüfen."]],"answers":["D"],"explanation":"Das Testen des Zero-Day-Patches zunächst auf einer begrenzten Anzahl von Systemen stellt sicher, dass er keine negativen Auswirkungen auf die Produktionsumgebung hat, bevor er in größerem Umfang bereitgestellt wird."},{"n":215,"simulation":false,"prompt":"Welcher der folgenden Befehle wird verwendet, um festzustellen, wie ein Paket einen Server erreicht?","options":[["A","ip addr"],["B","traceroute"],["C","ping"],["D","dig"]],"answers":["B"],"explanation":"Der Befehl „traceroute“ zeigt den Weg an, den ein Paket zurücklegt, um ein Ziel zu erreichen, und identifiziert dabei jeden Hop entlang der Route."},{"n":216,"simulation":false,"prompt":"Ein Unternehmen möchte unbefugten physischen Zugriff auf seine Mobilgeräte verhindern. Welche der folgenden Maßnahmen sollte das Unternehmen ergreifen? (Wählen Sie zwei aus.)","options":[["A","Integrierte Hotspots deaktivieren."],["B","VPN-Software konfigurieren."],["C","Eine Antiviren-Anwendung installieren."],["D","PIN-Authentifizierung verwenden."],["E","Die Standortdienste aktivieren."],["F","Bildschirm-Timeout aktivieren."]],"answers":["D","F"],"explanation":"Eine PIN verhindert, dass unbefugte Benutzer das Gerät entsperren, und eine Bildschirm-Timeout-Funktion sorgt dafür, dass das Gerät automatisch gesperrt wird, wenn es unbeaufsichtigt ist, wodurch es vor physischem Zugriff geschützt wird."},{"n":217,"simulation":false,"prompt":"Welcher der folgenden Gründe spricht dafür, die Lufttemperatur und die Luftfeuchtigkeit in Umgebungen mit mehreren aktiven Computern und Peripheriegeräten innerhalb angemessener Grenzen zu halten?","options":[["A","Um Stromspitzen zu verhindern"],["B","Um Staub zu kontrollieren"],["C","Um Brandrisiken zu verringern"],["D","Um elektrostatische Entladungen zu verhindern"]],"answers":["D"],"explanation":"Ein angemessener Feuchtigkeitsgehalt verhindert, dass die Umgebung zu trocken wird, wodurch die Bildung statischer Elektrizität und das Risiko schädlicher elektrostatischer Entladungen in der Nähe von Computerausrüstung verringert werden."},{"n":218,"simulation":false,"prompt":"Eine staatliche Behörde verbietet einem Systemadministrator, Server ohne Anwesenheit eines weiteren Mitarbeiters zu konfigurieren. Welche der folgenden Bedrohungen versucht das Unternehmen zu mindern?","options":[["A","Zero-Day"],["B","On-Path"],["C","Evil Twin"],["D","Insider"]],"answers":["D"],"explanation":"Die Anwesenheit eines weiteren Mitarbeiters während der Serverkonfiguration ist eine Kontrollmaßnahme, die darauf abzielt, böswillige Handlungen eines internen Mitarbeiters zu verhindern oder aufzudecken und so Insider-Bedrohungen zu mindern."},{"n":219,"simulation":false,"prompt":"Ein Entwickler, der einen privaten Laptop mit Windows nutzt, möchte virtuelle Technologien einsetzen. Der Entwickler findet keine Option zum Aktivieren der Hyper-V-Funktion. Welcher der folgenden Gründe ist am wahrscheinlichsten?","options":[["A","Das System ist nicht vollständig auf dem neuesten Stand."],["B","Es handelt sich um die Betriebssystemversion „Home“."],["C","Das Motherboard verfügt nicht über einen TPM-Chip."],["D","Der Benutzer ist keiner Domäne beigetreten."]],"answers":["B"],"explanation":"Hyper-V kann unter Windows Home-Editionen nicht aktiviert werden; hierfür ist Windows Pro, Enterprise oder Education erforderlich."},{"n":220,"simulation":false,"prompt":"Welche der folgenden Methoden zur Datenvernichtung ist am besten geeignet, um sicherzustellen, dass vertrauliche Informationen auf Festplatten nicht wiederhergestellt werden können?","options":[["A","Überschreiben mit einem softwarebasierten Programm zum sicheren Löschen"],["B","Entmagnetisierung, gefolgt von physischer Vernichtung"],["C","Formatierung mit einem Tool zur Low-Level-Formatierung"],["D","Verschlüsselung der Laufwerke und sichere Aufbewahrung"]],"answers":["B"],"explanation":"Durch die Entmagnetisierung werden alle magnetischen Daten auf dem Laufwerk entfernt, und die physische Vernichtung stellt sicher, dass die verbleibenden Datenträger nicht wiederhergestellt werden können, wodurch diese Kombination die sicherste Methode zur Vernichtung vertraulicher Informationen darstellt."},{"n":221,"simulation":false,"prompt":"Freiberufler arbeiten oft in der Lobby eines Unternehmens. Obwohl das Unternehmen über WLAN verfügt, schließen die Freiberufler ihre Laptops häufig an die Ethernet-Anschlüsse in der Lobby an. Was sollte ein Sicherheitsingenieur tun, um ein potenzielles Sicherheitsrisiko bei dieser Netzwerkkonfiguration möglichst effizient zu beheben?","options":[["A","WPA3-Verschlüsselung auf dem WLAN-Router konfigurieren."],["B","Die Anschlüsse in der Lobby deaktivieren und externe Nutzer auf das WLAN-Gastnetzwerk beschränken."],["C","Mit einem Protokollanalysator das Netzwerk auf böswilligen Datenverkehr überprüfen."],["D","Schilder anbringen, die externe Nutzer darauf hinweisen, die Ethernet-Anschlüsse nicht zu nutzen."]],"answers":["B"],"explanation":"Durch die Deaktivierung der Ethernet-Anschlüsse in der Lobby und die Umleitung von Auftragnehmern auf ein segmentiertes WLAN-Gastnetzwerk wird verhindert, dass nicht autorisierte oder nicht verwaltete Geräte eine direkte Verbindung zum internen Netzwerk herstellen, wodurch das Sicherheitsrisiko wirksam beseitigt wird."},{"n":222,"simulation":false,"prompt":"Ein Benutzer muss täglich eine Reihe von Befehlen auf einem Linux-Server ausführen. Der Benutzer möchte den Vorgang mithilfe eines Skripts automatisieren. Welcher der folgenden Dateitypen ist für das Skript am wahrscheinlichsten?","options":[["A",".js"],["B",".vbs"],["C",".bat"],["D",".sh"]],"answers":["D"],"explanation":"Linux-Shell-Skripte verwenden die Erweiterung .sh, weshalb dies die richtige Wahl für die Automatisierung von Befehlen auf einem Linux-Server ist."},{"n":223,"simulation":false,"prompt":"Ein Support-Spezialist muss einen freigegebenen Ordner zuweisen. Welchen der folgenden Befehle sollte der Support-Spezialist verwenden?","options":[["A","cd"],["B","net use"],["C","mkdir"],["D","ipconfig"]],"answers":["C"],"explanation":"Der Befehl „mkdir“ wird zum Erstellen eines neuen Verzeichnisses verwendet, was ein erforderlicher Schritt bei der Zuweisung eines freigegebenen Ordners ist."},{"n":224,"simulation":false,"prompt":"Welche der folgenden Arten von Malware sammelt Daten und sendet diese ohne Zustimmung des Benutzers an einen unbekannten Dritten?","options":[["A","Ransomware"],["B","Virus"],["C","Trojaner"],["D","Spyware"]],"answers":["D"],"explanation":"Spyware wurde speziell entwickelt, um Benutzer- oder Systemdaten zu sammeln und diese ohne Wissen oder Zustimmung des Benutzers an Dritte zu übermitteln."},{"n":225,"simulation":false,"prompt":"Ein Techniker richtet ein neues Diensttelefon für einen Benutzer ein. Das Unternehmen verlangt, dass alle Telefone den Unternehmensstandards entsprechen und über alle aktuellen Betriebssystem-Patches verfügen. Welche der folgenden Maßnahmen sollte der Techniker ergreifen, um die Anforderungen zu erfüllen?","options":[["A","MDM"],["B","Antivirensoftware"],["C","BYOD"],["D","Inhaltsfilterung"]],"answers":["A"],"explanation":"Eine MDM-Lösung (Mobile Device Management) sorgt dafür, dass Compliance-Anforderungen wie Betriebssystem-Patch-Standards, Sicherheitsrichtlinien und Konfigurationsstandards auf allen Unternehmenshandys eingehalten werden."},{"n":226,"simulation":false,"prompt":"Ein Benutzer reicht ein Support-Ticket ein, nachdem er die folgende Fehlermeldung erhalten hat: Der Techniker stellt fest, dass die Website auf einem Test-Arbeitsplatzrechner ordnungsgemäß geladen wird. Welche der folgenden Ursachen kommt für diesen Fehler in Frage?","options":[["A","Falsch konfigurierte Sicherheitseinstellungen"],["B","Unverschlüsseltes Netzwerk"],["C","Fehlendes SSL-Zertifikat"],["D","Falsche NTP-Einstellungen"]],"answers":["D"],"explanation":"Der Fehler NET::ERR_CERT_DATE_INVALID tritt häufig auf, wenn Datum oder Uhrzeit des Client-Geräts falsch eingestellt sind. Falsche NTP-Einstellungen führen dazu, dass der Browser das Zertifikat als abgelaufen oder noch nicht gültig erkennt, obwohl die Website auf anderen Systemen normal funktioniert."},{"n":227,"simulation":false,"prompt":"Ein Benutzer möchte eine beliebte Suchmaschine nutzen. Wenn der Benutzer die URL in die Adressleiste eingibt, zeigt die Webseite anstelle der erwarteten Suchmaschine folgende Meldung an: Das Antivirenprogramm ist abgelaufen. Welche der folgenden Ursachen ist am wahrscheinlichsten für dieses Problem?","options":[["A","Zufällige Pop-ups"],["B","Browser-Umleitung"],["C","Zertifikatswarnungen"],["D","Internetausfall"]],"answers":["B"],"explanation":"Eine Browser-Umleitung tritt auf, wenn Malware oder unerwünschte Software den Browser dazu zwingt, anstelle der beabsichtigten Website eine unerwartete Seite zu laden, beispielsweise eine Seite mit der Meldung „Antivirus abgelaufen“ anstelle einer Suchmaschine."},{"n":228,"simulation":false,"prompt":"Ein Unternehmen möchte auf allen Arbeitsstationen ein In-Place-Upgrade der Betriebssysteme durchführen. Aus Sicherheitsgründen sind alle Arten von Wechseldatenträgern deaktiviert. Welche der folgenden Möglichkeiten eignet sich am besten für ein Upgrade unter Beibehaltung der Sicherheitseinstellungen?","options":[["A","Verwendung einer externen Festplatte zum Upgrade des Betriebssystems"],["B","Kopieren der ISO-Datei auf jeden Arbeitsplatzrechner und Ausführen"],["C","Einrichten der Image-Bereitstellung über PXE"],["D","Verwendung eines Hardware-Tokens für den Zugriff auf die Upgrade-Dateien"]],"answers":["C"],"explanation":"Die PXE-Image-Bereitstellung ermöglicht die Durchführung von Betriebssystem-Upgrades über das Netzwerk, ohne Wechseldatenträger zu aktivieren. So werden die Sicherheitsrichtlinien des Unternehmens eingehalten und gleichzeitig alle Arbeitsstationen effizient aktualisiert."},{"n":229,"simulation":false,"prompt":"Welcher der folgenden Begriffe beschreibt am besten das Konzept, bei dem KI aufgrund begrenzter Trainingsdaten falsche Annahmen trifft?","options":[["A","Verzerrung"],["B","Halluzinationen"],["C","Inkonsistenz"],["D","Plagiat"]],"answers":["A"],"explanation":"Eine KI-Verzerrung tritt auf, wenn ein KI-System aufgrund von Einschränkungen oder Ungleichgewichten in seinen Trainingsdaten falsche Annahmen oder Entscheidungen trifft, was zu verzerrten oder ungenauen Ergebnissen führt."},{"n":230,"simulation":false,"prompt":"Bei welchem der folgenden Skripttypen muss der Systemmodus auf „Uneingeschränkt“ gesetzt sein, um nicht signierte Skripte ausführen zu können?","options":[["A",".js"],["B",".py"],["C",".ps1"],["D",".bat"]],"answers":["C"],"explanation":"PowerShell-Skripte (.ps1) erfordern, dass die Ausführungsrichtlinie auf „Uneingeschränkt“ (oder eine andere freizügige Stufe) gesetzt ist, um nicht signierte Skripte ausführen zu können."},{"n":231,"simulation":false,"prompt":"Ein Techniker schließt die Malware-Beseitigung auf einem Computer ab. Welcher der folgenden Schritte würde zukünftige Infektionen am ehesten verhindern?","options":[["A","Aktivierung der Systemwiederherstellung"],["B","Aufklärung der Benutzer"],["C","Geplante Antiviren-Scans"],["D","Überprüfung der Symptome"]],"answers":["B"],"explanation":"Benutzerschulungen sind langfristig die wirksamste Methode, um zukünftige Infektionen zu verhindern, da sie den Benutzern helfen, unsichere Verhaltensweisen zu erkennen und zu vermeiden, die häufig zu MalwareVorfällen führen."},{"n":232,"simulation":false,"prompt":"Das Netzwerk-Engineering-Team einer Organisation stellt dem Support-Team die Web-Proxy-Informationen zur Verfügung, die alle Arbeitsplätze benötigen, um auf externe Webseiten zugreifen zu können. Welche der folgenden Einstellungen sollte das Support-Team ändern?","options":[["A","DHCP-Lease-Konfigurationen"],["B","Internetoptionen (LAN-Einstellungen)"],["C","VPN-Endpunkte"],["D","Primäre DNS- und Gateway-Adressen"]],"answers":["B"],"explanation":"Die Web-Proxy-Einstellungen für den Zugriff auf externe Websites werden in den Internetoptionen der Workstation unter den LAN-Einstellungen konfiguriert, wo die Proxy-Server-Informationen eingegeben werden."},{"n":233,"simulation":false,"prompt":"Ein Netzwerkingenieur hat es mit einer Notsituation zu tun, in der eine kabelgebundene Netzwerkverbindung ersetzt werden muss. Ein Facility-Manager teilt dem Netzwerkingenieur mit, dass die aktuelle Verbindung unter einem Teppich verläuft und umgeleitet werden muss. Welcher der folgenden Gründe ist der beste, um diese Verbindung umzuleiten?","options":[["A","Eine ordnungsgemäße Kabelverwaltung beseitigt eine Gefahr."],["B","Das Reinigen mit einem Staubsauger erzeugt statische Elektrizität."],["C","Die Beschriftungen für die Kabelführung sind nicht ordnungsgemäß angebracht."],["D","Das Begehen des Kabels kann zu zeitweiligen Störungen führen."]],"answers":["A"],"explanation":"Das Verlegen von Netzwerkkabeln unter einem Teppich stellt ein Sicherheitsrisiko dar, beispielsweise durch Stolpergefahr oder mögliche Beschädigungen des Kabels. Durch eine ordnungsgemäße Kabelführung wird diese Gefahr beseitigt."},{"n":234,"simulation":false,"prompt":"Welche der folgenden Komponenten ist für eine ordnungsgemäße Funktion auf die Genauigkeit der Systemzeit angewiesen?","options":[["A","Terminal Access Controller Access-Control-System"],["B","Kerberos-Token"],["C","Remote Authentication Dial-in User Service"],["D","Wi-Fi Protected Access"]],"answers":["B"],"explanation":"Kerberos ist auf eine genaue Systemzeit angewiesen, um Authentifizierungstickets zu validieren, da es zeitgestempelte Zeitstempel versehenen Token mit strengen Ablauffristen, um Replay-Angriffe zu verhindern. Sind die Systemuhren nicht synchronisiert, schlägt die Authentifizierung fehl."},{"n":235,"simulation":false,"prompt":"Benutzer greifen über eine Browser-Website auf eine interne Anwendung zu. Wenn ein Benutzer die Website aufruft, erscheint eine Meldung, dass die Seite nicht sicher ist. Die Meldung enthält außerdem eine Schaltfläche „Erweiterte Optionen“, über die man die Seite fortsetzen oder schließen kann. Im Rahmen einer Sicherheitsschulung wurden alle Benutzer angewiesen, jede Seite zu schließen, auf der diese Meldung angezeigt wird. Was sollte der Techniker tun, um das Problem zu beheben?","options":[["A","Die Website zur Liste der sicheren Absender hinzufügen"],["B","Installieren Sie ein SSL-Zertifikat für die Website"],["C","Die Website auf einen anderen Server migrieren"],["D","Die Website zu einem Webhosting-Anbieter verlegen"]],"answers":["B"],"explanation":"Durch die Installation eines SSL-Zertifikats wird sichergestellt, dass die Website eine vertrauenswürdige HTTPS-Verschlüsselung verwendet, wodurch Sicherheitswarnungen des Browsers vermieden werden und Benutzer sicher auf die interne Anwendung zugreifen können, ohne Sicherheitswarnungen umgehen zu müssen."},{"n":236,"simulation":false,"prompt":"Ein Nutzer erhält eine unerwartete SMS mit einem Link zum Zurücksetzen eines abgelaufenen Passworts. Um welche der folgenden Social-Engineering-Angriffe handelt es sich?","options":[["A","Vishing"],["B","Spear-Phishing"],["C","Whaling"],["D","Smishing"]],"answers":["D"],"explanation":"Smishing ist ein Social-Engineering-Angriff, der über SMS oder Textnachrichten durchgeführt wird, bei dem Angreifer betrügerische Links oder Nachrichten versenden, um Nutzer dazu zu verleiten, Zugangsdaten oder sensible Informationen preiszugeben."},{"n":237,"simulation":false,"prompt":"Ein böswilliger Akteur nutzt mehrere Endpunkte, um einen einzelnen Endpunkt anzugreifen. Welche der folgenden Aussagen beschreibt diese Bedrohung?","options":[["A","On-Path-Angriff"],["B","Structured Query Language-Injektion"],["C","Brute-Force-Angriff"],["D","Verteilter Denial-of-Service-Angriff"]],"answers":["D"],"explanation":"Bei einem verteilten Denial-of-Service-Angriff werden mehrere Endpunkte gleichzeitig genutzt, um ein einzelnes Zielsystem zu überlasten, dessen Ressourcen zu erschöpfen und es für legitime Benutzer unzugänglich zu machen."},{"n":238,"simulation":false,"prompt":"Ein Support-Spezialist muss ein neues Anwendungsupdate für das gesamte Unternehmen installieren. Welcher der folgenden Schritte ist der erste Schritt in diesem Prozess?","options":[["A","Sicherungsplan"],["B","Antragsformulare"],["C","Sandbox-Tests"],["D","Peer-Review"]],"answers":["C"],"explanation":"Zunächst werden Sandbox-Tests durchgeführt, um das Anwendungs-Update in einer kontrollierten Umgebung zu validieren und sicherzustellen, dass es ordnungsgemäß funktioniert und keine Probleme verursacht, bevor es unternehmensweit bereitgestellt wird."},{"n":239,"simulation":false,"prompt":"Ein Systemadministrator meldet sich am Rechner eines Entwicklers an, um das System zu aktualisieren, und stellt dabei ein Leistungsproblem fest. Um das Problem zu beheben, versucht der Administrator mehrmals, den Task-Manager zu öffnen, doch dieser lässt sich nicht starten. Was ist höchstwahrscheinlich die Ursache für dieses Problem?","options":[["A","Eine Softwareentwicklungsanwendung wird ausgeführt"],["B","Der Windows-Update-Dienst ist auf „Manuell“ eingestellt"],["C","Das Betriebssystem ist mit Malware infiziert"],["D","Eine Auslagerungsdatei wurde auf das Laufwerk D:\\ verschoben"]],"answers":["C"],"explanation":"Malware deaktiviert häufig Systemdienstprogramme wie den Task-Manager, um die Erkennung und Beendigung bösartiger Prozesse zu verhindern. Dies erklärt, warum sich der Task-Manager trotz mehrerer Versuche nicht öffnen lässt."},{"n":240,"simulation":false,"prompt":"Ein Unternehmenscomputer wird innerhalb einer Organisation einer neuen Verwendung zugeführt. Die bestehende Konfiguration verfügt über eine statische IP-Adresse, die jedoch nicht mehr benötigt wird. Was sollte ein Techniker tun, um die Netzwerkanforderungen zu erfüllen?","options":[["A","Eine DHCP-Reservierung für den Computer vornehmen"],["B","Eine Ausnahme im bestehenden IP-Schema erstellen"],["C","Die Netzwerkkarteneinstellungen von „Manuell“ auf „Automatisch“ umstellen"],["D","Die derzeit zugewiesene statische IP-Adresse ändern"]],"answers":["C"],"explanation":"Durch das Umschalten der Netzwerkkarteneinstellungen von „manuell“ auf „automatisch“ kann der Computer seine IP-Konfiguration dynamisch über DHCP beziehen, was sinnvoll ist, wenn keine statische IP-Adresse mehr benötigt wird."},{"n":241,"simulation":false,"prompt":"Was ist am wichtigsten, um geistiges Eigentum vor der Weitergabe auf Social-Media-Plattformen zu schützen?","options":[["A","SLA"],["B","AUP"],["C","ACL"],["D","NDA"]],"answers":["D"],"explanation":"Eine Geheimhaltungsvereinbarung verpflichtet Personen rechtlich dazu, vertrauliche und geschützte Informationen zu schützen, und ist damit die wichtigste Kontrollmaßnahme, um zu verhindern, dass geistiges Eigentum auf Social-Media-Plattformen weitergegeben wird."},{"n":242,"simulation":false,"prompt":"Ein Techniker muss die lokalen Daten einer Anwendung aus einem bestimmten Benutzerkonto löschen, doch als er zum Verzeichnis „C:\\Users\\EmployeeA“ navigiert, ist der Ordner „AppData“ nicht vorhanden. Was sollte der Techniker tun, um den entsprechenden Ordner anzuzeigen?","options":[["A","Allen Benutzern Vollzugriffsrechte auf den Ordner gewähren"],["B","Die Anzeigeoptionen so anpassen, dass alle Dateidetails angezeigt werden"],["C","Die Einstellungen so ändern, dass versteckte Elemente angezeigt werden"],["D","Sich als Domänenadministrator an der Workstation anmelden"]],"answers":["C"],"explanation":"Der Ordner „AppData“ ist in Windows standardmäßig ausgeblendet. Durch Ändern der Einstellungen zur Anzeige versteckter Elemente kann der Techniker den Ordner sehen und darauf zugreifen, um die lokalen Daten der Anwendung zu löschen."},{"n":243,"simulation":false,"prompt":"Der Computer eines Benutzers ist mit Malware infiziert, die von der vorhandenen Sicherheitssoftware des Benutzers nicht erkannt wurde. Welche der folgenden Aussagen erklärt am besten, warum die Infektion unentdeckt blieb?","options":[["A","Ordnerberechtigungen"],["B","Veraltete Definitionen"],["C","Port-Sicherheit nicht aktiviert"],["D","Berechtigungen für Benutzerkonten"]],"answers":["B"],"explanation":"Veraltete Malware-Definitionen verhindern, dass Sicherheitssoftware neu entwickelte oder aktualisierte Bedrohungen erkennt, sodass die Infektion unentdeckt bleibt."},{"n":244,"simulation":false,"prompt":"Ein Support-Techniker muss eine Software installieren, mit der ein Benutzer eine Präsentation zum Projektstatus für externe Stakeholder halten kann. Welche der folgenden Softwaretypen sollte der Techniker installieren?","options":[["A","WinRM"],["B","RMM"],["C","Videokonferenz"],["D","Sichere Dateiübertragung"]],"answers":["C"],"explanation":"Videokonferenzsoftware ermöglicht Audio- und Videokommunikation in Echtzeit sowie die Bildschirmfreigabe, was für die Präsentation des Projektstatus vor externen Stakeholdern erforderlich ist."},{"n":245,"simulation":false,"prompt":"Welche der folgenden Microsoft Windows-Versionen wäre am ehesten auf einem Server installiert?","options":[["A","Windows 10 Enterprise"],["B","Windows 11 Pro"],["C","Windows 2022"],["D","Windows 22H2"]],"answers":["C"],"explanation":"Windows Server 2022 ist ein Betriebssystem der Serverklasse, das dafür ausgelegt ist, Dienste wie Authentifizierung, Dateifreigabe, Virtualisierung und Anwendungshosting für das Netzwerk eines Unternehmens bereitzustellen."},{"n":246,"simulation":false,"prompt":"Ein Techniker kann einen Computer nicht in die Windows-Domäne aufnehmen. Der Computer kann jedoch den Domänencontroller über die IP-Adresse per Ping erreichen. Welcher der folgenden Gründe ist am wahrscheinlichsten?","options":[["A","Die DNS-Einstellungen sind falsch"],["B","Die Firewall-Konfiguration ist falsch"],["C","IPv6 ist auf dem Computer aktiviert"],["D","Der Computer ist nicht mit dem Netzwerk verbunden"]],"answers":["A"],"explanation":"Für den Beitritt zu einer Windows-Domäne ist eine korrekte DNS-Auflösung erforderlich, um den Domänencontroller anhand seines Namens zu finden. Auch wenn der Computer den Domänencontroller über die IP-Adresse anpingen kann, verhindern falsche DNS-Einstellungen, dass das System Domänendienste auflösen kann, was dazu führt, dass der Beitritt zur Domäne fehlschlägt."},{"n":247,"simulation":false,"prompt":"Welche der folgenden Maßnahmen ermöglicht es Benutzern, die Installation von Malware und die Offenlegung sensibler Informationen zu verhindern?","options":[["A","Secure Boot"],["B","Aufklärung über Bedrohungen"],["C","E-Mail-Sicherheitsgateway"],["D","Firewall"]],"answers":["B"],"explanation":"Aufklärung über Bedrohungen vermittelt den Benutzern, wie sie schädliche Inhalte und unsichere Verhaltensweisen erkennen und vermeiden können, und trägt so dazu bei, die Installation von Malware zu verhindern und das Risiko der Offenlegung sensibler Informationen durch Social Engineering oder Benutzerfehler zu verringern."},{"n":248,"simulation":false,"prompt":"Ein Benutzer meldet, dass die Uhrzeit auf seinem Computer nicht mit der Uhrzeit auf seinem VoIP-Telefon übereinstimmt. Was sollte ein Techniker tun, um die Zeitabweichung zu beheben?","options":[["A","Überprüfen, ob der Benutzer bei der Domäne angemeldet ist"],["B","Die Uhrzeit am Telefon manuell so einstellen, dass sie mit der des Computers übereinstimmt"],["C","Das neueste BIOS-Update herunterladen und installieren"],["D","Den Zugriff auf einen verfügbaren NTP-Server konfigurieren"]],"answers":["D"],"explanation":"Durch die Konfiguration des Zugriffs auf einen verfügbaren NTP-Server (Network Time Protocol) wird sichergestellt, dass sowohl der Computer als auch das VoIP-Telefon ihre Uhren mit derselben maßgeblichen Zeitquelle synchronisieren, wodurch Zeitabweichungen automatisch behoben werden."},{"n":249,"simulation":false,"prompt":"Während der Arbeit von zu Hause aus muss der Finanzvorstand (CFO) Berichte aus der Buchhaltungssoftware öffnen. Beim Öffnen der Anwendung wird dem CFO die Fehlermeldung „Verbindung zur Datenbank nicht möglich“ angezeigt. Was sollte der CFO als Erstes tun?","options":[["A","Überprüfen, ob die Anwendung auf dem neuesten Stand ist"],["B","Ins Büro zurückkehren"],["C","Den PC neu starten"],["D","Den VPN-Status überprüfen"]],"answers":["D"],"explanation":"Die Überprüfung des VPN-Status ist der erste Schritt, da für den Fernzugriff auf interne Buchhaltungsdatenbanken in der Regel eine aktive VPN-Verbindung erforderlich ist, um auf interne Netzwerkressourcen zugreifen zu können."},{"n":250,"simulation":false,"prompt":"Ein Benutzer installiert eine Drittanbieter-Anwendung auf dem neuesten macOS. Der Benutzer erhält eine Sicherheitswarnung, die besagt, dass die Anwendung nicht signiert ist und nicht installiert werden kann. Welche der folgenden Einstellungen sollte der Benutzer anpassen, um die Installation zu ermöglichen?","options":[["A","Datenschutz"],["B","Barrierefreiheit"],["C","Finder"],["D","iCloud"]],"answers":["A"],"explanation":"Durch Anpassen der Einstellungen unter „Datenschutz“ (Sicherheit & Datenschutz) kann der Benutzer die Einschränkungen von macOS Gatekeeper außer Kraft setzen und die Installation einer nicht signierten Drittanbieter-Anwendung zulassen."},{"n":251,"simulation":false,"prompt":"Ein Kunde aus dem öffentlichen Sektor beauftragt einen Techniker, mehrere Laufwerke zu löschen, die vertrauliche Informationen enthalten. Der Techniker muss die gesetzlichen Vorschriften einhalten. Welche der folgenden Optionen ist die beste?","options":[["A","Interne Festplattenvernichtung"],["B","Zertifizierte Vernichtung durch einen Drittanbieter"],["C","Low-Level-Formatierung"],["D","Gezieltes Löschen von Dateien"]],"answers":["B"],"explanation":"Eine zertifizierte Vernichtung durch einen Drittanbieter liefert einen dokumentierten, überprüfbaren Nachweis dafür, dass die Laufwerke gemäß den behördlichen und gesetzlichen Anforderungen vernichtet wurden, was beim Umgang mit vertraulichen Informationen der Regierung unerlässlich ist."},{"n":252,"simulation":false,"prompt":"Ein IT-Techniker versucht, eine Videobearbeitungsanwendung für einen Kunden zu installieren, als das Installationsprogramm zum Stillstand kommt. Der Techniker sieht eine Fehlermeldung, dass das System die VRAM-Anforderungen nicht erfüllt. Das System verfügt über eine gängige, integrierte Grafiklösung und die doppelte Menge an DRAM im Vergleich zur erforderlichen Menge. Auf welche der folgenden Optionen sollte der Techniker zugreifen, um die VRAM-Anforderung zu erfüllen?","options":[["A","Geräte-Manager"],["B","Virtueller Arbeitsspeicher"],["C","BIOS-Optionen"],["D","Systemkonfiguration"]],"answers":["C"],"explanation":"Integrierte Grafiklösungen nutzen den Systemspeicher als gemeinsamen Grafikspeicher, und die dem VRAM zugewiesene Speichermenge wird im BIOS konfiguriert. Durch Anpassen der BIOS-Optionen kann der Techniker die VRAM-Zuweisung erhöhen, um den Anforderungen der Anwendung gerecht zu werden."},{"n":253,"simulation":false,"prompt":"Welche der folgenden Methoden dient dazu, Dateien auf einer Festplatte oberflächlich zu löschen?","options":[["A","Bohren"],["B","Entmagnetisierung"],["C","Löschen"],["D","Zerkleinern"],["E","Low-Level-Formatierung"]],"answers":["E"],"explanation":"Bei der Low-Level-Formatierung werden Dateisystemstrukturen und Verweise entfernt, ohne das Laufwerk physisch das Laufwerk physisch zu zerstören, was sie im Vergleich zu physischen Vernichtungstechniken zu einer oberflächlichen Löschmethode macht."},{"n":254,"simulation":false,"prompt":"Ein Techniker untersucht die Ursache für den Ausfall einer Anwendung. Der Techniker stellt fest, dass ein zuvor ausgeführter Dienst unerwartet beendet wurde. Der Techniker versucht, den Dienst manuell zu starten, doch der Start schlägt fehl. Welche der folgenden Ursachen ist für dieses Problem verantwortlich?","options":[["A","Der Dienst ist so eingestellt, dass er automatisch gestartet wird"],["B","Das Dienstkonto benötigt Administratorrechte"],["C","Das Dienstkonto ist gesperrt"],["D","Der Dienst sollte so eingestellt sein, dass er unter dem Systemkonto ausgeführt wird"]],"answers":["C"],"explanation":"Wenn das Dienstkonto gesperrt ist, kann sich der Dienst beim Start nicht authentifizieren, was dazu führt, dass der manueller Startversuch scheitert, obwohl der Dienst zuvor erfolgreich ausgeführt wurde."},{"n":255,"simulation":false,"prompt":"Ein Techniker arbeitet daran, den Zugriff eines Kunden auf eine Website wiederherzustellen. Welchen der folgenden Befehle sollte der Techniker verwenden, um die Fehlerquelle zu ermitteln?","options":[["A","gpupdate"],["B","tracert"],["C","hostname"],["D","netstat"]],"answers":["B"],"explanation":"Tracert verfolgt den Weg, den Pakete zurücklegen, um ein Ziel zu erreichen, und zeigt an, an welcher Stelle die Verbindung unterbrochen wird. So kann der Techniker den spezifischen Netzwerk-Hop identifizieren, der das Problem beim Zugriff auf die Website verursacht."},{"n":256,"simulation":false,"prompt":"Ein Techniker möchte auf einem Gerät neue Partitionen erstellen, damit ein Benutzer Arbeitsdaten und private Daten getrennt halten kann. Welches der folgenden Tools sollte der Techniker verwenden?","options":[["A","perfmon.msc"],["B","diskmgmt.msc"],["C","lusmgr.msc"],["D","devmgmt.msc"]],"answers":["B"],"explanation":"Dieses Tool dient zum Erstellen, Löschen, Formatieren und Verwalten von Festplattenpartitionen und Volumes und ermöglicht die Aufteilung von Daten auf verschiedene Partitionen auf demselben Speichergerät."},{"n":257,"simulation":false,"prompt":"Ein Benutzer möchte mehrere gebrauchte Computer verwenden, um zu Hause ein kostengünstiges Labor einzurichten, in dem er Skripte zur Verwaltung von Servern studieren und testen kann. Welches der folgenden Betriebssysteme wäre die beste Wahl?","options":[["A","macOS"],["B","Linux"],["C","ChromeOS"],["D","Windows"]],"answers":["B"],"explanation":"Dieses Betriebssystem ist kostenlos, ressourcenschonend und wird häufig auf Servern eingesetzt, wodurch es sich ideal für den Aufbau einer kostengünstigen Lernumgebung und zum Üben von Skript- und Serververwaltungsaufgaben eignet."},{"n":258,"simulation":false,"prompt":"Ein kleines Unternehmen verzeichnet unbefugte Zugriffsversuche auf seine Windows-Arbeitsstationen. Das Unternehmen vermutet, dass einige der Standard-Sicherheitseinstellungen möglicherweise zu freizügig sind. Welche der folgenden Maßnahmen sollte ein IT-Techniker ergreifen?","options":[["A","Eine geeignete Gruppenrichtlinie implementieren."],["B","Automatische Updates für Windows konfigurieren."],["C","Die Passwörter der Konten zurücksetzen."],["D","Richtlinien zur Kontosperrung aktivieren."]],"answers":["A"],"explanation":"Gruppenrichtlinien ermöglichen die zentrale Durchsetzung von Sicherheitseinstellungen auf allen WindowsArbeitsstationen und sind somit die geeignete Methode, um Standardberechtigungen zu verschärfen und unbefugte Zugriffsversuche zu reduzieren."},{"n":259,"simulation":false,"prompt":"Ein Nutzer berichtet, dass auf seinem Smartphone häufig Pop-ups angezeigt werden, die vor Sicherheitsbedrohungen warnen und Tools zum Schutz davor empfehlen. Nachdem er auf eines der Pop-ups getippt hat, stellt der Nutzer fest, dass sich der Akku des Smartphones schneller entlädt. Welche der folgenden Maßnahmen sollte ein Techniker zur Behebung dieses Problems empfehlen?","options":[["A","Den Browser-Cache des Smartphones leeren und unbekannte Anwendungen deinstallieren."],["B","Den Flugmodus aktivieren und das Smartphone neu starten."],["C","Das Smartphone auf die Werkseinstellungen zurücksetzen."],["D","Die SIM-Karte austauschen und die Netzwerkeinstellungen ändern."]],"answers":["A"],"explanation":"Pop-ups, die vor gefälschten Sicherheitsbedrohungen und erhöhtem Akkuverbrauch warnen, sind typische Anzeichen für Adware oder schädliche Anwendungen. Durch das Leeren des Browser-Caches und das Entfernen unbekannter oder verdächtiger Apps wird die Ursache für die Pop-ups beseitigt und die Hintergrundaktivität gestoppt, die zu übermäßigem Akkuverbrauch führt."},{"n":260,"simulation":false,"prompt":"Ein Stromausfall führt dazu, dass sich ein Arbeitsplatzrechner sofort ausschaltet. Welche der folgenden Maßnahmen würde helfen, ein erneutes Auftreten dieses Problems zu verhindern?","options":[["A","Überspannungsschutz"],["B","Unterbrechungsfreie Stromversorgung"],["C","Netzspannungsregler"],["D","Redundantes Netzteil"]],"answers":["B"],"explanation":"Dieses Gerät liefert bei einem Stromausfall vorübergehend Batteriestrom, sodass die die Workstation weiterlaufen oder ordnungsgemäß herunterfahren kann, anstatt sich sofort auszuschalten."},{"n":261,"simulation":false,"prompt":"Das Android-Smartphone eines Benutzers startet häufig neu, wenn eine bestimmte Anwendung ausgeführt wird. Auf dem Smartphone ist der neueste Betriebssystem-Patch installiert, und es wurde bestätigt, dass alle Anwendungen auf dem neuesten Stand sind. Das Problem trat auf, nachdem der Benutzer in der vergangenen Woche mehrere neue Anwendungen installiert hatte. Welchen der folgenden Schritte sollte ein Techniker als Erstes durchführen?","options":[["A","Den Speicher-Cache der abstürzenden Anwendung leeren."],["B","Den neuesten Betriebssystem-Patch deinstallieren."],["C","Das Smartphone auf die Werkseinstellungen zurücksetzen."],["D","Die App auf einem anderen Smartphone testen."]],"answers":["A"],"explanation":"Das Leeren des App-Caches ist der am wenigsten eingreifende erste Schritt zur Fehlerbehebung und kann Abstürze beheben, die durch beschädigte oder in Konflikt stehende Cache-Daten verursacht werden, ohne das Betriebssystem oder andere Anwendungen zu beeinträchtigen."},{"n":262,"simulation":false,"prompt":"Der Computer eines Endnutzers lässt sich nicht starten. Ein Techniker untersucht den Rechner, hört keine ungewöhnlichen Geräusche, stellt jedoch fest, dass kein Betriebssystem gefunden wird. Welches der folgenden Elemente ist höchstwahrscheinlich beschädigt?","options":[["A","Basic Input/Output System"],["B","New Technology File System"],["C","Trusted Platform Module"],["D","Master Boot Record"]],"answers":["D"],"explanation":"Diese Komponente enthält die Informationen, die zum Auffinden und Starten des Betriebssystems während des Bootvorgangs benötigt werden. Ist sie beschädigt, kann das System das installierte Betriebssystem nicht finden, selbst wenn die Hardware einwandfrei funktioniert."},{"n":263,"simulation":false,"prompt":"Ein Techniker arbeitet über die Befehlszeile an mehreren Remote-Rechnern. Welchen der folgenden Befehle sollte der Techniker verwenden, um zu überprüfen, welche SMB-Freigaben derzeit zugeordnet sind?","options":[["A","systeminfo"],["B","hostname"],["C","net use"],["D","nslookup"]],"answers":["C"],"explanation":"Dieser Befehl zeigt alle derzeit zugeordneten Netzwerkverbindungen an, einschließlich aktiver SMB-Freigaben und der zugehörigen Laufwerksbuchstaben auf dem System."},{"n":264,"simulation":false,"prompt":"Der neue Laptop eines Benutzers, der als „gaming-ready“ beworben wurde, läuft langsam, wenn der Benutzer ein modernes Spiel spielt. Wenn der Benutzer jedoch ein weniger ressourcenintensives Spiel spielt, tritt keine Verzögerung auf. Welche der folgenden Maßnahmen sollte ein Techniker ergreifen, um das Problem zu beheben?","options":[["A","Den Arbeitsspeicher übertakten."],["B","NIC-Teaming aktivieren."],["C","Die dedizierte Grafikkarte auswählen."],["D","CPU-Hyperthreading aktivieren."]],"answers":["C"],"explanation":"Moderne Spiele erfordern eine erhebliche Grafikleistung, und Systeme mit integrierter und dedizierter Grafik greifen standardmäßig möglicherweise auf die integrierte Grafik zurück, um Strom zu sparen. Durch die Auswahl des dedizierten Grafikprozessors wird sichergestellt, dass das Spiel die leistungsstärkere GPU nutzt, wodurch Leistungsprobleme bei anspruchsvollen Spielsituationen behoben werden."},{"n":265,"simulation":false,"prompt":"Ein Techniker trägt beim Austausch von RAM ein Erdungsarmband. Welche der folgenden Aussagen beschreibt den Zweck des Handgelenkbandes bei dieser Aufgabe?","options":[["A","Um elektrostatische Aufladung zu erzeugen"],["B","Um elektrostatische Aufladung zu erhöhen"],["C","Um elektrostatische Ladung abzuleiten"],["D","Um elektrostatische Ladung zu speichern"]],"answers":["C"],"explanation":"Das Handgelenkband leitet statische Elektrizität sicher vom Techniker zur Erde ab und verhindert so elektrostatische Entladungen, die empfindliche Computerkomponenten während der Hardware-Installation beschädigen könnten."},{"n":266,"simulation":false,"prompt":"Ein Systemadministrator möchte einen Linux-Server von einem entfernten Laptop aus mit einem Festplattenverwaltungstool verwalten, auf das nur über die grafische Benutzeroberfläche zugegriffen werden kann. Was sollte der Administrator installieren?","options":[["A","Secure Shell (SSH)"],["B","Kernel-basierte virtuelle Maschine (KVM)"],["C","Virtual Network Computing (VNC)"],["D","Virtuelles privates Netzwerk (VPN)"]],"answers":["C"],"explanation":"Diese Technologie ermöglicht den Fernzugriff auf die grafische Desktop-Umgebung eines Systems, sodass der Administrator von einem entfernten Laptop aus ausschließlich GUI-basierte Tools auf dem Linux-Server nutzen kann."},{"n":267,"simulation":false,"prompt":"Die Marketingabteilung eines Unternehmens möchte ein neues generatives KI-Produkt einsetzen. Ein Techniker überprüft die KI-Richtlinie des Unternehmens und stellt fest, dass das neue Produkt nicht im Abschnitt „Zulässige Nutzung“ aufgeführt ist. Was sollte der Techniker als Nächstes tun?","options":[["A","Die Marketingabteilung darüber informieren, dass das KI-Produkt nicht verwendet werden darf, da es nicht unter die KI-Richtlinie des Unternehmens fällt."],["B","Die Anfrage an die Technologieabteilung und die Rechtsabteilung weiterleiten, um eine entsprechende Genehmigung einzuholen."],["C","Das KI-Produkt in der Marketingabteilung für Tests zur zulässigen Nutzung bereitstellen."],["D","Weitere Informationen von der Marketingabteilung einholen, um einen Anwendungsfall innerhalb des Unternehmens zu ermitteln."]],"answers":["B"],"explanation":"Die Einführung eines neuen generativen KI-Produkts, das nicht unter die bestehende KI-Richtlinie fällt, erfordert eine formelle Prüfung, um rechtliche, sicherheitstechnische, Compliance- und risikobezogene Aspekte zu berücksichtigen. Durch die Eskalation des Antrags wird sichergestellt, dass das Produkt vor der Nutzung im Rahmen einer ordnungsgemäßen Governance bewertet und genehmigt wird."},{"n":268,"simulation":false,"prompt":"Ein Support-Techniker erhält einen Anruf von einem verärgerten Kunden. Der Kunde unterbricht den Techniker ständig und lautstark, bevor dieser klärende Fragen stellen oder Details bestätigen kann. Welche der folgenden Maßnahmen sollte der Support-Techniker ergreifen, um die Situation effektiv und professionell zu bewältigen? (Wählen Sie zwei aus.)","options":[["A","Aktives Zuhören anwenden, um sicherzustellen, dass sich der Kunde gehört und verstanden fühlt."],["B","Bieten Sie sofort eine Entschädigung für die Unannehmlichkeiten an, ohne die Richtlinien zu prüfen."],["C","Sich für die Unannehmlichkeiten entschuldigen, ohne das Problem zu verstehen."],["D","Den Kunden auf seinen Tonfall ansprechen und auf ein höfliches Gespräch bestehen."],["E","Während des gesamten Gesprächs einen ruhigen und einfühlsamen Ton beibehalten."],["F","Leiten Sie den Anruf an einen Vorgesetzten weiter, ohne auf die Anliegen des Kunden einzugehen."]],"answers":["A","E"],"explanation":"Aktives Zuhören trägt zur Deeskalation der Situation bei, indem es dem Kunden das Gefühl vermittelt, gehört und verstanden zu werden – selbst wenn er verärgert ist. Ein ruhiger und einfühlsamer Ton zeugt von Professionalität und hilft, Spannungen abzubauen, wodurch es einfacher wird, das Gespräch auf die Lösung des Problems zu lenken."},{"n":269,"simulation":false,"prompt":"Ein Techniker kann die Ransomware auf einem Windows-PC nicht beseitigen. Der Benutzer fragt nach dem schnellsten Weg, den PC wieder betriebsbereit zu machen. Welche der folgenden Maßnahmen sollte der Techniker als Nächstes ergreifen?","options":[["A","Den Endnutzer über sicherere Surfgewohnheiten aufklären."],["B","Die Systemwiederherstellung deaktivieren."],["C","Das System anhand einer funktionierenden Sicherung neu installieren."],["D","Optionale Windows-Updates ausführen."]],"answers":["C"],"explanation":"Die Neuinstallation des Systems anhand einer bekanntermaßen fehlerfreien Sicherung ist der schnellste und zuverlässigste Weg, die volle Funktionsfähigkeit nach einem Ransomware-Angriff wiederherzustellen, wenn Behebungsversuche fehlgeschlagen sind, und dabei sicherzustellen, dass alle schädlichen Komponenten vollständig entfernt werden."},{"n":270,"simulation":false,"prompt":"Ein Unternehmen möchte Folgendes durchsetzen: Administratoren können URLs zur Liste der vertrauenswürdigen URLs hinzufügen. Passwörter werden nicht über den Browser gespeichert. Beim Schließen des Browsers wird der gesamte Verlauf gespeichert. Die Sicherheitseinstellungen des Browsers werden auf „hoch“ gesetzt. Der Zugriff auf bestimmte URLs oder Bewertungen wird eingeschränkt. Welche der folgenden Optionen sollte der Techniker am besten konfigurieren?","options":[["A","Gruppenrichtlinie"],["B","Web-Gateway"],["C","Browserrichtlinie"],["D","Web-Proxy"]],"answers":["A"],"explanation":"Gruppenrichtlinien ermöglichen die zentralisierte Durchsetzung von Sicherheits- und Nutzungseinstellungen für Browser auf allen verwalteten Systemen, einschließlich der Verwaltung vertrauenswürdiger Websites, Einschränkungen bei der Speicherung von Passwörtern, der Konfiguration der Sicherheitsstufe, des Verhaltens beim Browserverlauf sowie der Zugriffskontrolle auf bestimmte URLs oder Inhaltskategorien."},{"n":271,"simulation":false,"prompt":"Ein Techniker muss Windows 11 auf einer 4-TB-SSD installieren. Die Unternehmensanforderungen sehen vor, dass das Laufwerk in mindestens fünf primäre Partitionen partitioniert werden muss. Welche der folgenden Optionen sollte der Techniker verwenden? (Wählen Sie zwei aus.)","options":[["A","FAT16"],["B","XFS"],["C","GPT"],["D","MBR"],["E","NTFS"],["F","APFS"]],"answers":["C","E"],"explanation":"Die GUID-Partitionstabelle unterstützt Laufwerke mit einer Größe von mehr als 2 TB und ermöglicht die Einrichtung mehrerer primärer Partitionen, wodurch die Anforderungen an die Partitionierung erfüllt werden. NTFS ist das erforderliche Dateisystem für moderne Windows-Installationen und unterstützt große Volumes, Sicherheitsfunktionen sowie die von Windows 11 benötigten Systemdateien."},{"n":272,"simulation":false,"prompt":"Ein Techniker sieht auf einer neuen Website eine Zertifikatswarnung, die besagt, dass die Zertifikatsquelle nicht überprüft werden kann. Der Techniker ignoriert die Warnung. Welche der folgenden Maßnahmen muss ergriffen werden, um zu verhindern, dass diese Warnung bei anderen Benutzern angezeigt wird?","options":[["A","Das Zertifikat muss von einer vertrauenswürdigen Zertifizierungsstelle ausgestellt werden."],["B","Das Zertifikat muss vom Administrator signiert sein."],["C","Es muss ein neues Zertifikat von einem lokalen Computer aus erstellt werden."],["D","Das Zertifikat muss zur persönlichen Stammzertifikatsliste hinzugefügt werden."]],"answers":["A"],"explanation":"Wenn ein Zertifikat von einer vertrauenswürdigen Zertifizierungsstelle generiert und signiert wird, können Browser die Zertifikatskette automatisch validieren, wodurch Vertrauenswarnungen für alle Benutzer, die auf die Website zugreifen, verhindert werden."},{"n":273,"simulation":false,"prompt":"Ein Techniker hat eine SOHO-Firewall installiert, konfiguriert und abgesichert, um den Anforderungen eines Kunden gerecht zu werden. Der Kunde fragt den Techniker, was getan werden kann, um die Sicherheit der Firewall auch in Zukunft zu gewährleisten. Welche der folgenden Maßnahmen sollte der Techniker empfehlen?","options":[["A","Alle Standardpasswörter ändern"],["B","Regelmäßige Firmware-Updates planen"],["C","Überprüfen, ob alle nicht benötigten Ports deaktiviert sind"],["D","Die Firewall an einem sicheren Ort aufbewahren"]],"answers":["B"],"explanation":"Regelmäßige Firmware-Updates stellen sicher, dass die Firewall Sicherheitspatches, Fehlerbehebungen und Leistungsverbesserungen erhält, wodurch der Schutz vor neu entdeckten Bedrohungen langfristig gewährleistet bleibt ."},{"n":274,"simulation":false,"prompt":"Nachdem ein Techniker den Arbeitsspeicher (RAM) auf der Workstation eines Benutzers aufgerüstet hat, zeigt das System die Meldung „Kein Startgerät gefunden“ an. Was ist die wahrscheinlichste Ursache?","options":[["A","Die Installations-CD ist nicht verfügbar."],["B","Das Stromkabel der SATA-Festplatte ist nicht angeschlossen."],["C","Das Laufwerk muss neu formatiert werden."],["D","Die Startreihenfolge muss geändert werden."]],"answers":["B"],"explanation":"Ein nicht angeschlossenes SATA-Festplatten-Stromkabel verhindert, dass das System die Festplatte während des POST erkennt. Wenn das Laufwerk nicht mit Strom versorgt wird, kann das BIOS/UEFI es nicht als bootfähiges Gerät erkennen, was nach Hardwareänderungen wie einem RAM-Upgrade zu der Meldung „Kein Boot-Gerät gefunden“ führt."},{"n":275,"simulation":false,"prompt":"Ein Benutzer versucht, neue Software zu installieren. Der Download der Anwendung verläuft erfolgreich, doch wenn der Benutzer versucht, die Anwendung zu installieren, wird er zur Eingabe von Anmeldedaten aufgefordert. Was würde der Techniker höchstwahrscheinlich tun, um dieses Problem zu beheben?","options":[["A","Den Computer des Benutzers neu starten."],["B","Einen anderen Webbrowser zum Herunterladen der Anwendung verwenden."],["C","Die UAC-Einstellungen ändern."],["D","Den Softwarehersteller um Unterstützung bitten."]],"answers":["C"],"explanation":"Die Aufforderung zur Eingabe von Anmeldedaten während der Installation wird dadurch verursacht, dass die Benutzerkontensteuerung (UAC) Administratorrechte für die Installation von Software verlangt. Durch Anpassen der UAC-Einstellungen oder die Erteilung einer entsprechenden administrative Genehmigung löst das Problem, da die Installation dadurch mit erweiterten Berechtigungen fortgesetzt werden kann."},{"n":276,"simulation":false,"prompt":"Das private Smartphone eines Mitarbeiters wurde gestohlen. Auf dem Smartphone ist das geschäftliche EMail-Konto des Mitarbeiters eingerichtet. Welche der folgenden Maßnahmen sollte als Erstes ergriffen werden, um zu verhindern, dass unbefugte Benutzer auf dieses E-Mail-Konto zugreifen?","options":[["A","Durchsetzung bestehender BYOD-Richtlinien"],["B","Das Passwort des E-Mail-Kontos ändern"],["C","Alle nicht-persönlichen Daten per Fernzugriff löschen"],["D","GPS und Geofencing aktivieren"]],"answers":["B"],"explanation":"Durch das Ändern des Passworts des E-Mail-Kontos wird das bestehende Authentifizierungstoken auf dem gestohlenen Gerät sofort ungültig gemacht und unbefugter Zugriff auf das Unternehmens-E-Mail-Konto verhindert. Dies ist die schnellste und direkteste Maßnahme zur Sicherung des Kontos, während weitere Schritte, wie beispielsweise das Fernlöschen, anschließend durchgeführt werden können."},{"n":277,"simulation":false,"prompt":"Ein Techniker muss eine ältere Unternehmensanwendung auf einem neuen Computer installieren. Der neue Computer erfüllt die Anforderungen der Anwendung nicht. Welche der folgenden Maßnahmen sollte der Techniker ergreifen, um sicherzustellen, dass die Anwendung korrekt installiert wird und läuft?","options":[["A","Verwenden Sie eine virtuelle Maschine, um ein älteres Betriebssystem zu emulieren."],["B","Führen Sie die Installation im abgesicherten Modus durch, um Treiberkonflikte zu vermeiden."],["C","Erhöhen Sie die Größe der Auslagerungsdatei, um mögliche Speicherprobleme zu bewältigen."],["D","Verwenden Sie ein Toolkit zur Anwendungskompatibilität, um etwaige Softwarekonflikte zu beheben."]],"answers":["A"],"explanation":"Durch die Verwendung einer virtuellen Maschine kann der Techniker ein älteres Betriebssystem installieren und ausführen, das die Anforderungen der Legacy-Anwendung erfüllt. Dies gewährleistet eine ordnungsgemäße Kompatibilität, indem die erforderliche Umgebung emuliert wird, ohne das primäre Betriebssystem des neuen Computers zu verändern."},{"n":278,"simulation":false,"prompt":"Welcher der folgenden Befehle wird verwendet, um die IP-Einstellungen eines Windows-Betriebssystems zu überprüfen?","options":[["A","ipconfig"],["B","net use"],["C","route print"],["D","ping"]],"answers":["A"],"explanation":"Der Befehl „ipconfig“ zeigt die aktuelle TCP/IP-Konfiguration eines Windows-Systems an, einschließlich IPAdresse, Subnetzmaske, Standard-Gateway und DNS-Informationen. Dies ermöglicht es einem Techniker, die IP-Einstellungen des Systems direkt über die Befehlszeile zu überprüfen und Fehler zu beheben."},{"n":279,"simulation":false,"prompt":"Ein Techniker entwickelt eine Lösung, um die lokalen Dokumente, Bilder und Dateien der Benutzer automatisch im Netzwerk zu speichern. Das Netzwerk befindet sich in einer Active-Directory-Umgebung. Was wird der Techniker höchstwahrscheinlich tun?","options":[["A","Die Systemwiederherstellung aktivieren."],["B","Erstellt Wiederherstellungspunkte."],["C","Die Ordnerumleitung konfigurieren."],["D","Windows-Server-Backups verwalten."]],"answers":["C"],"explanation":"Durch die Konfiguration der Ordnerumleitung in einer Active Directory-Umgebung können Benutzerordner wie „Dokumente“, „Bilder“ und „Desktop“ automatisch umgeleitet und auf einem Netzwerkserver gespeichert werden. Dadurch wird sichergestellt, dass Dateien zentral gespeichert, gesichert und zugänglich sind, unabhängig davon, an welchem domänengebundenen Computer sich der Benutzer anmeldet."},{"n":280,"simulation":false,"prompt":"Ein Benutzer kann vom Unternehmensnetzwerk aus nicht auf die Website eines externen Anbieters zugreifen. Welches der folgenden Windows-Befehlszeilentools sollte ein Techniker verwenden, um festzustellen, wo das Problem möglicherweise auftritt?","options":[["A","ipconfig"],["B","nslookup"],["C","ping"],["D","tracert"]],"answers":["D"],"explanation":"Der Befehl „tracert“ verfolgt den Weg, den Pakete zurücklegen, um ein Ziel zu erreichen, und zeigt jeden Hop entlang der Route an. Auf diese Weise kann der Techniker feststellen, an welcher Stelle die Kommunikation zwischen dem Unternehmensnetzwerk und der Website des externen Anbieters fehlschlägt."},{"n":281,"simulation":false,"prompt":"Ein Techniker möchte beim Zerlegen eines Geräts elektrische Schäden vermeiden. Der Techniker schaltet das Gerät aus. Was sollte der Techniker als Nächstes tun?","options":[["A","Den Computer auf eine antistatische Matte stellen."],["B","Auf einer Kunststoffoberfläche arbeiten."],["C","Die Bauteile in antistatische Beutel legen."],["D","Ein Handgelenkband an einem Metallrahmen befestigen."]],"answers":["D"],"explanation":"Durch das Anschließen eines Handgelenkbandes an einen geerdeten Metallrahmen wird sichergestellt, dass der Techniker ordnungsgemäß geerdet ist, wodurch elektrostatische Entladungen verhindert werden, die bei der Demontage interne Komponenten beschädigen könnten."},{"n":283,"simulation":false,"prompt":"Ein Kunde möchte eine externe Festplatte so formatieren, dass sie sowohl unter Windows als auch unter macOS funktioniert. Welches der folgenden Dateisysteme eignet sich hierfür am besten?","options":[["A","NTFS"],["B","exFAT"],["C","APFS"],["D","XFS"]],"answers":["B"],"explanation":"exFAT wird unter Windows und macOS sowohl für den Lese- als auch für den Schreibzugriff nativ unterstützt. Es wurde speziell für Wechseldatenträger entwickelt und unterstützt große Dateien und große Volumes, was es zur besten Wahl für plattformübergreifende Kompatibilität macht."},{"n":284,"simulation":false,"prompt":"Ein Benutzer muss mehrere Möglichkeiten zum Austausch von Software testen. Teil des Prozesses ist die Installation der verschiedenen Softwareoptionen auf einem mit dem Unternehmens-Image versehenen Sandbox-PC. Welche der folgenden Optionen ist die beste, um dem Benutzer die Installation der erforderlichen Software zu ermöglichen?","options":[["A","Fügen Sie den Benutzer der Gruppe „Domain-Administratoren“ hinzu."],["B","Fügen Sie den Benutzer der lokalen Gruppe „Administratoren“ hinzu."],["C","Lassen Sie den Benutzer die Anmeldedaten eines anderen Benutzers verwenden, der über die entsprechenden Rechte verfügt."],["D","Dem Benutzer das Passwort für das lokale Konto mit hohen Berechtigungen geben."]],"answers":["B"],"explanation":"Das Hinzufügen des Benutzers zur lokalen Administratorengruppe auf dem Sandbox-PC gewährt die erforderlichen Berechtigungen zum Installieren und Testen von Software, ohne übermäßige domänenweite Berechtigungen zu vergeben. Dies folgt dem Prinzip der geringsten Berechtigungen, indem der erweiterte Zugriff auf den für den Test erforderlichen Rechner beschränkt wird."},{"n":285,"simulation":false,"prompt":"Ein Techniker überprüft die folgende Workstation-Konfiguration: Die Workstation kann keine externen Websites öffnen. Der Browser zeigt eine Fehlermeldung an, dass die Website nicht erreichbar ist.","options":[["A","Es ist ein falsches DNS-Suffix zugewiesen."],["B","Die IP-Adresse der Workstation ist falsch."],["C","Das Standard-Gateway ist nicht festgelegt."],["D","Die Subnetzmaske ist falsch."]],"answers":["C"],"explanation":"Ohne ein gültiges Standard-Gateway verfügt die Workstation über keine Route zu Netzwerken außerhalb ihres lokalen Subnetzes. Dadurch kann sie keine externen Websites erreichen, was zu Fehlern wie „Website kann nicht erreicht werden“ führt, obwohl die IP-Adresse und die Subnetzmaske konfiguriert sind."},{"n":286,"simulation":false,"prompt":"Welcher der folgenden Befehle wird zur Verwaltung von Dateien unter einem Linux-Betriebssystem verwendet?","options":[["A","robocopy"],["B","curl"],["C","xcopy"],["D","cp"]],"answers":["D"],"explanation":"Der Befehl „cp“ unter Linux dient zum Kopieren und Verwalten von Dateien und Verzeichnissen innerhalb des Dateisystems. Er ist ein Standard-Dienstprogramm unter Linux für Dateiverwaltungsvorgänge."},{"n":287,"simulation":false,"prompt":"Ein Unternehmen verlangt von seinen Technikern, dass sie überprüfen, ob aus dem Internet heruntergeladene Dateien nicht verändert wurden. Welches der folgenden Verfahren sollten die Techniker zur Überprüfung verwenden?","options":[["A","Hash-Verfahren"],["B","SSL-Zertifikat"],["C","Plug-in"],["D","Erweiterungen"]],"answers":["A"],"explanation":"Durch das Hashing wird ein eindeutiger Prüfsummenwert für eine Datei generiert. Durch den Vergleich des berechneten Hashwerts der heruntergeladenen Datei mit dem ursprünglich veröffentlichten Hashwert können Techniker die Integrität der Datei überprüfen und sicherstellen, dass die Datei nicht verändert oder beschädigt wurde."},{"n":288,"simulation":false,"prompt":"Ein Entwickler nutzt ein KI-Tool, um einen komplexen Sortieralgorithmus für eine Webanwendung zu generieren. Welche der folgenden Optionen ist die beste Wahl, um den Code in seiner Anwendung rechtmäßig zu generieren?","options":[["A","Den generierten Code stillschweigend in seiner Anwendung verwenden"],["B","In seiner Anwendung Kommentare zum generierten Code einfügen"],["C","Den Urheber des generierten Codes in seiner Anwendung nennen"],["D","Die Quellen des KI-Tools auf urheberrechtlich geschützte Inhalte überprüfen"]],"answers":["D"],"explanation":"Um KI-generierten Code rechtmäßig zu nutzen, muss der Entwickler sicherstellen, dass der generierte Inhalt kein urheberrechtlich geschütztes Material ohne Genehmigung enthält. Die Überprüfung der vom KI-Tool verwendeten Quellen hilft dabei, sicherzustellen, dass der Code keine Rechte an geistigem Eigentum verletzt, und verringert das rechtliche Risiko."},{"n":289,"simulation":false,"prompt":"Was ist erforderlich, um eine zentrale Anmeldung für einen Windows-Computer zu nutzen?","options":[["A","Domänenmitgliedschaft"],["B","Arbeitsgruppe"],["C","Active Directory"],["D","Lokaler Gruppenrichtlinien-Editor"]],"answers":["A"],"explanation":"Ein Windows-Computer muss einer Domäne beigetreten sein, um eine zentralisierte Authentifizierung zu unterstützen. Durch die Domänenmitgliedschaft können sich Benutzer mit zentral verwalteten Anmeldeinformationen anmelden, die von Domänendiensten gesteuert werden, anstatt lokale Konten zu verwenden."},{"n":290,"simulation":false,"prompt":"Aufgrund aktueller Sicherheitsprobleme verlangt die Finanzabteilung eine kürzere Zeitüberschreitung für den Bildschirmschoner. Welche der folgenden Optionen sollte ein Techniker verwenden, um diese Aufgabe zu erledigen?","options":[["A","gpedit.msc"],["B","certmgr.msc"],["C","devmgmt.msc"],["D","perfmon.msc"]],"answers":["A"],"explanation":"gpedit.msc öffnet den Editor für lokale Gruppenrichtlinien, mit dem ein Techniker sicherheitsbezogene Einstellungen wie die Zeitüberschreitung des Bildschirmschoners und Richtlinien zum Passwortschutz konfigurieren kann, um kürzere Sperrzeiten bei Inaktivität durchzusetzen."},{"n":291,"simulation":false,"prompt":"Ein Benutzer stellt fest, dass der Datenverbrauch seines Smartphones deutlich gestiegen ist, auch wenn das Gerät nicht in Gebrauch ist. Das Telefon fühlt sich warm an und der Akku entlädt sich schnell. Was sollte der Benutzer tun, um dieses Problem zu beheben?","options":[["A","Auf schädliche Anwendungen prüfen."],["B","Deaktivieren Sie WLAN und Mobilfunknetze."],["C","Das Gerät auf die Werkseinstellungen zurücksetzen."],["D","Den Flugmodus vorübergehend aktivieren."]],"answers":["A"],"explanation":"Ungewöhnlicher Datenverbrauch, Überhitzung und schneller Akkuverbrauch sind häufige Anzeichen dafür, dass im Hintergrund schädliche Anwendungen ausgeführt werden. Der Nutzer sollte nach verdächtigen oder nicht autorisierten Apps suchen und diese entfernen, um unerwünschte Hintergrundaktivitäten zu unterbinden und das normale Verhalten des Geräts wiederherzustellen."},{"n":292,"simulation":false,"prompt":"Ein Benutzer versucht, ein bevorzugtes Textverarbeitungsprogramm auf seinem Arbeitslaptop zu installieren, doch die Installation schlägt jedes Mal fehl. Was ist höchstwahrscheinlich die Ursache für diesen Fehler?","options":[["A","Voller Browser-Cache"],["B","Langsame Internetgeschwindigkeit"],["C","Falsch konfigurierte ACL"],["D","Unformatierte Festplatte"]],"answers":["C"],"explanation":"Eine falsch konfigurierte Zugriffskontrollliste kann dazu führen, dass der Benutzer nicht über die erforderlichen Berechtigungen zur Installation von Software verfügt. Wenn dem Benutzer Schreib- oder Ausführungsberechtigungen für erforderliche Verzeichnisse oder Systembereiche fehlen, schlägt der Installationsvorgang fehl."},{"n":293,"simulation":false,"prompt":"Für die Bereitstellung einer neuen Software sind Administratorrechte erforderlich. Welche der folgenden Möglichkeiten ist die beste, um die erforderlichen Berechtigungen für die Installation der Software zu erteilen?","options":[["A","Just-in-Time-Zugriff gewähren"],["B","Zuweisung der Power-User-Rolle"],["C","Die Installation manuell durchführen"],["D","Hinzufügen des Benutzers zur lokalen Administratorengruppe"]],"answers":["A"],"explanation":"Die Gewährung von Just-in-Time-Zugriff gewährt vorübergehende Administratorrechte nur für die Dauer, die zur Durchführung der Installation erforderlich ist. Dieser Ansatz folgt dem Prinzip der geringsten Berechtigungen, indem er die Zeit, in der erweiterte Berechtigungen aktiv sind, minimiert, wodurch das Sicherheitsrisiko verringert wird, während die Software dennoch bereitgestellt werden kann."},{"n":294,"simulation":false,"prompt":"Ein Kunde ruft den Helpdesk an, um Probleme mit der Internetverbindung zu melden. Der Kunde ist frustriert, da er bereits mit anderen Mitarbeitern gesprochen hat, die sein Problem nicht lösen konnten. Ein HelpdeskMitarbeiter überprüft kurz die Kundendatei und stellt fest, dass mehrere frühere Tickets ungelöst sind. Welche der folgenden Maßnahmen sollte der Techniker ergreifen, um angemessen und professionell mit dem Kunden zu kommunizieren?","options":[["A","Den Kunden bitten, das Problem sofort zu schildern."],["B","Das Problem ohne weitere Gespräche an ein übergeordnetes Support-Team weiterleiten."],["C","Sich die Bedenken des Kunden anhören und seine Frustration anerkennen."],["D","Dem Kunden erklären, dass die vorherigen Techniker die Standardverfahren befolgt haben."]],"answers":["C"],"explanation":"Dem Kunden aktiv zuzuhören und seine Frustration anzuerkennen, zeugt von Empathie und Professionalität. Dies trägt dazu bei, die Situation zu entschärfen, eine vertrauensvolle Beziehung aufzubauen und ein kooperativeres Umfeld für die Lösung des Problems zu schaffen."},{"n":295,"simulation":false,"prompt":"Was ist in einem Sicherheitsdatenblatt (SDS) für eine Notstromversorgung enthalten?","options":[["A","Montageanleitung"],["B","Notfallmaßnahmen"],["C","Konfigurationsschritte"],["D","Spannungsangaben"]],"answers":["B"],"explanation":"Ein Sicherheitsdatenblatt enthält Informationen zu Gefahren, Handhabung, Lagerung und Notfallmaßnahmen im Zusammenhang mit einem Produkt. Bei einer Notstromversorgung umfasst es Anweisungen dazu, wie im Falle von Kontakt, Leckagen, Verschüttungen oder anderen Gefahrensituationen vorzugehen ist."},{"n":296,"simulation":false,"prompt":"Mit welchem der folgenden Dateitypen können macOS-Benutzer Software vollständig deinstallieren, indem sie die Datei in den Papierkorb verschieben?","options":[["A","."],["B",".msi"],["C",".exe"],["D",".rpm"],["E",".pkg"]],"answers":["A"],"explanation":"Unter macOS können als .app-Bundles gepackte Anwendungen in der Regel durch Ziehen in den Papierkorb deinstalliert werden. Die Anwendung und die zugehörigen ausführbaren Komponenten sind im Bundle enthalten, sodass sie durch einfaches Löschen entfernt werden können."},{"n":297,"simulation":false,"prompt":"Ein Benutzer muss einige Dateien von der Website eines Anbieters herunterladen. Das Herunterladen des spezifischen Dateityps wird bei Verwendung des Webbrowsers Microsoft Edge blockiert. Ein Techniker stellt fest, dass die Dateien, die der Benutzer herunterladen möchte, sicher sind. Welche der folgenden Einstellungen sollte der Techniker vornehmen, um das Herunterladen dieser Dateien zu ermöglichen?","options":[["A","Defender"],["B","SmartScreen"],["C","Benutzerkontensteuerung"],["D","Firewall"]],"answers":["B"],"explanation":"Microsoft Edge nutzt SmartScreen, um potenziell unsichere Downloads zu blockieren. Wenn ein bekannter sicherer Dateityp blockiert wird, kann durch Konfigurieren oder Anpassen der SmartScreen-Einstellungen der Download fortgesetzt werden, während die browserbasierten Sicherheitskontrollen weiterhin gewährleistet sind."},{"n":298,"simulation":false,"prompt":"Welche der folgenden Sicherheitsmaßnahmen befasst sich mit dem Problem der Informationsexfiltration?","options":[["A","DLP"],["B","MDM"],["C","SAML"],["D","IAM"]],"answers":["A"],"explanation":"Data Loss Prevention dient dazu, die unbefugte Übermittlung sensibler Daten außerhalb des Unternehmens zu überwachen, zu erkennen und zu verhindern. Es wirkt direkt gegen den Informationsabfluss, indem es den Zugriff auf Daten sowie deren Weitergabe und Übertragung kontrolliert."},{"n":299,"simulation":false,"prompt":"Ein Administrator muss Computer für Remote-Benutzer konfigurieren. Die Computer werden vom Hersteller direkt an die Benutzer versandt. Welche der folgenden Lösungen sollte der Administrator verwenden?","options":[["A","Neuinstallation"],["B","Zero-Touch-Bereitstellung"],["C","Remote-Desktop-Protokoll"],["D","Private Cloud"]],"answers":["B"],"explanation":"Die Zero-Touch-Bereitstellung ermöglicht es, Geräte bereits vor dem ersten Einschalten durch den Endbenutzer vorkonfigurieren und automatisch bereitstellen zu lassen. Dadurch können Remote-Benutzer Systeme direkt vom Hersteller erhalten, die automatisch mit den Unternehmenseinstellungen konfiguriert sind, ohne dass ein manueller Eingriff der IT-Abteilung erforderlich ist."},{"n":300,"simulation":false,"prompt":"Ein hoher Prozentsatz der Benutzer in einem Büro dokumentiert auf ihren lokalen Computern. Das Büro muss auf die nächste Windows-Version umsteigen. Welche der folgenden Methoden sollte ein Techniker anwenden?","options":[["A","Netzwerkinstallation per Fernzugriff"],["B","Zero-Touch-Bereitstellung"],["C","Upgrades vor Ort"],["D","Neuinstallation"]],"answers":["C"],"explanation":"Bei einem In-Place-Upgrade bleiben vorhandene Benutzerdaten, Anwendungen und Einstellungen während der Aktualisierung des Betriebssystems erhalten. Da viele Benutzer Dokumente lokal speichern, minimiert diese Methode das Risiko eines Datenverlusts und reduziert den Aufwand für eine umfangreiche Dateiwiederherstellung nach dem Upgrade."},{"n":301,"simulation":false,"prompt":"Ein SOHO-Kunde kauft einen Windows 11-Computer. Als der Techniker versucht, den Computer in die Domäne aufzunehmen, ist die Option ausgegraut. Welche der folgenden Aussagen erklärt, warum die Option nicht verfügbar ist?","options":[["A","Das Betriebssystem des Computers muss auf die neueste Version aktualisiert werden."],["B","Die Netzwerkeinstellungen müssen in der Pro-Edition von Windows geändert werden."],["C","Der Computer muss neu gestartet werden, damit neue Gruppenrichtlinien übernommen werden."],["D","Das Betriebssystem des Computers ist die Home-Edition."]],"answers":["D"],"explanation":"Die Windows Home-Edition unterstützt den Beitritt zu einer Active Directory-Domäne nicht. Nur die Professional-, Enterprise- und Education-Editionen verfügen über Funktionen zum Beitritt zu einer Domäne, weshalb die Option nicht verfügbar ist."},{"n":302,"simulation":false,"prompt":"Ein Techniker hat kürzlich eine Festplatte aus einem ausgemusterten PC eingebaut. Der Techniker möchte sie für die Datenspeicherung wiederverwenden, kann jedoch nicht alle Partitionen im grafischen Festplattenverwaltungstool löschen. Was sollte der Techniker als Nächstes tun?","options":[["A","Die Festplatte wieder in den ursprünglichen Computer einbauen und das BIOS-Passwort löschen."],["B","Von einer Linux-Rettungs-CD booten und die gesamte Malware entfernen."],["C","Die Befehlszeilenschnittstelle über eine Eingabeaufforderung mit erhöhten Rechten nutzen."],["D","Die Festplatte an den Hersteller zur Low-Level-Formatierung zurücksenden."]],"answers":["C"],"explanation":"Die Verwendung der Befehlszeilenschnittstelle in einer Eingabeaufforderung mit erhöhten Rechten ermöglicht es dem Techniker, Tools wie DiskPart zu nutzen, um geschützte oder hartnäckige Partitionen zwangsweise zu entfernen, die über das grafische Dienstprogramm „Datenträgerverwaltung“ nicht gelöscht werden können."},{"n":303,"simulation":false,"prompt":"Ein Techniker stellt fest, dass viele Websites Benutzer zur Eingabe von Anmelde- und Zahlungsdaten auffordern. Der Techniker möchte, dass der Browser die Kommunikation verschlüsselt. Welche der folgenden Maßnahmen trägt am besten zum Schutz sensibler Daten bei?","options":[["A","Alle Cookies deaktivieren"],["B","JavaScript deaktivieren"],["C","Aktivierung eines Popup-Blockers"],["D","Den „Nur-HTTPS“-Modus aktivieren"]],"answers":["D"],"explanation":"Durch die Aktivierung des „Nur-HTTPS“-Modus wird der Browser gezwungen, verschlüsselte HTTPSVerbindungen anstelle von unverschlüsseltem HTTP zu verwenden. Dadurch wird sichergestellt, dass Anmeldedaten und Zahlungsdetails sicher mittels TLS-Verschlüsselung übertragen werden, wodurch sensible Daten vor dem Abfangen geschützt werden."},{"n":304,"simulation":false,"prompt":"Ein leitender Administrator bittet einen Helpdesk-Techniker, eine Reihe von Befehlen auf einem RemoteNetzwerk-Switch auszuführen. Nach der Ausführung der Befehle muss der Techniker die Ausgabe erfassen und dem Administrator zur Verfügung stellen. Welche der folgenden Optionen sollte der Techniker verwenden, um die Anfrage des Administrators zu erfüllen?","options":[["A","RDP"],["B","WinRM"],["C","SSH"],["D","VNC"]],"answers":["C"],"explanation":"SSH bietet einen sicheren Befehlszeilenzugriff auf entfernte Netzwerkgeräte wie Switches. Damit kann der Techniker Verwaltungsbefehle aus der Ferne ausführen und die Befehlsausgabe sicher für den Administrator erfassen."},{"n":305,"simulation":false,"prompt":"Ein Benutzer kann sich nicht an seinem Computer anmelden. Ein Techniker stellt fest, dass das Benutzerkonto entsperrt ist, und setzt das Passwort zurück. Der Techniker versucht, sich mit den neuen Anmeldedaten anzumelden, erhält jedoch eine Fehlermeldung bezüglich der Vertrauensbeziehung. Was sollte der Techniker als Nächstes tun?","options":[["A","Das Gerät erneut in die Domäne aufnehmen."],["B","Überprüfen, ob eine Netzwerkverbindung besteht."],["C","Das Ethernet-Kabel austauschen."],["D","Sich mit einem anderen Konto anmelden."]],"answers":["A"],"explanation":"Ein Fehler bei der Vertrauensbeziehung weist darauf hin, dass die sichere Verbindung zwischen dem Computer und dem Domänencontroller unterbrochen wurde. Durch die erneute Einbindung des Geräts in die Domäne wird diese sichere Verbindung wiederhergestellt und die ordnungsgemäße Authentifizierung bei der Domäne wieder gewährleistet."},{"n":306,"simulation":false,"prompt":"Ein beliebtes Spiel friert häufig ein und stürzt auf dem Gerät eines Mobilfunknutzers ab. Der Nutzer aktualisiert das Betriebssystem, doch das Problem besteht weiterhin. Das Gerät ist ein Jahr alt und verfügt über reichlich freien Speicherplatz. Welcher der folgenden Schritte ist der am besten geeignete erste Schritt zur Behebung dieses Problems?","options":[["A","Neuinstallation der Anwendung"],["B","Das Gerät auf die Werkseinstellungen zurücksetzen"],["C","Hintergrundanwendungen deaktivieren"],["D","Ändern der Datums- und Uhrzeiteinstellungen des Geräts"]],"answers":["A"],"explanation":"Die Neuinstallation der Anwendung ist der sinnvollste erste Schritt, da das Problem möglicherweise durch beschädigte App-Dateien oder ein fehlerhaftes Update verursacht wird. Durch das Entfernen und erneute Installieren des Spiels werden dessen Dateien und Einstellungen aktualisiert, ohne dass der Rest des Geräts davon betroffen ist."},{"n":307,"simulation":false,"prompt":"Tausende kompromittierte Rechner versuchen, gefälschte Käufe in einem Online-Shop zu tätigen. Was findet dabei statt?","options":[["A","Brute-Force-Angriff"],["B","Spoofing"],["C","DDoS"],["D","SQL-Injection"]],"answers":["C"],"explanation":"Ein verteilter Denial-of-Service-Angriff liegt vor, wenn viele kompromittierte Rechner, die oft Teil eines Botnetzes sind, große Datenmengen in Richtung eines Zielsystems generieren. Dies überlastet die Ressourcen des Online-Shops Online-Shops überlastet und den normalen Betrieb, wie z. B. legitime Käufe, stört."},{"n":308,"simulation":false,"prompt":"Welcher der folgenden Dateitypen eignet sich am besten für die Ausführung automatisierter Aufgaben beim Systemstart auf einem Windows-Computer?","options":[["A","SH"],["B","MSI"],["C","BAT"],["D","EXE"]],"answers":["C"],"explanation":"Eine .bat-Datei ist ein Batch-Skript, das unter Windows verwendet wird, um eine Reihe von Befehlen automatisch auszuführen. Es wird häufig für automatisierte Aufgaben beim Systemstart verwendet, indem das Skript im Ordner „Autostart“ abgelegt oder über den Taskplaner konfiguriert wird."},{"n":309,"simulation":false,"prompt":"Ein Endbenutzer meldet, dass sein Computer Windows nicht lädt. Was sollte ein Techniker überprüfen, nachdem er die Computerhardware inspiziert und sichergestellt hat, dass sie ordnungsgemäß funktioniert?","options":[["A","Startreihenfolge"],["B","Dateisystem"],["C","Verschlüsselung"],["D","Treiber"]],"answers":["A"],"explanation":"Wenn die Hardware ordnungsgemäß funktioniert, Windows jedoch nicht geladen wird, sollte der Techniker überprüfen, ob das System so konfiguriert ist, dass es vom richtigen Laufwerk bootet. Eine falsche BootReihenfolge kann dazu führen, dass das System das installierte Betriebssystem nicht findet."},{"n":310,"simulation":false,"prompt":"Welche der folgenden Aussagen beschreibt am besten eine sicherheitsrelevante Auswirkung der Verwendung von Software, deren Lebenszyklus beendet ist (EOL)?","options":[["A","Die Software funktioniert nicht mehr."],["B","Der Anbieter wird zukünftige Funktionen nicht mehr unterstützen."],["C","Neue Sicherheitslücken werden nicht behoben."],["D","Den Nutzern entstehen höhere Lizenzkosten."]],"answers":["C"],"explanation":"Wenn eine Software das Ende ihrer Lebensdauer erreicht, stellt der Anbieter keine Sicherheitsupdates oder Patches mehr bereit. Das bedeutet, dass neu entdeckte Sicherheitslücken unbehoben bleiben, was das Risiko von Missbrauch und Sicherheitsverletzungen erhöht."},{"n":311,"simulation":false,"prompt":"Ein Endbenutzer sieht häufig Bildschirmmeldungen von einer Einzelhandelswebsite, die er vor einer Woche besucht hat. Ein Techniker untersucht den Fall und stellt fest, dass der Popup-Blocker aktiviert ist. Was sollte der Techniker als Nächstes tun?","options":[["A","Den Browser auf die Standardeinstellungen zurücksetzen."],["B","Die Benachrichtigungen im Browser deaktivieren."],["C","Den Browser deinstallieren und neu installieren."],["D","Den Browser-Cache leeren."]],"answers":["B"],"explanation":"Häufig erscheinende Bildschirmmeldungen von einer zuvor besuchten Website sind höchstwahrscheinlich Browser-Push-Benachrichtigungen und keine herkömmlichen Pop-ups. Durch das Deaktivieren der WebsiteBenachrichtigungen in den Browsereinstellungen werden diese Meldungen unterbunden, ohne dass ein vollständiges Zurücksetzen oder eine Neuinstallation des Browsers erforderlich ist."},{"n":312,"simulation":false,"prompt":"Ein Endbenutzer kann nicht auf einem Netzwerkdrucker drucken, hat aber Zugriff auf alle anderen Ressourcen im Netzwerk zugreifen. Andere Benutzer in der Organisation haben keine Probleme beim Drucken. Ein Techniker öffnet die Druckwarteschlange auf dem Computer des Benutzers und stellt fest, dass der Druckauftrag fehlgeschlagen ist. Welcher der folgenden Schritte ist der nächste Schritt zur Behebung des Problems?","options":[["A","Ein Testdokument von einem anderen Computer im Netzwerk drucken"],["B","Neustart des Druckspoolers über die Dienste"],["C","Den Drucker vom Computer entfernen und neu installieren"],["D","Den Computer neu starten und erneut versuchen zu drucken"]],"answers":["B"],"explanation":"Da andere Benutzer drucken können und der Druckauftrag in der lokalen Druckwarteschlange fehlgeschlagen ist, hängt das Problem wahrscheinlich mit dem Druckspooler-Dienst auf dem Computer des Benutzers zusammen. Durch das Neustarten des Druckspoolers werden festgefahrene Druckaufträge gelöscht und der Druckdienst zurückgesetzt, sodass neue Druckaufträge korrekt verarbeitet werden können."},{"n":313,"simulation":false,"prompt":"Ein Endbenutzer kann nicht auf das Intranet zugreifen. Ein Techniker muss überprüfen, ob der WindowsWebserver online ist und ordnungsgemäß funktioniert. Welche der folgenden Standardtechnologien für den Fernzugriff würde der Techniker am ehesten verwenden, um eine Fernverbindung zum Server herzustellen?","options":[["A","SPICE"],["B","VNC"],["C","RDP"],["D","SSH"]],"answers":["C"],"explanation":"Das Remote Desktop Protocol ist die Standardtechnologie für den Fernzugriff auf Windows-Server. Es ermöglicht einem Techniker, sich aus der Ferne beim Windows-Webserver anzumelden, dessen Status zu überprüfen und sicherzustellen, dass der Webdienst ordnungsgemäß läuft."},{"n":314,"simulation":false,"prompt":"Die IT-Abteilung eines Unternehmens stellt fest, dass auf mehreren Arbeitsplätzen nicht autorisierte Software installiert wurde. Der IT-Leiter fordert eine Überprüfung und eine Aktualisierung der Sicherheitsmaßnahmen mit dem Schwerpunkt auf der Verhinderung künftiger nicht autorisierter Softwareinstallationen. Welche der folgenden Maßnahmen sollte das Unternehmen ergreifen?","options":[["A","Administratorrechte von Konten entfernen."],["B","Die Firewall der Arbeitsstationen aktivieren."],["C","Windows Defender SmartScreen aktivieren."],["D","EDR auf allen Geräten installieren."]],"answers":["A"],"explanation":"Durch das Entziehen der Administratorrechte bei Standardbenutzerkonten wird verhindert, dass Benutzer nicht autorisierte Software zu installieren. Die Einschränkung erweiterter Berechtigungen setzt das Prinzip der geringsten Berechtigungen durch und verringert direkt die Möglichkeit, nicht genehmigte Anwendungen auf Arbeitsstationen zu installieren."}];
