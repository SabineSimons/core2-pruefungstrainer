"Der Computer eines Benutzers läuft langsam. Das Öffnen von Webseiten dauert mehrere Sekunden, und Anwendungen reagieren nur langsam auf Benutzereingaben. Ein Techniker öffnet den Windows-TaskManager und sieht folgende Informationen: Festplatte: 2 % Netzwerk: 12 % GPU: 15 % CPU: 70 % Arbeitsspeicher: 97 % Welche der folgenden Maßnahmen würde ein Techniker am ehesten ergreifen, um das Problem zu beheben?","options":[["A","Den Cache des Browsers leeren."],["B","Die Netzwerkverbindung verbessern."],["C","Nicht benötigte Programme schließen."],["D","Temporäre Dateien löschen."]],"answers":["C"],"explanation":"Durch das Schließen nicht benötigter Programme wird Speicherplatz freigegeben – die Speicherauslastung liegt derzeit bei 97 % – und die Gesamtleistung des Computers verbessert."},{"n":99,"simulation":false,"prompt":"Ein Angreifer nutzt mehrere Endpunkte, die über verschiedene Standorte verteilt sind, um einen einzelnen Endpunkt anzugreifen. Welche der folgenden Aussagen beschreibt diese Bedrohung?","options":[["A","On-Path-Angriff"],["B","Structured Query Language-Injektion"],["C","Brute-Force-Angriff"],["D","Verteilter Denial-of-Service-Angriff"]],"answers":["D"],"explanation":"Bei einem verteilten Denial-of-Service-Angriff (DDoS) greifen mehrere Endpunkte von verschiedenen Standorten aus einen einzelnen Endpunkt an, um dessen Dienste zu stören."},{"n":100,"simulation":false,"prompt":"Ein Benutzer beschließt, von Linux auf Windows umzusteigen, und versucht, Daten mithilfe einer externen USB-Festplatte zu migrieren. Wenn der Benutzer jedoch das Kabel an den Windows-Rechner anschließt, erscheint eine Fehlermeldung, dass das Gerät vor der Verwendung formatiert werden muss. An den LinuxRechner angeschlossen funktioniert die Festplatte wie erwartet. Was sollte der Benutzer tun, um dieses Problem zu beheben?","options":[["A","Die Windows-Firewall so konfigurieren, dass Daten von Linux-Systemen zugelassen werden."],["B","Das Kabel durch Windows-kompatible Hardware ersetzen."],["C","Ein Firmware-Update des PC-Herstellers installieren."],["D","Das Dateisystem auf exFAT aktualisieren."]],"answers":["D"],"explanation":"Durch die Aktualisierung des Dateisystems auf exFAT wird die Kompatibilität zwischen Linux und Windows gewährleistet, sodass die Festplatte von beiden Betriebssystemen gelesen und beschrieben werden kann."},{"n":101,"simulation":false,"prompt":"Ein Endbenutzer entdeckt einen Virus auf seinem Computer. Ein Techniker stellt den Computer unter Quarantäne, führt einen Virenscan durch und beseitigt die Infektion. Welchen der folgenden Schritte sollte der Techniker als Nächstes unternehmen?","options":[["A","Einen zweiten Virenscan durchführen."],["B","Den Endnutzer aufklären."],["C","Den Computer neu installieren."],["D","Die Systemprotokolle überprüfen."]],"answers":["B"],"explanation":"Die Aufklärung des Endnutzers ist der nächste Schritt, um zukünftige Infektionen zu verhindern, indem man ihn über sichere Vorgehensweisen und die Vermeidung ähnlicher Bedrohungen informiert."},{"n":102,"simulation":false,"prompt":"Ein Administrator benötigt Informationen zu einem Server, um den Produktverantwortlichen zu ermitteln und festzustellen, ob auf dem Server geschäftskritische Dienste ausgeführt werden. Auf welche der folgenden Quellen kann der Administrator zurückgreifen, um diese Informationen zu finden?","options":[["A","CMDB"],["B","SLA"],["C","SOP"],["D","EULA"]],"answers":["A"],"explanation":"Eine CMDB (Configuration Management Database) enthält Details zu IT-Assets, einschließlich der Produktverantwortung und des geschäftskritischen Servicestatus."},{"n":103,"simulation":false,"prompt":"Ein Administrator muss das Administratorkonto auf einem Windows-Desktop umbenennen. Welches der folgenden Tools eignet sich am besten für diese Aufgabe?","options":[["A","lusrmgr.msc"],["B","devmgmt.msc"],["C","gpedit.msc"],["D","eventvwr.msc"]],"answers":["A"],"explanation":"Die Verwaltungskonsole für lokale Benutzer und Gruppen (lusrmgr.msc) ist das beste Tool, um das Administratorkonto auf einem Windows-Desktop umzubenennen."},{"n":104,"simulation":false,"prompt":"Welche der folgenden Malware-Arten beansprucht in der Regel sehr viele Rechenressourcen?","options":[["A","Rootkit"],["B","Kryptominer"],["C","Bootsektorvirus"],["D","Trojaner"]],"answers":["B"],"explanation":"Cryptominer-Malware nutzt erhebliche Rechenressourcen zum Schürfen von Kryptowährungen, was zu einer sehr hohen Ressourcenauslastung führt."},{"n":105,"simulation":false,"prompt":"Der Akku des Smartphones eines Nutzers entlädt sich schnell, wenn der Nutzer auf Reisen ist. Das Smartphone wurde vor zwei Wochen ausgetauscht. Was sollte ein Techniker als Erstes tun?","options":[["A","Den Akku durch einen mit höherer Kapazität ersetzen."],["B","Eine externe Batterie bereitstellen, um die Nutzungsdauer zu verlängern."],["C","Sicherstellen, dass der Ladeanschluss ordnungsgemäß funktioniert."],["D","Nach den Anwendungen suchen, die die höchste Auslastung aufweisen."]],"answers":["D"],"explanation":"Der Techniker sollte zunächst nach Anwendungen suchen, die die höchste Auslastung aufweisen, da einige Apps oder Dienste möglicherweise übermäßig viel Akku verbrauchen, insbesondere wenn der Nutzer unterwegs ist."},{"n":106,"simulation":false,"prompt":"Ein Techniker sichert eine neu bereitgestellte Workstation, auf die nur zugewiesene Benutzer Zugriff haben. Welche der folgenden Maßnahmen sollte der Techniker ergreifen, um zu verhindern, dass unbefugte Benutzer auf die Workstation zugreifen? (Wählen Sie zwei aus.)","options":[["A","Die Festplatte defragmentieren."],["B","SSH aktivieren."],["C","Bildschirmschoner-Sperren aktivieren."],["D","Deaktivieren Sie die iCloud-Integration."],["E","Die Firewall aktivieren."],["F","Legen Sie ein BIOS-Passwort fest."]],"answers":["C","F"],"explanation":"Durch die Aktivierung der Bildschirmsperre wird sichergestellt, dass nach einer bestimmten Zeit der Inaktivität nur autorisierte Benutzer auf die Workstation zugreifen können. Das Festlegen eines BIOS-Passworts verhindert, dass unbefugte Benutzer die Startoptionen ändern oder beim Systemstart auf den Arbeitsplatzrechner zugreifen können."},{"n":107,"simulation":false,"prompt":"Ein Reisender, der international unterwegs ist, befürchtet, dass andere Personen auf die Inhalte seines Smartphones zugreifen könnten, falls es verloren geht oder gestohlen wird. Der Reisende hat die biometrische Authentifizierung aktiviert. Welche der folgenden zusätzlichen Sicherheitsmaßnahmen verringert das Risiko eines unbefugten Datenzugriffs weiter?","options":[["A","Fern-Backups"],["B","Standortverfolgung"],["C","PIN-Code-Bildschirmsperre"],["D","Geräteverschlüsselung"]],"answers":["D"],"explanation":"Die Geräteverschlüsselung verringert das Risiko eines unbefugten Datenzugriffs zusätzlich, indem sie sicherstellt, dass die Inhalte des Smartphones ohne ordnungsgemäße Authentifizierung nicht gelesen werden können, selbst wenn das Gerät verloren geht oder gestohlen wird."},{"n":108,"simulation":false,"prompt":"Ein Sachbearbeiter einer Kleinstadt möchte von zu Hause aus mit einem vom Rathaus bereitgestellten Laptop arbeiten. Der Sachbearbeiter muss auf Dokumente auf dem Server des Rathauses zugreifen können. Welche der folgenden Lösungen muss ein Techniker für den Sachbearbeiter einrichten?","options":[["A","VNC"],["B","RDP"],["C","VPN"],["D","SSH"]],"answers":["C"],"explanation":"Es sollte ein VPN (Virtual Private Network) eingerichtet werden, um den Laptop des Sachbearbeiters sicher mit dem Netzwerk des Rathauses zu verbinden und so den Zugriff auf Serverdokumente von zu Hause aus zu ermöglichen."},{"n":109,"simulation":false,"prompt":"Ein Unternehmen wendet die 3-2-1-Backup-Regel an. Was sollte das Unternehmen tun?","options":[["A","Sowohl vollständige als auch differenzielle Backups durchführen."],["B","Die Integrität der Backups alle drei Wochen prüfen."],["C","Alle Sicherungsmedien vor Ort aufbewahren, um eine schnelle Wiederherstellung zu gewährleisten."],["D","Mindestens zwei verschiedene Medientypen verwenden."]],"answers":["D"],"explanation":"Die 3-2-1-Sicherungsregel empfiehlt, mindestens zwei verschiedene Medientypen zu verwenden, um Datenredundanz und -schutz zu gewährleisten."},{"n":110,"simulation":false,"prompt":"Ein Teammitglied stellt einen Link zu einer Online-Präsentation bereit, damit andere Teammitglieder die Präsentation ergänzen können. Der Link funktioniert bei keinem der anderen Teammitglieder. Was sollte das Team als Erstes überprüfen?","options":[["A","Versionsverlauf"],["B","Kompatibilität mit Webbrowsern"],["C","Anzeige- und Freigabeberechtigungen"],["D","Lizenzverwaltung"]],"answers":["C"],"explanation":"Das Team sollte zunächst die Anzeige- und Freigabeberechtigungen überprüfen, da falsche Berechtigungen der wahrscheinlichste Grund dafür sind, dass andere nicht auf die Online-Präsentation zugreifen oder diese bearbeiten können."},{"n":111,"simulation":false,"prompt":"Ein Support-Techniker erhält einen Computer, dessen Touchpad nicht reagiert. Das Touchpad scheint keine äußeren Beschädigungen aufzuweisen. Welches der folgenden Tools sollte der Techniker verwenden, um den Treiber des Touchpads zu überprüfen?","options":[["A","Systemkonfiguration"],["B","Geräte-Manager"],["C","Ereignisanzeige"],["D","Lokale Benutzer und Gruppen"]],"answers":["B"],"explanation":"Der Geräte-Manager ist das Tool, mit dem der Status und die Funktionsfähigkeit von Hardwaretreibern, einschließlich des Touchpad-Treibers, überprüft werden können."},{"n":112,"simulation":false,"prompt":"Ein Benutzer benennt eine .txt-Datei in eine .xml-Datei um. Nach der Umbenennung der Datei zeigt der Windows Explorer den Dateinamen als „Document.xml“ an. In den Dateieigenschaften wird der Dateityp jedoch als „Textdokument (.txt)“ angezeigt. Mit welcher der folgenden Einstellungen kann der Benutzer den Dateityp korrekt ändern?","options":[["A","Indizierungsoptionen"],["B","Befehl „Formatieren“"],["C","Personalisierung"],["D","Erweiterungen ausblenden"]],"answers":["D"],"explanation":"Die Einstellung „Dateiendungen ausblenden“ legt fest, ob Dateiendungen im Windows Explorer angezeigt werden. Wenn diese Option deaktiviert ist, können Benutzer die Dateiendung und damit den Dateityp korrekt ändern."},{"n":113,"simulation":false,"prompt":"Ein Techniker kann einen Desktop-Computer nicht von Windows 10 auf Windows 11 aktualisieren. Welche der folgenden Ursachen verhindert höchstwahrscheinlich die Aktualisierung?","options":[["A","Fehlendes TPM-Modul"],["B","Niedrige Drehzahl der Festplatte"],["C","Niedrige Bildwiederholfrequenz"],["D","Hohe RAM-Latenz"]],"answers":["A"],"explanation":"Ein fehlendes TPM (Trusted Platform Module) ist eine gängige Voraussetzung für Windows 11, und dessen Fehlen verhindert höchstwahrscheinlich das Upgrade."},{"n":114,"simulation":false,"prompt":"Ein Benutzer kann von seinem Mobiltelefon aus außerhalb des Büros keine Dateien auf die Unternehmensserver hochladen, während das Hochladen von Dateien im Büro problemlos funktioniert. Der Benutzer hat kurz eine Fehlermeldung gesehen, diese jedoch geschlossen, bevor er sie gelesen hat. Was sollte ein Techniker tun, um die Ursache zu ermitteln?","options":[["A","Das Datenvolumenlimit überprüfen."],["B","Den Flugmodus aktivieren."],["C","Den letzten Neustart des Geräts überprüfen."],["D","Die Bluetooth-Verbindung aktivieren."]],"answers":["A"],"explanation":"Durch die Überprüfung des Datenverbrauchslimits lässt sich feststellen, ob das Mobiltelefon sein Datenkontingent überschritten hat oder ob Einschränkungen bestehen, die das Hochladen von Dateien außerhalb des Büros verhindern."},{"n":115,"simulation":false,"prompt":"Ein Desktop-Techniker ordnet eine entfernte Windows-Freigabe \\\\WinNAS\\shared als lokales Laufwerk z: zu. Welchen der folgenden Befehle sollte der Techniker ausführen?","options":[["A","nslookup -opt Z: \\\\WinNAS\\shared"],["B","net use Z: \\\\WinNAS\\shared"],["C","chkdsk /R Z: \\\\WinNAS\\shared"],["D","sfc /offwindir Z: \\\\WinNAS\\shared"]],"answers":["B"],"explanation":"Der richtige Befehl, um eine Netzwerkfreigabe als lokalen Laufwerksbuchstaben zuzuordnen, lautet: net use Z: \\\\WinNAS\\shared."},{"n":116,"simulation":false,"prompt":"Ein Techniker muss die Ruhezustands-Einstellungen auf einem Windows-Computer mithilfe einer Batch-Datei ändern. Domänenrichtlinien stehen nicht zur Verfügung. Welche der folgenden Möglichkeiten eignet sich am besten, um dieses Ziel zu erreichen?","options":[["A","Aktualisieren Sie die Energieoptionen in der Systemsteuerung."],["B","Die Firmware des Computers aktualisieren."],["C","Führen Sie „gpupdate“ über die Eingabeaufforderung aus."],["D","Den Befehl „powercfg“ in PowerShell verwenden."]],"answers":["D"],"explanation":"Der Befehl „powercfg“ in PowerShell oder der Eingabeaufforderung kann die Einstellungen für den Ruhezustand ändern und eignet sich für die Verwendung in einer Batch-Datei."},{"n":117,"simulation":false,"prompt":"Ein Kunde berichtet, dass sich die Startseite seines Browsers geändert hat. Jedes Mal, wenn er eine Internetsuche durchführt, werden Ergebnisse von unbekannten Websites angezeigt. Welche der folgenden Maßnahmen sollte ein Techniker als Erstes ergreifen, um das Problem zu beheben? (Wählen Sie zwei aus.)","options":[["A","Den Browserverlauf löschen."],["B","Betriebssystem-Updates durchführen."],["C","Das Systemdatum und die Systemzeit überprüfen."],["D","Schädliche Erweiterungen deinstallieren."],["E","Die Startseite des Browsers zurücksetzen."],["F","Starten Sie den Computer des Benutzers neu."]],"answers":["D","E"],"explanation":"Durch das Deinstallieren schädlicher Erweiterungen können unerwünschte Änderungen rückgängig gemacht und weiteres Hijacking-Verhalten verhindert werden. Das Zurücksetzen der Startseite des Browsers stellt die ursprüngliche Startseite wieder her und beseitigt unerwünschte Weiterleitungen."},{"n":118,"simulation":false,"prompt":"Ein Windows-Benutzer hat Probleme beim Zugriff auf eine Dateifreigabe. Der Techniker möchte den Benutzernamen überprüfen, mit dem der Computer derzeit angemeldet ist. Welchen der folgenden Befehle sollte der Techniker verwenden?","options":[["A","net user"],["B","tracert"],["C","whoami"],["D","hostname"]],"answers":["C"],"explanation":"Der Befehl „whoami“ zeigt den Benutzernamen des aktuell angemeldeten Benutzers unter Windows an."},{"n":119,"simulation":false,"prompt":"Ein Techniker befolgt die korrekte Vorgehensweise zur Entfernung von Malware auf einem infizierten Computer. Da es ihm jedoch nicht gelingt, die gesamte Malware zu entfernen, beschließt er, das Betriebssystem neu zu installieren. Welche der folgenden Optionen sollte der Techniker auswählen?","options":[["A","Versions-Upgrade"],["B","Systemwiederherstellung"],["C","Betriebssystemreparatur"],["D","Neuinstallation"]],"answers":["D"],"explanation":"Bei einer Neuinstallation werden das aktuelle Betriebssystem und alle vorhandenen Daten entfernt, wodurch sichergestellt wird, dass jegliche Malware aus dem System entfernt wird."},{"n":120,"simulation":false,"prompt":"Ein Techniker druckt im 3D-Druckverfahren hochfeste Teile aus einem Filament auf Carbonfaserbasis für einen Kundenauftrag. Was ist für den Techniker dabei am wichtigsten?","options":[["A","Stahlkappenstiefel"],["B","Atemschutzmaske"],["C","ESD-Matte"],["D","Antistatische Beutel"]],"answers":["B"],"explanation":"Eine Luftfiltermaske ist besonders wichtig, da beim 3D-Druck mit Filamenten auf Kohlefaserbasis feine Partikel und Dämpfe freigesetzt werden können, die beim Einatmen gesundheitsschädlich sind."},{"n":121,"simulation":false,"prompt":"Welche der folgenden Aspekte sollte ein Techniker berücksichtigen, wenn er vertrauliche Arbeitsprojekte mit Personen außerhalb des Unternehmens bespricht?","options":[["A","EULA"],["B","EOL"],["C","SLA"],["D","NDA"]],"answers":["D"],"explanation":"Eine NDA (Geheimhaltungsvereinbarung) ist das Konzept, das ein Techniker berücksichtigen sollte, um sicherzustellen, dass vertrauliche Details zu Arbeitsprojekten nicht an unbefugte Personen außerhalb des Unternehmens weitergegeben werden."},{"n":122,"simulation":false,"prompt":"Ein Techniker überprüft die aktuelle Richtlinie zum Vorfallmanagement einer Organisation. Die Organisation nutzt einen Drittanbieter, um ihre Ressourcen mit verschiedenen Tools zu schützen. Welche der folgenden Dienstleistungsarten nutzt die Organisation?","options":[["A","PaaS"],["B","EDR"],["C","MDR"],["D","XDR"]],"answers":["C"],"explanation":"MDR (Managed Detection and Response) ist ein Dienst, bei dem ein Drittanbieter mithilfe verschiedener Tools Sicherheitsüberwachung und Incident Response bereitstellt, um die Ressourcen eines Unternehmens zu schützen."},{"n":123,"simulation":false,"prompt":"Welchen der folgenden Befehle kann ein Techniker verwenden, um den Inhalt einer einzelnen Datei auf einem Linux-Terminal anzuzeigen?","options":[["A","chmod"],["B","cat"],["C","ls"],["D","sudo"]],"answers":["B"],"explanation":"Der Befehl „cat“ wird in einem Linux-Terminal verwendet, um den Inhalt einer einzelnen Datei anzuzeigen."},{"n":124,"simulation":false,"prompt":"Ein Geschäftsführer möchte sich mit Mitarbeitern an entfernten Standorten treffen, um Zusammenarbeit und Schulungen zu ermöglichen. Welche der folgenden Softwaretechnologien eignet sich am besten für diese Situation?","options":[["A","Videokonferenzen"],["B","Bildschirmfreigabe"],["C","Remote-Desktop-Protokoll"],["D","Virtuelle Desktop-Infrastruktur"]],"answers":["A"],"explanation":"Videokonferenzsoftware ermöglicht die Zusammenarbeit und Schulung mit Mitarbeitern an entfernten Standorten und ermöglicht so Besprechungen und Interaktionen in Echtzeit."},{"n":125,"simulation":false,"prompt":"Welches der folgenden Dateisysteme unterstützt Lese- und Schreibvorgänge unter Windows, macOS und Linux?","options":[["A","exFAT"],["B","ReFS"],["C","NTFS"],["D","APFS"],["E","ext4"]],"answers":["A"],"explanation":"exFAT wird von Windows, macOS und Linux sowohl für Lese- als auch für Schreibvorgänge unterstützt und ist damit das kompatibelste Dateisystem unter den aufgeführten Optionen."},{"n":126,"simulation":false,"prompt":"Ein Techniker hat kürzlich ein Programm installiert, das mehrere Technologien zur Pirateriebekämpfung nutzt. Wenn das Programm gestartet wird, öffnet es sich kurz und schließt sich dann wieder. Was ist der wahrscheinlichste Grund dafür?","options":[["A","32-Bit-Programm auf einem 64-Bit-Computer"],["B","CPU-Inkompatibilität"],["C","Veraltete Grafikkartentreiber"],["D","USB-Stick nicht eingesteckt"]],"answers":["D"],"explanation":"Viele Technologien zur Pirateriebekämpfung erfordern, dass ein USB-Stick (Dongle) eingesteckt ist, damit das Programm ausgeführt werden kann; fehlt dieser, wird das Programm zwar geöffnet, schließt sich aber sofort wieder."},{"n":127,"simulation":false,"prompt":"Ein Computer stürzt nach einem Betriebssystem-Patch häufig ab. Welche der folgenden Maßnahmen sollte ein Techniker ergreifen, um weitere Abstürze zu verhindern und das Problem zu untersuchen?","options":[["A","Eine Systemwiederherstellung durchführen."],["B","Die Updates rückgängig machen."],["C","Die optionalen Patches installieren."],["D","Die Startreihenfolge ändern."]],"answers":["B"],"explanation":"Durch das Zurücksetzen der Updates wird das System in seinen vorherigen stabilen Zustand zurückversetzt, wodurch weitere Abstürze verhindert werden und das durch den jüngsten Betriebssystem-Patch verursachte Problem untersucht werden kann."},{"n":128,"simulation":false,"prompt":"Nachdem ein Nutzer eine mobile App über eine Werbeanzeige installiert hat, ist der Akku des Smartphones wenige Stunden später leer, und das Gerät fühlt sich heiß an, auch wenn es nicht benutzt wird. Was sollte ein Techniker als Erstes tun?","options":[["A","Auf nicht autorisierte Geräteadministratoren prüfen."],["B","Den Softwareentwickler kontaktieren."],["C","Einen Scan auf mobile Malware auf dem Smartphone durchführen."],["D","Sicherstellen, dass die entsprechenden MDM-Richtlinien angewendet werden."]],"answers":["C"],"explanation":"Das Ausführen eines Scans auf mobile Malware ist der erste Schritt, da die über eine Werbeanzeige installierte App schädlich sein könnte und zu übermäßigem Akkuverbrauch und Überhitzung führen könnte."},{"n":129,"simulation":false,"prompt":"Nach der Installation neuer Gerätesoftware für eine Webcam kommt es auf einem Windows-PC zu einem BSOD. Der BSOD tritt während einer Videokonferenz auf. Was sollte der Techniker als Nächstes tun?","options":[["A","Die Anti-Malware-Signaturen aktualisieren und das System scannen."],["B","Einen Garantieanspruch beim Hersteller geltend machen."],["C","Im abgesicherten Modus starten und den Gerätetreiber zurücksetzen."],["D","Die Webcam erneut an den Computer anschließen."]],"answers":["C"],"explanation":"Der Start im abgesicherten Modus und das Zurücksetzen des Gerätetreibers können BSOD-Probleme beheben, die durch neu installierte oder inkompatible Webcam-Treiber verursacht werden."},{"n":130,"simulation":false,"prompt":"Ein Techniker richtet einen Computer für einen neuen Benutzer ein. Eine Anforderung ist, dass die Dokumente des Benutzers an einem Netzwerkspeicherort und nicht lokal auf dem Computer gespeichert werden. Welche der folgenden Einstellungen sollte der Techniker vornehmen?","options":[["A","Dateiattribute"],["B","Benutzerkontensteuerung"],["C","Sicherheitsgruppen"],["D","Ordnerumleitung"]],"answers":["D"],"explanation":"Die Ordnerumleitung wird verwendet, um Benutzerdokumente automatisch an einem Netzwerkpfad statt auf dem lokalen Computer zu speichern."},{"n":131,"simulation":false,"prompt":"Ein Endbenutzer möchte, dass ein Drucker für den Vertrieb zu seinem Computer hinzugefügt wird. Der Drucker befindet sich in der Domäne. Welche der folgenden Methoden eignet sich am besten für den Techniker, um den Drucker hinzuzufügen?","options":[["A","Gehen Sie zum Druckserver und wählen Sie den Druckernamen aus."],["B","Den Laptop über USB mit dem Drucker verbinden."],["C","Stellen Sie über Bluetooth eine Verbindung zum Drucker her."],["D","Gehen Sie zu „Lokale Benutzer und Gruppen“, um den Drucker hinzuzufügen."]],"answers":["A"],"explanation":"Die Auswahl des Druckers über den Druckserver ist die beste Methode, um einen Domänendrucker zum Computer eines Benutzers hinzuzufügen."},{"n":132,"simulation":false,"prompt":"Welche der folgenden Authentifizierungsmethoden eignet sich am besten, um zu verhindern, dass Benutzer ihre Anmeldedaten häufig eingeben müssen?","options":[["A","Zugriffskontrollliste"],["B","Single Sign-On"],["C","Mehrfaktorauthentifizierung"],["D","Einmalpasswort"]],"answers":["B"],"explanation":"Single Sign-On (SSO) ermöglicht es Benutzern, mit einem einzigen Satz von Anmeldedaten auf mehrere Ressourcen zuzugreifen, wodurch die Notwendigkeit, ihre Anmeldedaten wiederholt einzugeben, minimiert wird."},{"n":133,"simulation":false,"prompt":"Eine Sekretärin erhält eine E-Mail vom Geschäftsführer des Unternehmens mit der Aufforderung, einen Lieferanten unverzüglich zu bezahlen. Nachdem die Zahlung erfolgt ist, teilt der Geschäftsführer der Sekretärin mit, dass er diese E-Mail nie verschickt habe. Welche der folgenden Social-Engineering-Taktiken beschreibt diese Art von Angriff am besten?","options":[["A","Evil Twin"],["B","Identitätsbetrug"],["C","Whaling"],["D","Spear-Phishing"]],"answers":["D"],"explanation":"Spear-Phishing ist ein gezielter E-Mail-Angriff, der sich gegen eine bestimmte Person oder Funktion richtet, beispielsweise gegen die Sekretärin, indem der Absender vorgibt, eine vertrauenswürdige Person wie den Geschäftsführer zu sein."},{"n":134,"simulation":false,"prompt":"Die Leistung auf dem Smartphone eines Benutzers lässt nach. Das Starten von Anwendungen dauert lange, und auch das Wechseln zwischen Fenstern nimmt viel Zeit in Anspruch. Welchen der folgenden Diagnoseschritte sollte ein Mobilfunktechniker als Erstes durchführen?","options":[["A","Das Smartphone auf die Werkseinstellungen zurücksetzen."],["B","Das Smartphone neu starten."],["C","Den Akkustatus des Telefons überprüfen."],["D","Nicht benötigte Anwendungen deinstallieren."]],"answers":["B"],"explanation":"Ein Neustart des Telefons ist ein einfacher erster Diagnoseschritt, der Leistungsprobleme beheben kann, indem temporäre Speicherinhalte und Prozesse gelöscht werden."},{"n":135,"simulation":false,"prompt":"Ein Benutzer kann die neueste Version einer Anwendung auf einem älteren privaten Tablet nicht nutzen. Was ist höchstwahrscheinlich der Grund dafür?","options":[["A","Das Betriebssystem hat das Ende seiner Lebensdauer erreicht."],["B","Der Speicherplatz reicht nicht aus."],["C","MDM blockiert Updates."],["D","Das Tablet ist mit Malware infiziert."]],"answers":["A"],"explanation":"Das Betriebssystem hat das Ende seines Lebenszyklus erreicht, wodurch die neueste Version der Anwendung auf dem älteren Tablet nicht mehr unterstützt oder installiert werden kann."},{"n":136,"simulation":false,"prompt":"Welche der folgenden Funktionen wird unter macOS zum Speichern von Passwörtern verwendet?","options":[["A","FileVault"],["B","Schlüsselbund"],["C","Barrierefreiheit"],["D","Mission Control"]],"answers":["B"],"explanation":"Der Schlüsselbund ist das Passwortverwaltungssystem, das in macOS verwendet wird, um Passwörter und andere Anmeldedaten sicher zu speichern."},{"n":137,"simulation":false,"prompt":"Ein Benutzer meldet sich jeden Morgen an einem Computer an und versucht, einen Tagesbericht auszudrucken, doch der Druckvorgang schlägt fehl. Der Benutzer wendet sich an den Helpdesk, dort wird eine Einstellung geändert, und der Benutzer kann an diesem Tag drucken, doch am nächsten Tag tritt das gleiche Problem erneut auf. Da das Problem täglich auftritt, wird es eskaliert. Was muss der Techniker tun, damit der Benutzer das Problem nicht jeden Tag melden muss? (Wählen Sie zwei Optionen aus.)","options":[["A","Den Druckspooler so einstellen, dass er keine Abhängigkeiten aufweist."],["B","Stellen Sie die Wiederherstellung des Druckspoolers so ein, dass keine Maßnahmen ergriffen werden."],["C","Starten Sie den Dienst „Druckererweiterungen und Benachrichtigungen“."],["D","Den Druckspooler-Dienst starten."],["E","Stellen Sie den Druckspooler auf „Automatisch“ ein."],["F","Stellen Sie die Anmeldung des Druckspoolers auf das Benutzerkonto ein."]],"answers":["D","E"],"explanation":"Durch das Starten des Druckspooler-Dienstes wird sichergestellt, dass die Druckfunktion sofort wiederhergestellt wird. Die Einstellung des Druckspoolers auf „Automatisch“ stellt sicher, dass der Dienst bei jedem Systemstart des Computers gestartet wird, wodurch verhindert wird, dass das Problem täglich erneut auftritt."},{"n":138,"simulation":false,"prompt":"Der Computer eines Benutzers kann auf Ressourcen im Unternehmensnetzwerk zugreifen, jedoch keine Internetseiten mit einem Browser aufrufen. Was ist die wahrscheinlichste Ursache dafür?","options":[["A","IP-Adresskonflikt"],["B","Fehlende Proxy-Einstellungen"],["C","Falsche Subnetzmaske"],["D","Getrenntes Ethernet-Kabel"]],"answers":["B"],"explanation":"Fehlende Proxy-Einstellungen können den Zugriff auf Internetseiten verhindern, während der Zugriff auf interne Netzwerkressourcen weiterhin möglich ist."},{"n":139,"simulation":false,"prompt":"Ein Techniker muss einen neuen Webbrowser auf einen Desktop-Computer herunterladen und installieren. Welche der folgenden Möglichkeiten sollte der Techniker nutzen, um zu überprüfen, ob es sich bei dem Installationsprogramm um eine authentische Version handelt?","options":[["A","Datum"],["B","Hash"],["C","Größe"],["D","Name"]],"answers":["B"],"explanation":"Durch die Überprüfung des Hash-Werts des Installationsprogramms wird sichergestellt, dass die heruntergeladene Datei authentisch ist und nicht manipuliert wurde."},{"n":140,"simulation":false,"prompt":"Ein Nutzer eines Laptops mit Microsoft-Betriebssystem wünscht sich eine alternative Anmeldeauthentifizierungsmethode, da er sein Passwort bereits mehrfach vergessen hat. Welche der folgenden Optionen sollte ein Techniker aktivieren, um dieser Anfrage nachzukommen?","options":[["A","Single Sign-On"],["B","Windows Hello"],["C","BitLocker"],["D","Benutzerkontensteuerung"]],"answers":["B"],"explanation":"Windows Hello bietet alternative Authentifizierungsmethoden wie Gesichtserkennung, Fingerabdruck oder PIN, die Benutzern helfen können, die ihre Passwörter häufig vergessen."},{"n":141,"simulation":false,"prompt":"Auf einem Windows 11 Home-Gerät werden ständig Pop-ups angezeigt, in denen darauf hingewiesen wird, dass die Antivirensoftware dringend aktualisiert werden muss, um eine erkannte Bedrohung zu beseitigen. Der Benutzer hat auf die Schaltfläche „X“ im Fensterrahmen geklickt, doch das Pop-up erscheint immer wieder. Das Pop-up enthält eine Schaltfläche „OK“, um das Update zu installieren und die Bedrohung zu beseitigen. Was sollte der Benutzer als Nächstes tun?","options":[["A","Auf die Schaltfläche „OK“ klicken, um das Update zu installieren."],["B","Das Windows-Betriebssystem neu installieren."],["C","Führen Sie den Systemdatei-Checker aus."],["D","Überprüfen Sie den aktuellen Status und die Einstellungen der Schutzmaßnahmen."]],"answers":["D"],"explanation":"Der Benutzer sollte den aktuellen Status und die Einstellungen der legitimen Schutzmaßnahmen überprüfen, um festzustellen, ob die Pop-ups echt sind oder Teil eines Betrugsversuchs oder einer Malware-Infektion sind, anstatt auf „OK“ zu klicken oder drastische Maßnahmen zu ergreifen."},{"n":142,"simulation":false,"prompt":"Ein Kunde meldet, dass auf einem Computer Pop-ups angezeigt werden und unerwartete Geräusche zu hören sind. Was sollte ein Techniker tun, bevor er dieses Problem behebt?","options":[["A","Die Daten des Kunden sichern."],["B","Das Betriebssystem aktualisieren."],["C","Die Workstation neu installieren."],["D","Den Rechner unter Quarantäne stellen."]],"answers":["D"],"explanation":"Durch die Quarantäne des Computers wird die potenzielle Ausbreitung von Malware oder böswilligen Aktivitäten verhindert, bevor Maßnahmen zur Behebung des Problems ergriffen werden."},{"n":143,"simulation":false,"prompt":"Ein Unternehmen möchte seine Verzeichnisdatenbank nutzen, um Benutzer für sein WLAN-Netzwerk zu authentifizieren. Welche der folgenden Möglichkeiten sollte das Unternehmen verwenden, um diese Aufgabe zu erfüllen?","options":[["A","MFA"],["B","WPA3"],["C","RADIUS"],["D","LDAP"]],"answers":["C"],"explanation":"RADIUS ermöglicht die Integration mit Verzeichnisdatenbanken, um Benutzer für das WLAN-Netzwerk zu authentifizieren."},{"n":144,"simulation":false,"prompt":"Ein Desktop-Techniker sichert eine neu installierte Unternehmens-Workstation. Welche der folgenden Maßnahmen sollte der Techniker ergreifen? (Wählen Sie zwei aus.)","options":[["A","Fügen Sie einen Haftungsausschluss auf dem Anmeldebildschirm ein."],["B","Das Gastkonto deaktivieren."],["C","Den Bildschirmschoner deaktivieren."],["D","Tools für die Remote-Zusammenarbeit installieren."],["E","Das Standard-Administratorpasswort ändern."],["F","Aktivieren Sie einen virtuellen Assistenten."]],"answers":["B","E"],"explanation":"Das Deaktivieren des Gastkontos verhindert unbefugten Zugriff. Das Ändern des Standard-Administratorpassworts erhöht die Sicherheit, da es ein leichtes Knacken des Passworts verhindert."},{"n":145,"simulation":false,"prompt":"Ein Benutzer bringt ein iOS-basiertes Smartphone, das langsam läuft, zu einer Reparaturwerkstatt. Ein Techniker der Werkstatt stellt Folgendes fest: Akkuladestand: 25 % Akkuzustand: 90 % Hotspot: Ein Mobilfunkempfang: ||| Roaming: Aus Belegter Speicherplatz: 63,76 GB/64 GB Welche der folgenden Ursachen ist für das Problem verantwortlich?","options":[["A","Auf dem Gerät ist der freie Speicherplatz knapp"],["B","Der Akkuzustand ist schlecht."],["C","Das Smartphone ist nicht ausreichend aufgeladen."],["D","Der Hotspot beeinträchtigt die Leistung."],["E","Es sind zu viele Anwendungen geöffnet."]],"answers":["A"],"explanation":"Auf dem Gerät ist der freie Speicherplatz knapp, was zu Leistungsproblemen führen kann, da das Betriebssystem und die Anwendungen verfügbaren Speicherplatz benötigen, um ordnungsgemäß zu funktionieren."},{"n":146,"simulation":false,"prompt":"Welche der folgenden Maßnahmen regelt den Zugriff auf bestimmte Dienste, um sicherzustellen, dass Administratoren nicht automatisch erweiterte Berechtigungen erhalten?","options":[["A","RAM"],["B","MFA"],["C","DLP"],["D","SSO"]],"answers":["A"],"explanation":"PAM (Privileged Access Management) regelt den Zugriff auf bestimmte Dienste, sodass Administratoren nicht automatisch erweiterte Berechtigungen erhalten."},{"n":147,"simulation":false,"prompt":"Welches der folgenden Dateisysteme ist ein Nachfolger von NTFS?","options":[["A","ReFS"],["B","XFS"],["C","APFS"],["D","exFAT"]],"answers":["A"],"explanation":"ReFS (Resilient File System) ist der Nachfolger von NTFS und wurde entwickelt, um die Datenintegrität, Verfügbarkeit und Skalierbarkeit auf Windows-Systemen zu verbessern."},{"n":148,"simulation":false,"prompt":"Ein Techniker muss die Einstellungen für die Passwortkomplexität und die Anzahl fehlgeschlagener Anmeldeversuche , bevor ein Benutzer gesperrt wird. Diese Einstellungen können von Standardbenutzern nicht geändert werden. Welches der folgenden MMC-Snap-Ins sollte der Techniker verwenden?","options":[["A","taskschd"],["B","lusrmgr"],["C","perfmon"],["D","gpedit"]],"answers":["D"],"explanation":"Das MMC-Snap-In „gpedit“ (Gruppenrichtlinien-Editor) dient zur Konfiguration von Richtlinien zur Passwortkomplexität und zur Kontosperrung, die von Standardbenutzern nicht geändert werden können."},{"n":149,"simulation":false,"prompt":"Ein Kunde führt ein Upgrade seiner Workstation von Windows 10 auf Windows 11 durch. Er führt eine Neuinstallation von einem USB-Stick durch. Nach dem Neustart des Systems wird das Installationsprogramm erneut geladen. Was sollte der Benutzer tun, um die Installation abzuschließen?","options":[["A","chkdsk vom USB-Stick ausführen."],["B","TPM deaktivieren."],["C","Wechseln Sie von MBR zu UEFI."],["D","Entfernen Sie den USB-Stick."]],"answers":["D"],"explanation":"Durch das Entfernen des USB-Sticks kann das System vom neu installierten Windows 11-Betriebssystem booten, anstatt den Installationsvorgang neu zu starten."},{"n":150,"simulation":false,"prompt":"Ein Benutzer hat den Helpdesk angerufen, um ein Problem mit der Internetverbindungsgeschwindigkeit auf einem Laptop zu melden. Der Techniker vermutet, dass Hintergrunddienste möglicherweise zusätzliche Bandbreite beanspruchen. Welches der folgenden Tools sollte der Techniker verwenden, um die Verbindungen auf dem Laptop zu überprüfen?","options":[["A","nslookup"],["B","net use"],["C","netstat"],["D","net user"]],"answers":["C"],"explanation":"Das Tool „netstat“ zeigt aktive Netzwerkverbindungen und Listening-Ports an und ermöglicht es dem Techniker, Hintergrunddienste und -prozesse zu identifizieren, die möglicherweise zusätzliche Bandbreite auf dem Laptop beanspruchen."},{"n":151,"simulation":false,"prompt":"Ein Benutzer kann sich nicht im Netzwerk anmelden. Das Netzwerk verwendet 802.1X mit EAP-TLS zur Authentifizierung im kabelgebundenen Netzwerk. Der Benutzer war längere Zeit abwesend und hat sich sich seit mehreren Monaten nicht mehr am Computer angemeldet. Was ist die Ursache für das Anmeldeproblem?","options":[["A","Abgelaufenes Zertifikat"],["B","Fehlgeschlagenes Betriebssystem-Update"],["C","Dienst nicht gestartet"],["D","Anwendungsabsturz"],["E","Profil muss neu erstellt werden"]],"answers":["A"],"explanation":"Die EAP-TLS-Authentifizierung basiert auf digitalen Zertifikaten. Wenn sich der Benutzer mehrere Monate lang nicht angemeldet hat, ist sein Authentifizierungszertifikat möglicherweise abgelaufen, was eine erfolgreiche Netzwerkanmeldung verhindert."},{"n":152,"simulation":false,"prompt":"Welche der folgenden Authentifizierungsmethoden ist tokenbasiert?","options":[["A","Kerberos"],["B","TACACS+"],["C","Passwörter"],["D","TKIP"]],"answers":["B"],"explanation":"TACACS+ (Terminal Access Controller Access-Control System Plus) ist ein tokenbasiertes Authentifizierungsprotokoll, das Token (wie Einmalpasswörter oder Sicherheitstoken) zur Authentifizierung von Benutzern verwenden kann."},{"n":153,"simulation":false,"prompt":"Welche der folgenden Methoden ist die sicherste, um zu verhindern, dass jemand auf ein Mobiltelefon zugreift?","options":[["A","PIN"],["B","Wischen"],["C","Passphrase"],["D","Muster"]],"answers":["C"],"explanation":"Eine Passphrase ist in der Regel länger und komplexer als eine PIN, ein Wischvorgang oder ein Muster und stellt somit die sicherste Methode dar, um unbefugten Zugriff auf ein Mobiltelefon zu verhindern."},{"n":154,"simulation":false,"prompt":"Wenn sich ein Benutzer im Büro befindet, werden Webseiten auf seinem Smartphone nur langsam geladen. Welche der folgenden Aussagen erklärt dieses Problem am besten?","options":[["A","Das Datenvolumen wurde überschritten"],["B","Langsame Reaktionszeit"],["C","Beeinträchtigte Netzwerkleistung"],["D","Geringer Speicherplatz"]],"answers":["C"],"explanation":"Eine Beeinträchtigung der Netzwerkleistung im Büro, wie z. B. ein schwaches WLAN-Signal oder eine Netzwerküberlastung, ist der wahrscheinlichste Grund dafür, dass Webseiten auf dem Smartphone des Benutzers nur langsam geladen werden."},{"n":155,"simulation":false,"prompt":"Ein Benutzer ruft den Helpdesk an, um mögliche Malware auf einem Computer zu melden. Die ungewöhnlichen Aktivitäten begannen, nachdem der Benutzer in einer kürzlich erhaltenen E-Mail auf einen Link zu einer kostenlosen Geschenkkarte geklickt hatte. Der Techniker bittet den Benutzer, alle ungewöhnlichen Aktivitäten zu beschreiben, wie z. B. langsame Leistung, übermäßige Pop-ups und BrowserWeiterleitungen. Was sollte der Techniker als Nächstes tun?","options":[["A","Dem Nutzer raten, einen vollständigen Systemscan mit der Anti-Malware-Anwendung des Betriebssystems durchzuführen."],["B","Den Nutzer anleiten, den Computer im abgesicherten Modus neu zu starten und zu überprüfen, ob die ungewöhnlichen Aktivitäten weiterhin auftreten."],["C","Den Nutzer bitten, nach kürzlich installierten Anwendungen zu suchen und diejenigen aufzulisten, die seit dem Anklicken des Links in der E-Mail installiert wurden."],["D","Den Nutzer anweisen, die Ethernet-Verbindung zum Unternehmensnetzwerk zu trennen."]],"answers":["D"],"explanation":"Das Trennen der Verbindung zum Unternehmensnetzwerk hilft, eine mögliche Ausbreitung von Malware zu verhindern und schützt andere Systeme, während das Problem untersucht wird."},{"n":156,"simulation":false,"prompt":"Ein Kunde schildert einem Techniker Probleme mit einem Arbeitsplatzrechner. Während der Kunde die Probleme aufzählt, surft der Techniker auf seinem Smartphone in sozialen Medien. Welche der folgenden Verhaltens- und Kommunikationstechniken sollte der Techniker in dieser Situation anwenden? (Wählen Sie zwei aus.)","options":[["A","Dem Kunden aufmerksam zuhören."],["B","Persönliche Unterbrechungen vermeiden."],["C","Angemessene Dokumentation bereitstellen."],["D","Kundenaussagen klären."],["E","Aktiv zuhören und Notizen machen."],["F","Achten Sie auf professionelle Kleidung."]],"answers":["B"],"explanation":"Durch das Vermeiden persönlicher Unterbrechungen wird sichergestellt, dass der Techniker dem Kunden seine volle Aufmerksamkeit widmet. Aktives Zuhören und das Anfertigen von Notizen zeugen von Respekt und helfen dabei, die Anliegen des Kunden präzise anzugehen."},{"n":157,"simulation":false,"prompt":"Welche der folgenden Dateiendungen werden üblicherweise zur Installation von Anwendungen auf einem MacOS-Computer verwendet? (Wählen Sie drei aus.)","options":[["A",".mac"],["B",".pkg"],["C",".deb"],["D",".dmg"],["E",".msi"],["F",".appx G. .app H. .apk"]],"answers":["B","D"],"explanation":".pkg, .dmg und .app sind Standard-Dateiendungen unter macOS, die zum Installieren oder Ausführen von Anwendungen verwendet werden."},{"n":158,"simulation":false,"prompt":"Ein Techniker installiert eine neue Geschäftsanwendung auf dem Desktop-Computer eines Benutzers. Auf dem Rechner läuft das Betriebssystem Windows 10 Enterprise 32-Bit. Welche der folgenden Dateien sollte der Techniker ausführen, um die Installation abzuschließen?","options":[["A","Installer_x64.exe"],["B","Installer_Files.zip"],["C","Installer_32.msi"],["D","Installer_x86.exe"],["E","Installer_Win10Enterprise.dmg"]],"answers":["D"],"explanation":"„x86“ bezieht sich auf die 32-Bit-Architektur. Auf einem Windows 10 Enterprise 32-Bit-System sollte der Techniker aus Kompatibilitätsgründen das x86-Installationsprogramm ausführen."},{"n":159,"simulation":false,"prompt":"Ein Benutzer hat eine Datei auf einem freigegebenen Laufwerk erstellt und möchte verhindern, dass deren Daten versehentlich von anderen gelöscht werden. Welche der folgenden Anwendungen sollte der Techniker verwenden, um dem Benutzer beim Ausblenden der Datei zu helfen?","options":[["A","Geräte-Manager"],["B","Indizierungsoptionen"],["C","Datei-Explorer"],["D","Verwaltung"]],"answers":["C"],"explanation":"Der Datei-Explorer ermöglicht es dem Benutzer, Dateiattribute zu ändern, z. B. eine Datei auszublenden, um ein versehentliches Löschen durch andere zu verhindern."},{"n":160,"simulation":false,"prompt":"Ein Techniker führt ein In-Place-Upgrade auf dem Laptop eines Benutzers durch. Welche der folgenden Methoden ist die effektivste, um die Workstation auf das neueste Betriebssystem zu aktualisieren?","options":[["A","Verwenden Sie die neueste Version der .iso-Datei."],["B","Sichern Sie die Daten und führen Sie eine Neuinstallation durch."],["C","Das BIOS aufrufen und den USB-Zugriff aktivieren."],["D","Das Dienstprogramm „System Update“ verwenden."]],"answers":["D"],"explanation":"Das System-Update-Dienstprogramm ist für Upgrades vor Ort konzipiert und ermöglicht es dem Techniker, das Betriebssystem zu aktualisieren, während Benutzerdaten und Anwendungen erhalten bleiben."},{"n":161,"simulation":false,"prompt":"Was wird verwendet, um potenzielle Probleme mit einer geplanten Änderung vor der Umsetzung zu identifizieren?","options":[["A","Antragsformular"],["B","Rollback-Plan"],["C","Endbenutzerakzeptanz"],["D","Sandbox-Tests"]],"answers":["D"],"explanation":"Sandbox-Tests ermöglichen es, vorgeschlagene Änderungen in einer isolierten Umgebung zu bewerten, um potenzielle Probleme vor der Implementierung zu identifizieren."},{"n":162,"simulation":false,"prompt":"Jedes Mal, wenn ein Benutzer versucht, den ausgewählten Web-Suchanbieter aufzurufen, wird eine andere Website geöffnet. Was sollte der Techniker als Erstes überprüfen?","options":[["A","Systemzeit"],["B","IP-Adresse"],["C","DNS-Server"],["D","Windows-Updates"]],"answers":["C"],"explanation":"Wenn ein Benutzer auf eine unerwartete Website umgeleitet wird, sollten zunächst die DNS-Server überprüft werden, um sicherzustellen, dass sie nicht geändert oder kompromittiert wurden."},{"n":163,"simulation":false,"prompt":"Ein Benutzer erhält eine Benachrichtigung, dass der Virenschutz auf einem Firmenlaptop veraltet ist. Ein Techniker kann den Laptop des Benutzers per Ping erreichen. Der Techniker überprüft die Hauptserver des Antivirenprogramms und stellt fest, dass die neuesten Signaturen installiert sind. Anschließend überprüft der Techniker den Laptop des Benutzers und stellt fest, dass die Antiviren-Engine und die Definitionen auf dem neuesten Stand sind. Was ist höchstwahrscheinlich passiert?","options":[["A","Ransomware"],["B","Fehlgeschlagene Betriebssystem-Updates"],["C","Adware"],["D","Fehlende Systemdateien"]],"answers":["D"],"explanation":"Fehlende oder beschädigte Systemdateien können zu falschen Benachrichtigungen oder Fehlern führen, beispielsweise zu einer falschen Meldung, dass der Virenschutz veraltet ist, obwohl er aktuell ist."},{"n":164,"simulation":false,"prompt":"Was würde ein Administrator am ehesten verwenden, um eine sich wiederholende Aufgabe über die LinuxBefehlszeile zu automatisieren?","options":[["A","JavaScript-Datei"],["B","Shell-Skript"],["C","Visual-Basic-Dienstprogramme"],["D","Batch-Datei"]],"answers":["B"],"explanation":"Ein Shell-Skript wird unter Linux häufig verwendet, um sich wiederholende Aufgaben zu automatisieren, indem eine Abfolge von Befehlen direkt über die Befehlszeile ausgeführt wird."},{"n":165,"simulation":false,"prompt":"Welche der folgenden Optionen wird verwendet, um festzustellen, wie viele aktive Benutzer derzeit bei den Remotedesktopdiensten angemeldet sind?","options":[["A","Lokale Benutzer und Gruppen"],["B","Systeminformationen"],["C","Gruppenrichtlinien-Editor"],["D","Task-Manager"]],"answers":["D"],"explanation":"Der Task-Manager in Windows ermöglicht es Administratoren, auf der Registerkarte „Benutzer“ die Anzahl der aktiven Benutzersitzungen anzuzeigen, die über Remotedesktopdienste verbunden sind."},{"n":166,"simulation":false,"prompt":"Welche der folgenden Optionen gewährt einem Benutzer die Mindestberechtigungen, die zur Erfüllung seiner Aufgaben erforderlich sind?","options":[["A","Prinzip der geringsten Berechtigungen"],["B","Zero Trust"],["C","SSO"],["D","MFA"]],"answers":["A"],"explanation":"Das Prinzip der geringsten Berechtigungen stellt sicher, dass Benutzern nur die für die Erfüllung ihrer Aufgaben erforderlichen Mindestberechtigungen gewährt werden, wodurch Sicherheitsrisiken reduziert werden."},{"n":167,"simulation":false,"prompt":"Ein Techniker erstellt eine MDM-Richtlinie unter Verwendung von Absicherungstechniken, die für jeden Benutzer individuell sind. Welche der folgenden Techniken wendet der Techniker an?","options":[["A","Ein gezeichnetes Muster"],["B","Ein Fingerabdruck"],["C","Ein Passwort"],["D","Eine PIV-Karte"]],"answers":["B"],"explanation":"Ein Fingerabdruck ist eine biometrische Sicherheitsmaßnahme, die für jeden Benutzer einzigartig ist und sich daher für eine MDM-Richtlinie eignet, die individuelle Sicherheit erfordert."},{"n":168,"simulation":false,"prompt":"Welches der folgenden Betriebssysteme wird zum Beitritt zu einer Domäne verwendet?","options":[["A","Windows 10 Home"],["B","Windows 11 Home"],["C","Windows 11 Pro"],["D","Windows 11 SE"]],"answers":["C"],"explanation":"Windows 11 Pro unterstützt den Beitritt zu einer Domäne, im Gegensatz zu den Editionen Windows Home und SE, denen die dafür erforderlichen Funktionen fehlen."},{"n":169,"simulation":false,"prompt":"Wenn ein Benutzer die Website comptiaa.org aufruft, werden Popup-Meldungen angezeigt, die darauf hinweisen, dass der Computer mit Adware infiziert ist. Ein Techniker scannt den Computer auf Malware und findet keine Infektion. Was sollte der Techniker tun, bevor er den Computer an den Benutzer zurückgibt?","options":[["A","Den Cache und den letzten Verlauf des Browsers löschen."],["B","Sich bei der Cloud-Workspace-Anwendung des Unternehmens anmelden."],["C","Unternehmensspezifische DNS-Sicherheitssoftware installieren"],["D","Den privaten Modus für die Internetnutzung aktivieren."]],"answers":["A"],"explanation":"Durch das Löschen der zwischengespeicherten Daten und des letzten Verlaufs des Browsers werden im Cache gespeicherte schädliche Skripte oder Adware-bezogene Pop-ups entfernt, wodurch sichergestellt wird, dass das Problem vor der Rückgabe des Computers behoben ist."},{"n":170,"simulation":false,"prompt":"Ein Techniker muss eine externe Webadresse als vertrauenswürdige Website hinzufügen. Welche der folgenden Einstellungen sollte der Techniker konfigurieren?","options":[["A","System"],["B","Netzwerk- und Freigabecenter"],["C","Internetoptionen"],["D","Verwaltung"]],"answers":["C"],"explanation":"Die Internetoptionen in Windows bieten Sicherheitseinstellungen, über die ein Techniker externe Webadressen zur Zone „Vertrauenswürdige Websites“ hinzufügen kann."},{"n":171,"simulation":false,"prompt":"Für welche der folgenden Bedrohungen ist „Shoulder Surfing“ ein Beispiel?","options":[["A","Zero-Day"],["B","Evil Twin"],["C","Social Engineering"],["D","Brute-Force"]],"answers":["C"],"explanation":"„Shoulder Surfing“ ist eine Social-Engineering-Bedrohung, da der Angreifer sensible Informationen durch Beobachtung der Handlungen des Benutzers erfasst und sich dabei auf menschliches Verhalten stützt, anstatt eine technische Schwachstelle auszunutzen."},{"n":172,"simulation":false,"prompt":"Welcher der folgenden Befehle wird verwendet, um DNS-Einträge für einen Remote-Host abzufragen?","options":[["A","find"],["B","curl"],["C","dig"],["D","ip"]],"answers":["C"],"explanation":"Der Befehl „dig“ wird verwendet, um DNS-Server abzufragen und DNS-Einträge für einen Remote-Host nachzuschlagen."},{"n":173,"simulation":false,"prompt":"Ein Techniker arbeitet an einer komplexen, groß angelegten Softwarebereitstellung. An welcher der folgenden Stellen würde der Techniker am ehesten auf die Bereitstellungsanweisungen zurückgreifen?","options":[["A","Dateiserver"],["B","Desktop des Benutzers"],["C","E-Mail"],["D","Internes Wiki"]],"answers":["D"],"explanation":"Ein internes Wiki ist der wahrscheinlichste Ort zur Speicherung von Bereitstellungsanweisungen, da es zentralisierte, dokumentierte und leicht zugängliche technische Verfahren für umfangreiche oder komplexe Aufgaben bereitstellt."},{"n":174,"simulation":false,"prompt":"Ein Benutzer hört ein unerwartetes Geräusch, das von seinem Desktop-Computer ausgeht. Um das Problem zu beheben, muss ein Techniker das Gehäuse öffnen. Welche der folgenden Maßnahmen sollte der Techniker als Nächstes ergreifen?","options":[["A","Die Systemabdeckung öffnen."],["B","Das System erden."],["C","Die Stromversorgung unterbrechen."],["D","Alle Peripheriegeräte entfernen."]],"answers":["C"],"explanation":"Der Techniker sollte vor dem Öffnen des Computergehäuses die Stromversorgung unterbrechen, um die Sicherheit zu gewährleisten und einen Stromschlag oder Schäden an Bauteilen zu vermeiden."},{"n":175,"simulation":false,"prompt":"Ein Unternehmen entwickelt eine neue Anwendung. Im Rahmen der Bereitstellung müssen die Rollen und Verantwortlichkeiten für den Support der Anwendung dokumentiert werden. Welches der folgenden Dokumente ist dafür vorgesehen, diese Informationen zu enthalten?","options":[["A","SOP"],["B","NDA"],["C","DRM"],["D","EULA"]],"answers":["A"],"explanation":"Ein SOP (Standard Operating Procedure) dient dazu, Rollen, Verantwortlichkeiten und Prozesse zur Unterstützung einer Anwendung zu dokumentieren."},{"n":176,"simulation":false,"prompt":"Ein Benutzer möchte mithilfe eines USB-Sticks eine 4,57 GB große .pst-Datei von einem Windows-Computer auf einen anderen übertragen. Mit welchem der folgenden Dateisysteme sollte der USB-Stick formatiert werden?","options":[["A","ext4"],["B","NTFS"],["C","FAT32"],["D","APFS"]],"answers":["B"],"explanation":"NTFS unterstützt Dateien, die größer als 4 GB sind, und eignet sich daher für die Übertragung einer 4,57 GB großen .pst-Datei über einen USB-Stick."},{"n":177,"simulation":false,"prompt":"Das Touchpad am Computer eines Benutzers funktioniert nicht. Wenn der Benutzer eine Maus an den Computer anschließt, funktioniert der Cursor normal. Welche der folgenden Optionen sollte ein Techniker verwenden, um nach Treiber-Updates zu suchen?","options":[["A","certmgr.msc"],["B","lusrmgr.msc"],["C","devmgmt.msc"],["D","gpedit.msc"]],"answers":["C"],"explanation":"devmgmt.msc öffnet den Geräte-Manager, ein Tool, mit dem Sie Hardwaretreiber wie beispielsweise den Touchpad-Treiber überprüfen, aktualisieren oder neu installieren können."},{"n":178,"simulation":false,"prompt":"Ein Benutzer muss auf seinem Windows-Laptop Software installieren und deinstallieren, muss jedoch keine Benutzerkonten verwalten. Das Unternehmen befolgt das Prinzip der geringsten Berechtigungen. Welcher der folgenden Kontotypen erfüllt diese Anforderungen?","options":[["A","Gast"],["B","Power-User"],["C","Dienst"],["D","Administrator"]],"answers":["B"],"explanation":"Ein Power-User-Konto ermöglicht das Installieren und Deinstallieren von Software, gewährt jedoch keine vollständigen Administratorrechte, was dem Prinzip der geringsten Berechtigungen entspricht."},{"n":179,"simulation":false,"prompt":"Ein Techniker hilft bei der Erstellung einer Desktop-Backup-Richtlinie für das Unternehmen. Zu den Anforderungen gehört, sicherzustellen, dass die Backups wie vorgesehen funktionieren und eine Wiederherstellung möglich ist. Welche der folgenden Routineaufgaben sollte der Techniker in die Richtlinie aufnehmen, um diese Anforderungen zu erfüllen? (Wählen Sie zwei aus.)","options":[["A","Inkrementelle Sicherung"],["B","Neukonfiguration der Sicherung"],["C","Sicherungstests"],["D","Differenzielle Sicherung"],["E","Löschen alter Sicherungen"],["F","Voll-Backup"]],"answers":["C","F"],"explanation":"Durch Backup-Tests wird überprüft, ob Backups gültig sind und erfolgreich wiederhergestellt werden können, um sicherzustellen, dass eine Wiederherstellung möglich ist. Bei einer vollständigen Sicherung wird eine vollständige Kopie aller Daten erstellt, wodurch eine zuverlässige Grundlage für eine erfolgreiche Wiederherstellung geschaffen wird."},{"n":180,"simulation":false,"prompt":"Ein Kunde bittet einen Helpdesk-Techniker um Hilfe bei der Auswahl neuer Computer. Der Kunde möchte teure Lizenzgebühren vermeiden, möchte aber, dass alle Dateien lokal gespeichert werden. Welches der folgenden Betriebssysteme sollte der Techniker empfehlen?","options":[["A","Linux"],["B","Chrome OS"],["C","Windows"],["D","macOS"]],"answers":["A"],"explanation":"Linux bietet ein voll ausgestattetes Betriebssystem ohne teure Lizenzgebühren und ermöglicht die lokale Speicherung aller Dateien, wodurch die Anforderungen des Kunden erfüllt werden."},{"n":181,"simulation":false,"prompt":"Ein Nachwuchstechniker arbeitet an einer Kundenanfrage. Der Nachwuchstechniker kann die Arbeit nicht abschließen und leitet das Problem an einen erfahrenen Techniker weiter. Der erfahrene Techniker schließt die Arbeit ab, doch das Ergebnis entspricht nicht der Kundenanfrage. Welche der folgenden Kommunikationstechniken hätte der junge Techniker anwenden sollen?","options":[["A","Offene Fragen stellen, um das Verständnis zu überprüfen."],["B","Eine positive Einstellung bewahren und Selbstvertrauen ausstrahlen."],["C","Die Probleme des Kunden nicht abtun."],["D","Eine angemessene Sprache verwenden und Fachjargon vermeiden."]],"answers":["A"],"explanation":"Das Stellen offener Fragen hilft dabei, die tatsächlichen Bedürfnisse des Kunden zu klären und das Verständnis zu überprüfen, bevor Sie die Angelegenheit weiterleiten. Dadurch verringern Sie das Risiko von Missverständnissen und falschen Ergebnissen."},{"n":182,"simulation":false,"prompt":"Ein Abteilungsleiter bittet einen Techniker, in einem Collaboration-Tool des Unternehmens eine Gruppe einzurichten, die es den Nutzern im New Yorker Büro ermöglicht, vertrauliche Informationen in einem streng regulierten Umfeld auszutauschen. Welche der folgenden Einstellungen sollte der Techniker vornehmen, um den Anforderungen des Teams gerecht zu werden? (Wählen Sie drei aus.)","options":[["A","Lokale Benutzerkonten"],["B","Zugriff auf persönliche Geräte"],["C","API-Token-Konfiguration"],["D","Mehrfaktorauthentifizierung"],["E","Private Kanäle"],["F","Profile für Kollaborationstools G. VPN-Verbindung H. Anforderungen an die Datenaufbewahrung"]],"answers":["D","E"],"explanation":"Die Multi-Faktor-Authentifizierung sorgt für eine zusätzliche Sicherheitsstufe beim Zugriff auf sensible Informationen. Private Kanäle beschränken die Kommunikation ausschließlich auf autorisierte Mitglieder und schützen so vertrauliche Gespräche. Anforderungen an die Datenaufbewahrung gewährleisten die Einhaltung gesetzlicher Standards für die Speicherung und Verwaltung sensibler Daten."},{"n":183,"simulation":false,"prompt":"Beim Anmelden an einer Workstation stellt ein Techniker fest, dass das Roaming-Profil sehr lange braucht, bis es vollständig geladen ist. Was sollte der Techniker zur Behebung dieses Problems als Erstes überprüfen?","options":[["A","Den Home-Ordner auf große Dateien"],["B","Die Speicherauslastung der Festplatte"],["C","Die Ausgangsleistung des Netzteils"],["D","Den Task-Manager auf nicht reagierende Anwendungen"]],"answers":["A"],"explanation":"Große Dateien, die im Home-Ordner gespeichert sind, vergrößern das Roaming-Profil und führen zu langen Anmeldezeiten, da das Profil über das Netzwerk kopiert wird. Die Überprüfung auf große Dateien ist der erste und direkteste Schritt."},{"n":184,"simulation":false,"prompt":"Ein Techniker vermutet, dass ein Computer bestimmte Einstellungen aus der Unternehmensdomäne nicht empfängt. Welches der folgenden Tools sollte der Techniker verwenden, um weitere relevante Informationen zu sammeln?","options":[["A","chkdsk"],["B","systeminfo"],["C","gpresult"],["D","nslookup"]],"answers":["C"],"explanation":"gpresult zeigt an, welche Gruppenrichtlinieneinstellungen auf den Computer und den Benutzer angewendet werden, und ist somit das richtige Tool, um festzustellen, ob das System Domäneneinstellungen erhält."},{"n":185,"simulation":false,"prompt":"Die IT-Richtlinie eines Unternehmens schreibt den Schutz sensibler Daten auf den Laptops der Mitarbeiter vor, insbesondere auf solchen, die außerhalb des Unternehmensgeländes mitgeführt werden. In letzter Zeit ist der Datendiebstahl auf diesen Geräten zu einem Problem geworden. Welche der folgenden Sicherheitsmaßnahmen sollte das Unternehmen zum Schutz der Laptops umsetzen?","options":[["A","Vollständige Festplattenverschlüsselung"],["B","Software zur Erkennung von Eindringlingen"],["C","Biometrische Authentifizierung"],["D","VPN-Zugang"]],"answers":["A"],"explanation":"Eine vollständige Festplattenverschlüsselung schützt alle Daten auf einem Laptop, indem sie den Inhalt ohne ordnungsgemäße Authentifizierung unlesbar macht und so Datendiebstahl verhindert, selbst wenn das Gerät verloren geht oder gestohlen wird."},{"n":186,"simulation":false,"prompt":"Was sollte ein Techniker berücksichtigen, wenn er am Standort eines Kunden zehn neue High-End-DesktopPCs für Grafikdesign und Animation hinzufügt?","options":[["A","Die Temperatur vor Ort"],["B","Die ordnungsgemäße Belüftung zur Ableitung gefährlicher Dämpfe"],["C","Die Luftfeuchtigkeit in den Büroräumen"],["D","Die Leistungsaufnahme des Stromkreises"]],"answers":["D"],"explanation":"Hochleistungs-Desktop-PCs für Grafikdesign haben einen hohen Stromverbrauch, daher muss der Techniker sicherstellen, dass der Stromkreis den erhöhten Stromverbrauch bewältigen kann, um Überlastungen und Stromausfälle zu vermeiden."},{"n":187,"simulation":false,"prompt":"Ein Benutzer bringt seinen privaten Laptop mit ins Büro. Er schließt seinen Computer an die Dockingstation an. Als der Benutzer versucht, eine Suchmaschine zu nutzen, wird auf der Seite folgende Meldung angezeigt: Dieses Gerät befindet sich in Quarantäne und ist nicht mit der Domäne verbunden. Wenden Sie sich an den IT-Administrator, um weitere Unterstützung zu erhalten. Was ist höchstwahrscheinlich die Ursache des Problems?","options":[["A","Das Ethernet-Kabel der Dockingstation ist nicht angeschlossen."],["B","Netzwerkressourcen sind gesperrt."],["C","Es ist Malware vorhanden."],["D","Die URL wurde falsch eingegeben."]],"answers":["B"],"explanation":"Die Meldung weist darauf hin, dass das Gerät in eine Netzwerkquarantäne versetzt wurde, da es kein domänengebundenes oder autorisiertes System ist. In diesem Zustand sind Netzwerkressourcen gesperrt, und das Gerät wird isoliert, bis die IT-Abteilung es freigibt oder das Problem behebt."},{"n":188,"simulation":false,"prompt":"Bei einer routinemäßigen Sicherheitsüberprüfung werden für das Smartphone eines Mitarbeiters mehrere Sicherheitswarnungen angezeigt. Die Warnungen weisen darauf hin, dass mehrere fehlgeschlagene Anmeldeversuche stattgefunden haben und dass kürzlich eine nicht verifizierte Anwendung heruntergeladen wurde. Welche der folgenden Maßnahmen sollte ein Techniker als Erstes auf dem Smartphone des Mitarbeiters ergreifen?","options":[["A","Die Sicherheitseinstellungen und -richtlinien des Smartphones aktualisieren."],["B","Die neueste offizielle Betriebssystemversion auf dem Smartphone neu installieren."],["C","Das Smartphone auf Malware scannen."],["D","Das Gerät aus der Ferne zurücksetzen."]],"answers":["C"],"explanation":"Als erstes sollte das Smartphone auf Malware überprüft werden, da die Warnmeldungen auf verdächtige Aktivitäten und die Installation einer nicht verifizierten Anwendung hinweisen, durch die möglicherweise Schadsoftware eingeschleust wurde."},{"n":189,"simulation":false,"prompt":"Ein Benutzer berichtet, dass der Startbildschirm seiner intern gehosteten CRM-Anwendung versucht, geladen zu werden, einige Sekunden lang pausiert und dann verschwindet. Ein Techniker installiert die Anwendungssoftware auf seinen Computer und kann das Problem nachstellen. Bei der Überprüfung der Anwendungsprotokolle stellt der Techniker Folgendes fest: Windows konnte den CRM-Dienst auf dem lokalen Computer 10169 nicht starten. Der Dienst wurde aufgrund eines Anmeldefehlers nicht gestartet. Welche der folgenden Ursachen ist am wahrscheinlichsten für dieses Problem?","options":[["A","Der Benutzer hat sein Kontopasswort falsch eingegeben."],["B","Die verfügbare Bandbreite reicht nicht aus, um die Anwendung auszuführen."],["C","Die VLAN-Einstellungen blockieren die Kommunikation mit der gehosteten Anwendung."],["D","Das vom Dienst verwendete LDAP-Dienstkonto ist deaktiviert."],["E","Der Computer erfüllt die Mindestanforderungen an die Hardware nicht."]],"answers":["D"],"explanation":"Der Protokolleintrag weist darauf hin, dass der CRM-Dienst aufgrund eines Anmeldefehlers nicht gestartet werden kann. Dies tritt am häufigsten auf, wenn das für die Ausführung der Anwendung verwendete Dienstkonto (häufig ein LDAP-/Domänen-Dienstkonto) deaktiviert ist oder falsche Anmeldeinformationen enthält. Dadurch wird der Start des erforderlichen Hintergrunddienstes verhindert, was dazu führt, dass die Anwendung sofort geschlossen wird."},{"n":190,"simulation":false,"prompt":"Ein Benutzer meldet, dass sich die Symbole auf seinem Desktop verändert haben. Ein Techniker untersucht den Fall und stellt fest, dass sich Programme nicht mehr öffnen lassen, auf Dateien nicht mehr zugegriffen werden kann und Dateiendungen geändert wurden. Wenn eine Lösegeldforderung auf dem Bildschirm erscheint, welche der folgenden Maßnahmen sollte der Techniker als Nächstes ergreifen?","options":[["A","Die Dateiendungen wieder zurücksetzen."],["B","Antiviren-Scans durchführen."],["C","Eine Wiederherstellung aus einem Backup durchführen."],["D","Das System isolieren."]],"answers":["D"],"explanation":"Der Techniker sollte das System unverzüglich isolieren, um zu verhindern, dass sich die Ransomware auf andere Rechner oder Netzwerkressourcen ausbreitet, bevor er Wiederherstellungsmaßnahmen ergreift."},{"n":191,"simulation":false,"prompt":"Welche der folgenden Ordner sind Systemordner unter macOS? (Wählen Sie zwei aus.)","options":[["A","Anwendungen"],["B","Spotlight"],["C","Time Machine"],["D","Bibliothek"],["E","FileVault"],["F","iCloud"]],"answers":["A","D"],"explanation":"„Applications“ ist ein zentraler Systemordner von macOS, in dem installierte Apps gespeichert werden. „Library“ ist ein Systemordner, der System- und Benutzerressourcen enthält, die von macOS und den Anwendungen benötigt werden."},{"n":192,"simulation":false,"prompt":"Ein Administrator untersucht eine Zero-Day-Sicherheitslücke in einem Kernsystem. Wenn die Sicherheitslücke nicht behoben wird, könnten die negativen Auswirkungen auf den Geschäftsbetrieb erheblich sein. Der Hersteller hat einen Patch veröffentlicht, dessen Bereitstellung jedoch eine Ausfallzeit erfordert. Welche der folgenden Maßnahmen sollte der Administrator ergreifen?","options":[["A","Einen Standard-Änderungsantrag erstellen."],["B","Eine Notfalländerung durchführen."],["C","Alle Änderungen sofort einfrieren."],["D","Den Betrieb bis zum nächsten Änderungsintervall fortsetzen."]],"answers":["B"],"explanation":"Eine Notfalländerung ist angebracht, wenn eine kritische Sicherheitslücke ein erhebliches Geschäftsrisiko darstellt und unverzüglich behoben werden muss, selbst wenn dies Ausfallzeiten erfordert."},{"n":193,"simulation":false,"prompt":"Ein Helpdesk-Techniker nutzt einen lokalen Netzwerkserver für die Bereitstellung von Images. Welche der folgenden Möglichkeiten sollte der Techniker nutzen, um eine Workstation mit dem Server zu verbinden und mit dem Herunterladen des Images zu beginnen?","options":[["A","PXE"],["B","SFTP"],["C","SAN"],["D","USB"]],"answers":["A"],"explanation":"PXE (Preboot Execution Environment) ermöglicht es einer Workstation, über das Netzwerk zu booten und eine Verbindung zu einem Imaging-Server herzustellen, um System-Images herunterzuladen und bereitzustellen."},{"n":194,"simulation":false,"prompt":"Ein Techniker arbeitet am Computer eines Benutzers. Der Techniker möchte sich auf dem Computer im Intranet anmelden, ohne den aktuellen Benutzer abzumelden. Was sollte der Techniker tun?","options":[["A","Den Proxy-Server konfigurieren."],["B","Den Popup-Blocker im Browser aktivieren."],["C","Den privaten Modus verwenden."],["D","Den Browser-Cache leeren."]],"answers":["C"],"explanation":"Der private Modus ermöglicht es dem Techniker, sich im Intranet anzumelden, ohne die aktuelle Sitzung, Cookies oder Anmeldedaten des aktuellen Benutzers zu beeinträchtigen."},{"n":195,"simulation":false,"prompt":"Ein Techniker unterstützt einen Benutzer, der zunehmend frustriert ist, weil eine Anwendung ständig abstürzt. Der Techniker muss sich mit einer anderen Abteilung abstimmen, um das Problem zu beheben. Welche der folgenden Maßnahmen sollte der Techniker ergreifen, um effektiv und professionell mit dem Benutzer zu kommunizieren?","options":[["A","Den Benutzer an die nächste Supportstufe weiterleiten."],["B","Den Benutzer bitten, eine formelle Beschwerde über das Problem einzureichen."],["C","Weiterhin eigenständig an der Lösung des Problems arbeiten."],["D","Das Problem und die Notwendigkeit der Zusammenarbeit erläutern."]],"answers":["D"],"explanation":"Durch eine klare Erläuterung des Problems und der Notwendigkeit der Zusammenarbeit wird der Nutzer auf dem Laufenden gehalten, die Erwartungen gesteuert und Professionalität gewahrt, während der Techniker sich mit einer anderen Abteilung abstimmt, um das Problem zu lösen."},{"n":196,"simulation":false,"prompt":"Welches der folgenden Tools sollte ein Techniker unter macOS verwenden, um eine ältere Version einer Datei wiederherzustellen?","options":[["A","Festplatten-Dienstprogramm"],["B","FileVault"],["C","Spotlight"],["D","Time Machine"]],"answers":["D"],"explanation":"Time Machine ist das Backup- und Wiederherstellungstool von macOS, mit dem ältere Versionen von Dateien wiederhergestellt oder gelöschte Daten wiedergewonnen werden können."},{"n":197,"simulation":false,"prompt":"Ein Benutzer verbindet seinen Laptop regelmäßig mit öffentlichen WLAN-Netzwerken. Der Benutzer möchte verhindern, dass sein Laptop auf alle Ping-Anfragen reagiert. Welche der folgenden Funktionen erfüllt diesen Zweck?","options":[["A","Internetoptionen"],["B","Windows Defender-Firewall"],["C","Netzwerk- und Freigabecenter"],["D","Virtuelles privates Netzwerk"]],"answers":["B"],"explanation":"Die Windows Defender-Firewall kann eingehende ICMP-Echo-Anfragen (Ping) blockieren und so verhindern, dass der Laptop in öffentlichen WLAN-Netzwerken antwortet."},{"n":198,"simulation":false,"prompt":"Ein Benutzer hat eine kostenlose App aus einem inoffiziellen App-Store installiert. Nun werden auf seinem Smartphone willkürliche Pop-ups angezeigt und der Datenverbrauch ist gestiegen. Außerdem kann der Benutzer bestimmte Aktionen nicht ausführen, wie z. B. das Öffnen von Banking-Apps oder das Aktualisieren seines Betriebssystems. Was sollte der Nutzer als Erstes tun, um die Sicherheitsprobleme auf seinem Smartphone zu beheben?","options":[["A","Das Gerät auf die Werkseinstellungen zurücksetzen."],["B","Den Cache des Geräts leeren."],["C","Den Kundendienst des Herstellers kontaktieren."],["D","Alle Passwörter auf dem Gerät ändern."]],"answers":["A"],"explanation":"Ein Zurücksetzen auf die Werkseinstellungen ist der erste Schritt, da das Gerät deutliche Anzeichen einer Malware-Infektion durch eine nicht verifizierte App aufweist. Durch das Zurücksetzen des Smartphones wird die schädliche Software entfernt und das Gerät in einen sicheren, sauberen Zustand zurückversetzt."},{"n":199,"simulation":false,"prompt":"Ein Techniker muss eine Einstellungsdatei auf allen Benutzer-Workstations anwenden. Welches der folgenden Tools sollte der Techniker zum Importieren der Datei verwenden?","options":[["A","lusrmgr.msc"],["B","devmgmt.msc"],["C","regedit.exe"],["D","msconfig.exe"]],"answers":["C"],"explanation":"Mit regedit.exe kann eine Einstellungsdatei (z. B. eine .reg-Datei) in die Windows-Registrierung importiert werden, sodass die Konfiguration für alle Benutzer-Workstations gilt."},{"n":200,"simulation":false,"prompt":"Wenn ein Firmenlaptop mit dem Unternehmensnetzwerk verbunden ist, kann der Laptop externe Websites aufrufen. Wenn der Laptop jedoch versucht, auf interne Websites zuzugreifen, erscheint die folgende Fehlermeldung: Hmm... Diese Seite kann nicht aufgerufen werden. Welche der folgenden Einstellungen sollte ein Techniker konfigurieren?","options":[["A","Subnetzmaske"],["B","DNS-Einstellungen"],["C","Standard-Gateway"],["D","DHCP"]],"answers":["B"],"explanation":"Falsche DNS-Einstellungen verhindern, dass der Laptop interne Hostnamen auflösen kann. Externe Websites funktionieren, da sie öffentliche DNS-Server nutzen, interne Adressen können jedoch ohne den richtigen internen DNS-Server nicht aufgelöst werden. Durch die Konfiguration der richtigen DNS-Einstellungen wird das Problem behoben."},{"n":201,"simulation":false,"prompt":"Ein Techniker aktualisiert einen virtuellen Desktop. Dabei stellt er fest, dass ein einzelnes Update den Betrieb einer geschäftskritischen Anwendung beeinträchtigt. Der Techniker informiert sich auf der Website des Anbieters und erfährt, dass die Anwendung das Ende ihrer Lebensdauer (EOL) erreicht hat und nicht mehr weiterentwickelt wird. Was sollte der Techniker tun, um die Funktionalität mit minimaler Ausfallzeit wiederherzustellen?","options":[["A","Eine Systemwiederherstellung durchführen."],["B","Den Patch deinstallieren und blockieren."],["C","Die Anwendung aktualisieren."],["D","Den zugrunde liegenden Hypervisor wechseln."]],"answers":["B"],"explanation":"Durch das Deinstallieren und Blockieren des Patches wird die Funktionalität sofort wiederhergestellt und verhindert, dass das inkompatible Update erneut angewendet wird. Dadurch werden Ausfallzeiten minimiert, während die geschäftskritische EOL-Anwendung weiterhin ausgeführt werden kann."},{"n":202,"simulation":false,"prompt":"Ein Smartphone-Nutzer versucht erfolglos, einen E-Mail-Anhang zu öffnen, der eine unerwartete überfällige Rechnung enthält. Nach diesem Versuch bemerkt der Nutzer Leistungsprobleme bei der Nutzung des mobilen Browsers und anderer Anwendungen. Der Nutzer startet das Smartphone neu, doch das Problem besteht weiterhin. Welche der folgenden Maßnahmen würde das Problem am ehesten beheben?","options":[["A","Das Smartphone zwangsweise herunterfahren und neu starten"],["B","Die E-Mail mit dem Anhang löschen"],["C","Das Gerät löschen und auf die Werkseinstellungen zurücksetzen"],["D","Den mobilen Browser deinstallieren und neu installieren"]],"answers":["C"],"explanation":"Die Symptome deuten auf eine wahrscheinliche Malware-Infektion durch den verdächtigen E-Mail-Anhang hin. Ein Zurücksetzen auf die Werkseinstellungen ist die effektivste Methode, um Malware vollständig zu entfernen und die normale Geräteleistung wiederherzustellen."},{"n":203,"simulation":false,"prompt":"Ein Techniker unterstützt einen Remote-Benutzer. Der Techniker bittet den Benutzer, einen bestimmten Ordner im Stammverzeichnis des Computers zu öffnen. Der Benutzer kann keinen Ordner mit diesem Namen finden. Der Techniker erklärt, dass einige Einstellungen erforderlich sind, damit der Ordner angezeigt wird. Was sollte der Benutzer tun, um den Ordner sehen zu können? (Wählen Sie zwei Optionen aus.)","options":[["A","Die Anzeigeeigenschaften anpassen."],["B","Den Datei-Explorer öffnen."],["C","Die Eigenschaften des Stammlaufwerks öffnen."],["D","Die Systemeinstellungen konfigurieren."],["E","Die Anzeige von Dateiendungen auf „Ein“ setzen."],["F","Aktivieren Sie das Kontrollkästchen, um versteckte Dateien anzuzeigen."]],"answers":["B","F"],"explanation":"Sie müssen den Datei-Explorer öffnen, um auf die Ordneransichtsoptionen zugreifen und zum Stammverzeichnis navigieren zu können. Die Anzeige versteckter Dateien muss aktiviert sein, da einige Systemordner standardmäßig versteckt sind und erst angezeigt werden, wenn diese Option aktiviert ist."},{"n":204,"simulation":false,"prompt":"Ein Benutzer ruft den Helpdesk an, um ein Problem mit seinem Smartphone zu melden. Nach der Rückkehr von einer Geschäftsreise kann der Benutzer ohne WLAN-Verbindung auf dem Smartphone weder auf E-Mails zugreifen noch Websites aufrufen. Welche der folgenden Maßnahmen würde der Benutzer höchstwahrscheinlich ergreifen, um das Problem zu beheben?","options":[["A","Mobilfunkdaten aktivieren."],["B","Das Datenlimit erhöhen."],["C","Die VPN-Verbindung trennen."],["D","Die SIM-Karte neu einlegen."]],"answers":["A"],"explanation":"Wenn das Smartphone nur über WLAN und nicht über Mobilfunknetze funktioniert, liegt die Ursache höchstwahrscheinlich darin, dass die Mobilfunkdaten deaktiviert sind. Durch das Aktivieren der Mobilfunkdaten wird der Zugriff auf E-Mails und Websites wiederhergestellt, wenn keine WLAN-Verbindung besteht."},{"n":205,"simulation":false,"prompt":"Ein Benutzer hat ein Dokument mithilfe von Online-Tools für die Zusammenarbeit erstellt, und das Dokument ist nun auf seinem Laptop nicht mehr verfügbar. Was sollte ein Desktop-Techniker tun, um das Problem zu beheben?","options":[["A","Den Remote-Ordner mit dem Laptop des Benutzers synchronisieren."],["B","Die Datei herunterladen und dem Benutzer per Instant Messaging senden."],["C","Textverarbeitungsprogramme auf dem Laptop des Benutzers installieren."],["D","Den Laptop des Benutzers mit dem WLAN verbinden."]],"answers":["A"],"explanation":"Das Dokument wurde mit Online-Tools zur Zusammenarbeit erstellt, d. h., es befindet sich im Cloud-Speicher. Um es auf dem Laptop verfügbar zu machen, muss der Techniker den Remote-Ordner (Cloud-Ordner) mit dem lokalen Gerät synchronisieren und so sicherstellen, dass die Datei heruntergeladen wird und zugänglich ist."},{"n":206,"simulation":false,"prompt":"Ein Kunde muss auf den Inhalt des Ordners „AppData“ zugreifen, der sich im lokalen Benutzerprofil befindet. Welche der folgenden Einstellungen sollte ein Techniker vornehmen, damit der Kunde diesen Speicherort problemlos aufrufen kann?","options":[["A","Indizierung"],["B","Optionen des Datei-Explorers"],["C","Datenschutz"],["D","Barrierefreiheit"]],"answers":["B"],"explanation":"Der Ordner „AppData“ ist standardmäßig ausgeblendet. Der Techniker sollte die Datei-Explorer-Optionen so konfigurieren, dass versteckte Dateien angezeigt werden, damit der Kunde problemlos auf den Ordner zugreifen kann."},{"n":207,"simulation":false,"prompt":"Welcher der folgenden Gründe spricht dafür, dass ein Unternehmen lokale KI anstelle von cloudbasierter KI einsetzt?","options":[["A","Angemessene Nutzung"],["B","Vermeidung von Halluzinationen"],["C","Datenschutz"],["D","Vermeidung von Verzerrungen"]],"answers":["C"],"explanation":"Bei einer lokal installierten KI werden alle Daten vor Ort gespeichert, wodurch das Unternehmen die volle Kontrolle behält und sichergestellt wird, dass sensible Informationen das Unternehmen niemals verlassen – dies entspricht den strengen Datenschutzanforderungen."},{"n":208,"simulation":false,"prompt":"Ein Mitarbeiter installiert versehentlich Software auf einem Firmen-PC. Die Software sendet Daten an einen Remote-Server. Welche der folgenden Aussagen beschreibt die Software am besten?","options":[["A","Trojaner"],["B","Spyware"],["C","Kryptominer"],["D","Ransomware"]],"answers":["B"],"explanation":"Spyware sammelt heimlich Benutzer- oder Systeminformationen und sendet diese an einen Remote-Server, was dem beschriebenen Verhalten entspricht."},{"n":209,"simulation":false,"prompt":"Ein Techniker ordnet eine SMB-Freigabe über die Befehlszeile zu. Welchen der folgenden Befehle sollte der Techniker verwenden?","options":[["A","cd"],["B","chkdsk"],["C","robocopy"],["D","net use"],["E","nslookup"]],"answers":["D"],"explanation":"Der Befehl „net use“ wird verwendet, um SMB-Netzwerkfreigaben über die Befehlszeile zuzuordnen."},{"n":210,"simulation":false,"prompt":"Ein Techniker erhält ein Ticket von einem Benutzer mit dem Inhalt: „Mein Computer hat Probleme.“ Was sollte der Techniker als Nächstes tun?","options":[["A","Die Systemressourcen des Benutzers überprüfen."],["B","Den Benutzer bitten, ein Ticket mit weiteren Informationen erneut einzureichen."],["C","Den Computer des Benutzers aktualisieren."],["D","Dem Nutzer weitere Fragen stellen."]],"answers":["D"],"explanation":"Durch das Stellen von Folgefragen kann der Techniker die Details erfassen, die zur Diagnose des im Ticket beschriebenen vagen Problems erforderlich sind."},{"n":211,"simulation":false,"prompt":"Ein Kunde übergibt einem Business-Analysten eine umfangreiche Tabelle zur Überprüfung. Als der Analyst versucht, die Tabelle zu öffnen, friert das System ein, bis die Anwendung abstürzt. Was sollte ein Techniker als Nächstes tun?","options":[["A","Einen Malware-Scan für die vom Kunden erhaltene Datei durchführen."],["B","Überprüfen, ob die Dateiendung der freigegebenen Tabellenkalkulation kompatibel ist."],["C","Die Ereignisprotokolle auf Fehlermeldungen im Zusammenhang mit der Anwendung überprüfen."],["D","Ein Upgrade der Tabellenkalkulationsanwendung durchführen."]],"answers":["C"],"explanation":"Die Überprüfung der Ereignisprotokolle deckt anwendungsspezifische Fehler auf, die erklären, warum die Tabellenkalkulation zum Einfrieren und Absturz des Systems führt, sodass der Techniker die Ursache ermitteln kann, bevor er weitere Maßnahmen ergreift."},{"n":212,"simulation":false,"prompt":"Ein Benutzer versucht, eine 3D-Rendering-Software auf einem neuen Windows-Computer zu installieren, doch die Installation schlägt fehl. Eine Fehlermeldung besagt, dass das System die Mindestanforderungen an die Hardwarekonfiguration nicht erfüllt. Welche der folgenden Komponenten sollte der Benutzer zuerst überprüfen?","options":[["A","USB-Geschwindigkeit"],["B","GPU-Anforderungen"],["C","Netzwerkkartenbandbreite"],["D","Leistung des Netzteils"]],"answers":["B"],"explanation":"3D-Rendering-Software ist in hohem Maße auf die Grafikverarbeitung angewiesen, daher ist es der erste Schritt, zu überprüfen, ob die GPU die Mindestanforderungen der Software erfüllt."},{"n":213,"simulation":false,"prompt":"Immer wenn ein Benutzer auf eine JPG-Datei klickt, öffnet sich Notepad und zeigt unlesbare Zeichen an. Ansonsten funktioniert die Workstation einwandfrei. Welche der folgenden Ursachen ist am wahrscheinlichsten für dieses Problem?","options":[["A","Die Workstation wurde mit Malware infiziert."],["B","Die Standardanwendung für Bilddateien ist falsch konfiguriert."],["C","Das Betriebssystem benötigt das aktuellste Update."],["D","Auf dem Computer des Benutzers muss ein neues Bildbearbeitungsprogramm installiert werden."]],"answers":["B"],"explanation":"Das Verhalten deutet darauf hin, dass Windows .jpg-Dateien mit der falschen Standardanwendung öffnet. Durch Korrektur der Dateizuordnung wird das Problem behoben."},{"n":214,"simulation":false,"prompt":"Ein Hersteller veröffentlicht normalerweise monatlich Sicherheitspatc
