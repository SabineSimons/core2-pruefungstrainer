function getTrainErrors(){try{return JSON.parse(localStorage.getItem(TRAIN_ERR_KEY)||'[]')}catch(e){return []}}
function setTrainErrors(a){localStorage.setItem(TRAIN_ERR_KEY,JSON.stringify([...new Set(a)].sort((x,y)=>x-y)))}
function addTrainError(n){let a=getTrainErrors();if(!a.includes(n)){a.push(n);setTrainErrors(a)}}
function clearTrainError(n){setTrainErrors(getTrainErrors().filter(x=>x!==n))}
function topicArg(n){return encodeURIComponent(n)}
function home(){stopTimer();$('#top').classList.add('hidden');const old=load();let resume=old&&old.status==='running';let errCount=getTrainErrors().length;app.innerHTML=`<section class="card hero"><div class="qnum">COMPTIA A+ · CORE 2</div><h1>220-1202 Lern- & Prüfungstrainer</h1><p class="big">Original-Fragenpool · Themen · PBQs · 90 Fragen / 90 Minuten</p><p>Bei jedem neuen Training werden die Fragen neu gemischt. Eine laufende Prüfung bleibt dagegen in ihrer gespeicherten Reihenfolge.</p><div class="modegrid"><div class="modecard"><h3>📚 Fragentrainer</h3><p>Alle Fragen oder gezielt nur deine bisherigen Fehler. Nach jeder Antwort sofort richtig/falsch + Erklärung.</p><div class="actions" style="justify-content:flex-start;margin-top:10px"><button class="btn primary" onclick="startTraining('all')">Alle Fragen</button><button class="btn secondary" onclick="startErrorTraining()">Nur Fehler (${errCount})</button></div></div><div class="modecard"><h3>🧩 Themen-Training</h3><p>Gezielt Windows, Sicherheit, Netzwerk, Befehle/Linux, Software, Mobile oder Support üben.</p><button class="btn primary" onclick="topicMenu()">Themen wählen</button><div class="quicktopics" style="display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;justify-content:center">${Object.keys(TOPICS).map(n=>`<button class="btn secondary" style="padding:8px 10px;font-size:13px" onclick="startTopic('${topicArg(n)}')">${n}</button>`).join('')}</div></div><div class="modecard"><h3>🛠️ Simulationstrainer</h3><p>Die aus der PDF sauber rekonstruierbaren PBQs separat üben.</p><button class="btn primary" onclick="startPBQTraining()">PBQs starten</button></div><div class="modecard"><h3>⏱️ Vollprüfung</h3><p>90 Fragen · 90 Minuten · Fortschritt · Fähnchen · Übersicht · vorzeitige Abgabe · Auswertung.</p>${resume?'<button class="btn primary" onclick="resumeExam()">▶ Prüfung fortsetzen</button> ':''}<button class="btn ${resume?'secondary':'primary'}" onclick="newExam()">Neue Prüfung</button></div></div>${resume?`<p class="small">Gespeicherte Prüfung: Frage ${old.index+1} von ${old.items?.length||90} · ${Object.keys(old.answers||{}).length} Antworten</p>`:''}</section><div class="footerNote">Basis: die bereitgestellte 220-1202-Core-2-Datei. Keine fachliche Eigenkorrektur der dort angegebenen Lösungen.</div>`} 
function startTopic(encoded){startTraining(decodeURIComponent(encoded))}
function newExam(){if(load()?.status==='running'&&!confirm('Die gespeicherte Prüfung wirklich verwerfen und neu starten?'))return;let pool=shuffle(BANK).slice(0,EXAM_COUNT-PBQS.length);let items=shuffle([...PBQS,...pool.map(q=>({id:'q'+q.n,n:q.n,kind:'mc',q}))]);state={status:'running',created:Date.now(),end:Date.now()+DURATION,index:0,items,answers:{},flags:{},submitted:false};save();startUI()}
function resumeExam(){state=load();if(!state||state.status!=='running')return home();startUI()}
function startUI(){$('#top').classList.remove('hidden');startTimer();render()}
function startTimer(){stopTimer();updateTimer();tick=setInterval(updateTimer,1000)} function stopTimer(){if(tick)clearInterval(tick);tick=null}
function updateTimer(){if(!state||state.status!=='running')return;let ms=state.end-Date.now();if(ms<=0){$('#timer').textContent='00:00';submitExam(true);return}let s=Math.ceil(ms/1000),m=Math.floor(s/60),r=s%60;$('#timer').textContent=String(m).padStart(2,'0')+':'+String(r).padStart(2,'0');$('#timer').classList.toggle('low',s<=600)}
function current(){return state.items[state.index]}
function render(){if(!state)return home();if(state.status==='done')return results();let it=current();let total=state.items.length;$('#counter').textContent=(state.index+1)+' / '+total;$('#prog').style.width=((state.index+1)/total*100)+'%';if(it.kind==='mc')renderMC(it);else renderPBQ(it)}
function isMulti(q){return q.answers.length>1}
function renderMC(it){let q=it.q, selected=state.answers[it.id]||[];let type=isMulti(q)?'Mehrfachauswahl':'Einzelauswahl';app.innerHTML=`<section class="card"><div class="qhead"><div><div class="qnum">FRAGE ${state.index+1} VON ${state.items.length} · ORIGINAL-NR. ${q.n}</div></div><span class="type">${type}</span></div><div class="qtext">${esc(q.prompt)}</div>${isMulti(q)?'<div class="hint">Mehrere Antworten auswählen.</div>':''}<div>${q.options.map(([l,t])=>`<label class="option ${selected.includes(l)?'selected':''}"><input type="${isMulti(q)?'checkbox':'radio'}" name="ans" value="${l}" ${selected.includes(l)?'checked':''} onchange="pickMC('${it.id}','${l}',this.checked,${isMulti(q)})"><span class="letter">${l}.</span><span>${esc(t)}</span></label>`).join('')}</div>${navHtml(it.id)}</section>`}
function pickMC(id,l,checked,multi){let a=state.answers[id]||[];if(multi){a=checked?[...new Set([...a,l])]:a.filter(x=>x!==l)}else a=[l];state.answers[id]=a;save();render()}
function navHtml(id){let flag=!!state.flags[id];return `<div class="nav"><div class="navgroup"><button class="btn secondary" onclick="prev()" ${state.index===0?'disabled':''}>← Zurück</button><button class="btn flag ${flag?'on':''}" onclick="toggleFlag('${id}')">⚑ ${flag?'Markiert':'Frage merken'}</button></div><div class="navgroup"><button class="btn secondary" onclick="overview()">Übersicht</button><button class="btn danger" onclick="askSubmit()">Prüfung abgeben</button>${state.index===state.items.length-1?'':'<button class="btn primary" onclick="next()">Weiter →</button>'}</div></div>`}
function toggleFlag(id){state.flags[id]=!state.flags[id];save();render()} function prev(){if(state.index>0){state.index--;save();render();scrollTo(0,0)}} function next(){if(state.index<state.items.length-1){state.index++;save();render();scrollTo(0,0)}else overview(true)}
function renderPBQ(it){let v=state.answers[it.id]||{};let body='';if(it.kind==='pbq1') body=pbq1(v); if(it.kind==='pbq19')body=pbq19(v); if(it.kind==='pbq72')body=pbq72(v); if(it.kind==='pbq282')body=pbq282(v);app.innerHTML=`<section class="card pbq"><div class="qhead"><div><div class="qnum">FRAGE ${state.index+1} VON ${state.items.length} · ORIGINAL-NR. ${it.n}</div></div><span class="type">SIMULATION / PBQ</span></div><div class="qtext">${esc(it.title)}</div><p>${esc(it.prompt)}</p>${body}${navHtml(it.id)}</section>`}
function sel(id,key,opts,val){return `<select onchange="pbqSet('${id}','${key}',this.value)"><option value="">— auswählen —</option>${opts.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
function pbqSet(id,key,val){state.answers[id]=state.answers[id]||{};state.answers[id][key]=val;save()}
function pbq1(v){let ips=['169.254.17.1','224.0.0.1','50.90.234.1','127.1.0.1','192.168.10.1','10.100.0.1'];return `<div class="hint">Konfigurieren Sie WLAN, Router/Portweiterleitung, Firewall und Geräteplatzierung.</div><div class="pbqgrid"><div class="field"><label>WLAN-AP · LAN-IP</label>${sel('pbq1','apip',ips,v.apip)}</div><div class="field"><label>WLAN-Verschlüsselung</label>${sel('pbq1','enc',['TLS 1.2','WPA2 PSK','L2TP/IPsec','WPA2 Enterprise'],v.enc)}</div><div class="field"><label>Router · Portweiterleitung</label>${sel('pbq1','port',['Allow TCP Any 3347','Allow TCP Any 3306','Allow TCP Any 25','Allow TCP Any 23','Allow TCP Any 3389'],v.port)}</div><div class="field"><label>Firewall · LAN-IP zum geschützten Subnetz</label>${sel('pbq1','fwip',ips,v.fwip)}</div><div class="field"><label>Windows-PC platzieren</label>${sel('pbq1','pc',['Hinter dem Router / Portweiterleitung','Am WLAN-Access-Point','Im geschützten Subnetz'],v.pc)}</div><div class="field"><label>Spielkonsole platzieren</label>${sel('pbq1','console',['Am WLAN-Access-Point','Hinter der Firewall','Direkt im geschützten Subnetz'],v.console)}</div></div>`}
function pbq19(v){let sets=[['Ich helfe Ihnen heute gerne weiter.','Haben Sie versucht, den Router neu zu starten?','Welche Firmwareversion läuft?','Lesen Sie zuerst die FAQ.'],['Ist dies der erste Router in Ihrem Büro?','Ist Ihr Internetanbieter erreichbar?','Haben Sie ein VPN?','Ist das WLAN-Signal stark?'],['Als Erstes müssen Sie das Standardpasswort ändern.','Als Erstes müssen Sie UPnP aktivieren.','Als Erstes müssen Sie die Firewall deaktivieren.','Als Erstes müssen Sie die SSID verstecken.'],['Legen Sie ein neues Passwort fest, das einen Großbuchstaben, einen Kleinbuchstaben und ein Sonderzeichen enthält.','Verwenden Sie das aufgedruckte Standardpasswort weiter.','Verwenden Sie admin/admin.','Lassen Sie das Passwortfeld leer.'],['Ja, bitte einen Neustart durchführen.','Nein, keinesfalls neu starten.','Werkseinstellungen laden.','Router ausschalten und nicht wieder einschalten.']];return `<div class="pbqgrid">${sets.map((o,i)=>`<div class="field"><label>Chat-Antwort ${i+1}</label>${sel('pbq19','s'+i,o,v['s'+i])}</div>`).join('')}</div>`}
function pbq72(v){let mails=['Konto gesperrt','Teilen Sie Ihr Feedback mit','Mitarbeitereinführung','Sicherheitsupdate','Vorstellungsgespräch'];return `<div class="hint">Unternehmensrichtlinie: Phishing melden; Spam entsprechend der vorgegebenen Sicherheitsmaßnahme behandeln.</div>${mails.map((m,i)=>`<div class="emailrow"><div class="emailtitle">Posteingang ${i+1}: ${m}</div><div class="pbqgrid"><div class="field"><label>Klassifizierung</label>${sel('pbq72','c'+i,['Phishing','Spam','Legitim'],v['c'+i])}</div><div class="field"><label>Maßnahme</label>${sel('pbq72','a'+i,['An Informationssicherheit melden','An IT-Sicherheitsabteilung melden','Keine weiteren Maßnahmen'],v['a'+i])}</div></div></div>`).join('')}`}
function pbq282(v){let cmds=['shutdown -s -f -t 0','tasklist | sort','Get-WmiObject win32_computersystem','copy "C:\\Program Files\\Testing\\msvcp100.dll" "C:\\Windows\\System32" /r /y','Get-EventLog -LogName System -Newest 8','reg /s "msvcp100.reg"','ls msvc*','setx path "C:\\Windows\\System32"','regsvr32 msvcp100.dll','robocopy "\\User-PC02\\C$\\Windows\\System32" "C:\\Program Files (x86)\\Testing" "msvcp100.dll"','gpupdate /force'];return `<div class="hint">Systemfehler: MSVCP100.dll fehlt. Wählen Sie die zwei Befehle in der richtigen Reihenfolge.</div><div class="terminal">System Error: MSVCP100.dll was not found. The application cannot start.</div><div class="pbqgrid"><div class="field"><label>1st CLI Resolution</label>${sel('pbq282','c1',cmds,v.c1)}</div><div class="field"><label>2nd CLI Resolution</label>${sel('pbq282','c2',cmds,v.c2)}</div></div>`}
function answered(it){let a=state.answers[it.id];if(it.kind==='mc')return Array.isArray(a)&&a.length>0;if(it.kind==='pbq1')return a&&['apip','enc','port','fwip','pc','console'].every(k=>a[k]);if(it.kind==='pbq19')return a&&[0,1,2,3,4].every(i=>a['s'+i]);if(it.kind==='pbq72')return a&&[0,1,2,3,4].every(i=>a['c'+i]&&a['a'+i]);if(it.kind==='pbq282')return a&&a.c1&&a.c2;return false}
function overview(final=false){let done=state.items.filter(answered).length, flags=Object.values(state.flags).filter(Boolean).length;app.innerHTML=`<section class="card"><div class="qnum">PRÜFUNGSÜBERSICHT</div><div class="qtext">${done} von ${state.items.length} beantwortet · ${flags} markiert</div><div class="legend"><span><i class="dot" style="background:#eaf7ef"></i>beantwortet</span><span><i class="dot" style="background:#fff0ef"></i>offen</span><span>⚑ markiert</span></div><div class="reviewgrid">${state.items.map((it,i)=>`<button class="qchip ${answered(it)?'done':'empty'} ${state.flags[it.id]?'flagged':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><div class="nav"><button class="btn secondary" onclick="render()">← Zur Frage</button><button class="btn primary" onclick="askSubmit()">Prüfung endgültig abgeben</button></div>${final&&done<EXAM_COUNT?`<div class="hint">Noch ${state.items.length-done} Frage(n) unbeantwortet. Du kannst trotzdem abgeben.</div>`:''}</section>`}
function jump(i){state.index=i;save();render();scrollTo(0,0)}
function askSubmit(){let open=state.items.filter(x=>!answered(x)).length;if(confirm(`Prüfung jetzt abgeben?${open?' Noch '+open+' Frage(n) sind unbeantwortet.':''}`))submitExam(false)}
function eq(a,b){a=[...(a||[])].sort();b=[...(b||[])].sort();return JSON.stringify(a)===JSON.stringify(b)}
function gradePBQ(it,a){if(!a)return false;if(it.kind==='pbq1')return a.apip==='192.168.10.1'&&a.enc==='WPA2 PSK'&&a.port==='Allow TCP Any 3389'&&a.fwip==='10.100.0.1'&&a.pc==='Hinter dem Router / Portweiterleitung'&&a.console==='Am WLAN-Access-Point';if(it.kind==='pbq19'){let k=['Ich helfe Ihnen heute gerne weiter.','Ist dies der erste Router in Ihrem Büro?','Als Erstes müssen Sie das Standardpasswort ändern.','Legen Sie ein neues Passwort fest, das einen Großbuchstaben, einen Kleinbuchstaben und ein Sonderzeichen enthält.','Ja, bitte einen Neustart durchführen.'];return k.every((x,i)=>a['s'+i]===x)}if(it.kind==='pbq282')return a.c1==='copy \"C:\\Program Files\\Testing\\msvcp100.dll\" \"C:\\Windows\\System32\" /r /y'&&a.c2==='regsvr32 msvcp100.dll';if(it.kind==='pbq72'){let c=['Phishing','Legitim','Legitim','Spam','Legitim'],ac=['An Informationssicherheit melden','Keine weiteren Maßnahmen','Keine weiteren Maßnahmen','An IT-Sicherheitsabteilung melden','Keine weiteren Maßnahmen'];return c.every((x,i)=>a['c'+i]===x&&a['a'+i]===ac[i])}return false}
function submitExam(auto){if(!state||state.status!=='running')return;state.status='done';state.auto=auto;state.finished=Date.now();let correct=0;state.grades={};for(const it of state.items){let ok=it.kind==='mc'?eq(state.answers[it.id],it.q.answers):gradePBQ(it,state.answers[it.id]);state.grades[it.id]=ok;if(ok)correct++}state.correct=correct;save();stopTimer();results()}
function correctText(it){if(it.kind==='mc')return it.q.answers.map(a=>a+'. '+(it.q.options.find(x=>x[0]===a)?.[1]||'')).join(' | ');if(it.kind==='pbq1')return 'AP 192.168.10.1 · WPA2 PSK · TCP 3389 · Firewall 10.100.0.1 · PC hinter Router · Konsole am WLAN-AP';if(it.kind==='pbq19')return 'Hilfsbereit starten → klären, ob Ersatzrouter → Standardpasswort ändern → starkes Passwort → Neustart';if(it.kind==='pbq282')return '1. DLL nach System32 kopieren · 2. regsvr32 msvcp100.dll';if(it.kind==='pbq72')return '1 Phishing/melden · 2 legitim/nichts · 3 legitim/nichts · 4 Spam/IT-Sicherheit · 5 legitim/nichts';return ''}
function explanation(it){if(it.kind==='mc')return it.q.explanation||'';if(it.kind==='pbq1')return 'RDP benötigt TCP 3389. Der WLAN-AP nutzt 192.168.10.1 und WPA2 PSK; das geschützte Subnetz verwendet 10.100.0.1.';if(it.kind==='pbq19')return 'Die Reihenfolge folgt der in der Datei angegebenen Helpdesk-Unterhaltung und den dort genannten Sicherheitsmaßnahmen.';if(it.kind==='pbq282')return 'Laut PDF fehlt MSVCP100.dll. Die Datei wird zuerst nach System32 kopiert und anschließend mit regsvr32 registriert.';if(it.kind==='pbq72')return 'Die Klassifizierung und Maßnahmen entsprechen der Lösung der E-Mail-Simulation in der Datei.';return ''}
function results(){stopTimer();$('#top').classList.add('hidden');let total=state.items.length,pct=Math.round(state.correct/total*100),passed=pct>=75;let wrong=state.items.filter(it=>!state.grades[it.id]);app.innerHTML=`<section class="card resultbox"><div class="qnum">AUSWERTUNG</div><div class="score ${passed?'pass':'fail'}">${pct}%</div><h2>${state.correct} von ${total} richtig</h2><p>${state.auto?'Die 90 Minuten sind abgelaufen. Die Prüfung wurde automatisch abgegeben.':'Prüfung abgegeben.'}</p><div class="actions"><button class="btn primary" onclick="newExamFromResult()">Neue Prüfung</button><button class="btn secondary" onclick="showAllExamQuestions()">Alle Fragen (${total})</button><button class="btn secondary" onclick="showWrong()">Nur Fehler (${wrong.length})</button></div></section>`}
function showAllExamQuestions(){let all=state.items;app.innerHTML=`<section class="card"><div class="qnum">ALLE PRÜFUNGSFRAGEN</div><div class="qtext">${all.length} Fragen mit Auswertung</div><div class="resultlist">${all.map((it,i)=>{let ok=state.grades[it.id];return `<div class="resitem ${ok?'good':'bad'}"><div><b>${i+1}. ${it.kind==='mc'?esc(it.q.prompt):esc(it.title)}</b></div><div><b>${ok?'✅ Richtig':'❌ Falsch / unbeantwortet'}</b></div><div class="correct">Richtig: ${esc(correctText(it))}</div><div class="explain">${esc(explanation(it))}</div></div>`}).join('')}</div><div class="actions"><button class="btn secondary" onclick="results()">← Zur Auswertung</button><button class="btn primary" onclick="showWrong()">Nur Fehler</button></div></section>`}
function newExamFromResult(){clearExam();home();setTimeout(newExam,0)}
function showWrong(){let wrong=state.items.filter(it=>!state.grades[it.id]);app.innerHTML=`<section class="card"><div class="qnum">FEHLERANALYSE</div><div class="qtext">${wrong.length} Frage(n) noch einmal anschauen</div><div class="resultlist">${wrong.map((it,i)=>`<div class="resitem bad"><div><b>${i+1}. ${it.kind==='mc'?esc(it.q.prompt):esc(it.title)}</b></div><div class="correct">Richtig: ${esc(correctText(it))}</div><div class="explain">${esc(explanation(it))}</div></div>`).join('')}</div><div class="actions"><button class="btn secondary" onclick="results()">← Zur Auswertung</button><button class="btn secondary" onclick="showAllExamQuestions()">Alle Fragen</button><button class="btn primary" onclick="newExamFromResult()">Neue Prüfung</button></div></section>`}
const TOPICS={
 'Windows & Betriebssystem':['windows','bitlocker','ntfs','exfat','systemsteuerung','task-manager','ereignisanzeige','domäne','gruppenricht','registry','boot','uefi','partition','diskmgmt','dienst'],
 'Sicherheit':['malware','phishing','ransomware','mfa','passwort','verschlüssel','zero-day','social engineering','quarantäne','firewall','least privilege','berecht','zertifikat','hash','edr'],
 'Netzwerk & Remote':['dns','dhcp','vpn','vnc','rdp','router','wlan','wi-fi','netzwerk','ip-adresse','proxy','port','tracert','netstat','nslookup','freigabe'],
 'Befehle & Linux':['linux','sudo',' su ',' cp ','chmod','chown','grep','dig','net use','powercfg','gpupdate','robocopy','xcopy','cmd','powershell','befehl'],
 'Software & Deployment':['software','anwendung','installation','update','patch','deployment','bereitstellung','lizenz','eula','image','backup','wiederherstellung','dll'],
 'Mobile & MDM':['smartphone','mobil','mdm','android','ios','remote wipe','fernlöschung','biometr','app'],
 'Support & Dokumentation':['helpdesk','ticket','dokument','störungsbericht','sop','änderung','change','kunde','eskal','kommunikation','aup','sicherheitsdatenblatt']
};
let train=null;
function topicFor(q,name){let t=(q.prompt+' '+q.explanation+' '+q.options.map(x=>x[1]).join(' ')).toLowerCase();return TOPICS[name].some(k=>t.includes(k.trim()))}
function topicMenu(){stopTimer();$('#top').classList.add('hidden');app.innerHTML=`<section class="card"><div class="qnum">THEMEN-TRAINING</div><div class="qtext">Was willst du heute quälen?</div><div class="topicgrid">${Object.keys(TOPICS).map(n=>`<button class="topicbtn" onclick="startTopic('${topicArg(n)}')">${n}<br><small>${BANK.filter(q=>topicFor(q,n)).length} Fragen</small></button>`).join('')}</div><div class="actions"><button class="btn secondary" onclick="home()">← Hauptmenü</button></div></section>`}
function startTraining(topic){let pool=topic==='all'?BANK.slice():BANK.filter(q=>topicFor(q,topic));train={topic,items:shuffle(pool),index:0,selected:[],checked:false,correct:0};renderTraining()}
function startErrorTraining(){let ids=getTrainErrors(),pool=BANK.filter(q=>ids.includes(q.n));if(!pool.length){app.innerHTML=`<section class="card hero"><h2>Keine Fehler gespeichert 🎉</h2><p>Im Fragentrainer werden falsch beantwortete Fragen automatisch gesammelt.</p><div class="actions"><button class="btn primary" onclick="startTraining('all')">Alle Fragen starten</button><button class="btn secondary" onclick="home()">Hauptmenü</button></div></section>`;return}train={topic:'errors',items:shuffle(pool),index:0,selected:[],checked:false,correct:0};renderTraining()}
function renderTraining(){stopTimer();$('#top').classList.add('hidden');let q=train.items[train.index];if(!q)return trainingDone();let multi=q.answers.length>1;app.innerHTML=`<section class="card"><div class="trainstat">${train.topic==='all'?'Alle Fragen':train.topic==='errors'?'Nur Fehler':esc(train.topic)} · Frage ${train.index+1} von ${train.items.length} · bisher ${train.correct} richtig</div><div class="qnum">ORIGINAL-FRAGE ${q.n}</div><div class="qtext">${esc(q.prompt)}</div>${q.options.map(([l,t])=>`<label class="option ${train.selected.includes(l)?'selected':''}"><input type="${multi?'checkbox':'radio'}" name="tr" ${train.selected.includes(l)?'checked':''} onchange="trainPick('${l}',${multi})"><span class="letter">${l}.</span><span>${esc(t)}</span></label>`).join('')}${train.checked?trainFeedback(q):''}<div class="nav"><button class="btn secondary" onclick="home()">← Hauptmenü</button><div class="navgroup">${train.checked?'<button class="btn primary" onclick="trainNext()">Nächste Frage →</button>':'<button class="btn primary" onclick="trainCheck()">Antwort prüfen</button>'}</div></div></section>`}
function trainPick(l,multi){if(train.checked)return;if(multi){train.selected=train.selected.includes(l)?train.selected.filter(x=>x!==l):[...train.selected,l]}else train.selected=[l];renderTraining()}
function trainCheck(){if(!train.selected.length)return alert('Bitte erst eine Antwort auswählen.');train.checked=true;let q=train.items[train.index];train.ok=eq(train.selected,q.answers);if(train.ok){train.correct++;clearTrainError(q.n)}else addTrainError(q.n);renderTraining()}
function trainFeedback(q){return `<div class="feedback ${train.ok?'good':'bad'}"><b>${train.ok?'✅ Richtig':'❌ Falsch'}</b><br><b>Richtige Antwort:</b> ${esc(q.answers.map(a=>a+'. '+(q.options.find(x=>x[0]===a)?.[1]||'')).join(' | '))}<br><span>${esc(q.explanation||'')}</span></div>`}
function trainNext(){train.index++;train.selected=[];train.checked=false;train.ok=false;renderTraining();scrollTo(0,0)}
function trainingDone(){app.innerHTML=`<section class="card resultbox"><div class="qnum">TRAINING FERTIG</div><div class="score">${train.correct}/${train.items.length}</div><p>Beim nächsten Start wird die Reihenfolge wieder neu gemischt.</p><div class="actions"><button class="btn primary" onclick="startTraining('all')">Alle Fragen</button><button class="btn secondary" onclick="startErrorTraining()">Nur Fehler (${getTrainErrors().length})</button><button class="btn secondary" onclick="home()">Hauptmenü</button></div></section>`}
function startPBQTraining(){let items=shuffle(PBQS);state={status:'pbqtrain',index:0,items,answers:{},flags:{}};renderPBQTrain()}
function renderPBQTrain(){let it=state.items[state.index],v=state.answers[it.id]||{},body='';if(it.kind==='pbq1')body=pbq1(v);if(it.kind==='pbq19')body=pbq19(v);if(it.kind==='pbq72')body=pbq72(v);if(it.kind==='pbq282')body=pbq282(v);app.innerHTML=`<section class="card pbq"><div class="qnum">SIMULATION ${state.index+1} VON ${state.items.length} · ORIGINAL-NR. ${it.n}</div><div class="qtext">${esc(it.title)}</div><p>${esc(it.prompt)}</p>${body}<div id="pbqfb"></div><div class="nav"><button class="btn secondary" onclick="home()">← Hauptmenü</button><div class="navgroup"><button class="btn primary" onclick="checkPBQTrain()">Simulation prüfen</button></div></div></section>`}
function checkPBQTrain(){let it=state.items[state.index],ok=gradePBQ(it,state.answers[it.id]);$('#pbqfb').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'✅ Richtig':'❌ Noch nicht richtig'}</b><br><b>Lösung:</b> ${esc(correctText(it))}<br>${esc(explanation(it))}</div><div class="actions"><button class="btn primary" onclick="nextPBQTrain()">Nächste Simulation →</button></div>`}
function nextPBQTrain(){state.index++;if(state.index>=state.items.length){app.innerHTML=`<section class="card hero"><h2>PBQs einmal durch 🎯</h2><p>Beim Neustart werden auch die Simulationen neu gemischt.</p><div class="actions"><button class="btn primary" onclick="startPBQTraining()">Nochmal</button><button class="btn secondary" onclick="home()">Hauptmenü</button></div></section>`;return}renderPBQTrain();scrollTo(0,0)}

home();
</script></body></html>
