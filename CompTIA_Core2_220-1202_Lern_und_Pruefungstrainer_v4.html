<script>
const BANK=[{"n":2,"simulation":false,"prompt":"Ein Techniker muss von seinem Windows-Laptop aus Fernsupport für ein älteres Linux-basiertes Betriebssystem leisten. Die Lösung muss es dem Techniker ermöglichen, die Aktivitäten des Benutzers zu verfolgen und mit dessen Sitzung zu interagieren. Welche der folgenden Fernzugriffstechnologien würde diesen Anwendungsfall unterstützen?","options":[["A","VPN"],["B","VNC"],["C","SSH"],["D","RDP"]],"answers":["B"],"explanation":"VNC (Virtual Network Computing) ermöglicht einen plattformübergreifenden grafischen Fernzugriff auf den Desktop, sodass ein Techniker an einem Windows-Rechner sowohl den Linux-Desktop in Echtzeit anzeigen als auch mit der Sitzung des Benutzers interagieren kann (Maus-/Tastatursteuerung)."},{"n":3,"simulation":false,"prompt":"Ein Techniker versucht, eine Workstation in eine Domäne einzubinden, erhält jedoch die Fehlermeldung, dass die Domäne nicht gefunden werden kann. Der Techniker kann jedoch den Server anpingen und auf das Internet zugreifen. Angesichts der folgenden Informationen: Was sollte der Techniker tun, um das Problem zu beheben?","options":[["A","Die DNS-Einstellungen ändern."],["B","Eine statische IP-Adresse zuweisen."],["C","Eine Subnetzmaske konfigurieren."],["D","Das Standard-Gateway aktualisieren."]],"answers":["A"],"explanation":"Fehler beim Beitritt zur Domäne bei erfolgreicher IP-Konnektivität deuten fast immer auf Probleme bei der Namensauflösung hin. Die Workstation verwendet öffentliche DNS-Server (8.8.8.8 und 1.1.1.1), die keine Einträge für die interne AD-Domäne oder deren Controller enthalten. Durch die Umleitung des DNS auf den internen DNS-Server (192.168.1.10) wird sichergestellt, dass der Domänenname und die SRV-Einträge aufgelöst werden können, sodass der Beitritt erfolgreich durchgeführt werden kann."},{"n":4,"simulation":false,"prompt":"Ein Netzwerktechniker stellt fest, dass die meisten Netzwerk-Switches des Unternehmens mittlerweile das Ende ihrer Lebensdauer erreicht haben und aktualisiert werden müssen. Was sollte der Techniker als Erstes tun?","options":[["A","Die Änderung umsetzen."],["B","Die Änderung genehmigen."],["C","Die Änderung vorschlagen."],["D","Die Änderung planen."]],"answers":["C"],"explanation":"In einem strukturierten Änderungsmanagementprozess besteht der allererste Schritt darin, die Änderung über einen Änderungsantrag (Request for Change, RFC) vorzuschlagen (oder offiziell zu beantragen). Dadurch wird sichergestellt, dass die Beteiligten die Notwendigkeit prüfen, Risiken bewerten und die Priorität festlegen, bevor Genehmigungen erteilt, Termine festgelegt oder die Umsetzung erfolgt."},{"n":5,"simulation":false,"prompt":"Die MFA für eine benutzerdefinierte Webanwendung auf dem Smartphone eines Benutzers funktioniert nicht mehr. Der Benutzer erinnert sich, dass sie zuletzt vor seiner Urlaubsreise ins Ausland noch funktioniert hat. Was sollte der Techniker als Erstes tun?","options":[["A","Die Datums- und Uhrzeiteinstellungen überprüfen."],["B","Patches für das mobile Betriebssystem installieren."],["C","Die Anwendung deinstallieren und neu installieren."],["D","An den Website-Entwickler weiterleiten."]],"answers":["A"],"explanation":"MFA-Apps mit zeitbasierten Einmalpasswörtern (TOTP) sind auf eine genaue Uhrzeitsynchronisation angewiesen. Auf Reisen kann die Uhr des Geräts aus dem Takt geraten, wodurch die generierten Codes ungültig werden. Wenn Sie sicherstellen, dass Datum, Uhrzeit und Zeitzone des Smartphones korrekt eingestellt sind, wird die MFA-Funktionalität in der Regel sofort wiederhergestellt."},{"n":6,"simulation":false,"prompt":"Was ist in einem Sicherheitsdatenblatt für eine Notstromversorgung enthalten?","options":[["A","Montageanleitung"],["B","Notfallmaßnahmen"],["C","Konfigurationsschritte"],["D","Spannungsangaben"]],"answers":["B"],"explanation":"Ein Sicherheitsdatenblatt (MSDS) enthält wichtige Sicherheits- und Handhabungshinweise für Gefahrstoffe – in diesem Fall die Chemikalien der Batterie. Es enthält Notfallmaßnahmen (Erste-Hilfe-Maßnahmen, Maßnahmen zur Brandbekämpfung, Eindämmung von Verschüttungen) und stellt sicher, dass Einsatzkräfte im Falle eines Vorfalls wissen, wie sie sicher vorgehen müssen."},{"n":7,"simulation":false,"prompt":"Auf dem Bildschirm eines zuvor funktionierenden Computers wird beim Hochfahren wiederholt die Fehlermeldung „OS Not Found“ angezeigt. An den Computer sind lediglich ein USB-Stick, eine Tastatur und eine Maus angeschlossen. Was sollte ein Techniker als Erstes tun?","options":[["A","Datenwiederherstellungstools auf der Festplatte ausführen."],["B","Die Festplatte im GPT-Format partitionieren."],["C","Die Startoptionen überprüfen."],["D","Von UEFI auf BIOS umstellen."]],"answers":["C"],"explanation":"Der Fehler „OS Not Found“ deutet meist darauf hin, dass das System nicht vom richtigen Gerät bootet. Die Überprüfung und Korrektur der Boot-Reihenfolge (sodass die interne Festplatte Vorrang vor USB oder anderen Einträgen hat) ist der schnellste erste Schritt, bevor Änderungen an den Festplatten- oder Firmware-Einstellungen vorgenommen werden."},{"n":8,"simulation":false,"prompt":"Ein Sicherheitsadministrator schult alle Mitarbeiter einer Organisation in der Verwendung von BitLocker To Go. Welche der folgenden Aussagen beschreibt den Grund für diese Schulung am besten?","options":[["A","Um sicherzustellen, dass alle Wechseldatenträger für den Fall eines Verlusts oder Diebstahls passwortgeschützt sind"],["B","Um „Secure Boot“ und ein Passwort auf BIOS-Ebene zu aktivieren, um Konfigurationsänderungen zu verhindern"],["C","Um sicherzustellen, dass die VPN-Verbindung durch Hardwaremodule verschlüsselt wird"],["D","Um alle Laptops so zu konfigurieren, dass das TPM als Verschlüsselungsfaktor für Festplatten verwendet wird"]],"answers":["A"],"explanation":"BitLocker To Go wurde speziell für die Verschlüsselung von Wechseldatenträgern (USB-Sticks, externe Festplatten) entwickelt. Durch die Schulung der Mitarbeiter in der Nutzung wird sichergestellt, dass für den Zugriff auf alle auf solchen Medien gespeicherten Daten ein Passwort (oder ein Wiederherstellungsschlüssel) erforderlich ist, wodurch sensible Informationen im Falle eines Verlusts oder Diebstahls des Geräts geschützt werden."},{"n":9,"simulation":false,"prompt":"Was wird verwendet, um den Zugang zu gesperrten Bereichen zu erkennen und zu protokollieren?","options":[["A","Poller"],["B","Videoüberwachung"],["C","Ausweislesegeräte"],["D","Zaun"]],"answers":["C"],"explanation":"Ausweisleser authentifizieren und protokollieren jeden Zutrittsversuch – sie erfassen, wer wann Zugang zu einem gesicherten Bereich erhalten hat (oder versucht hat, Zugang zu erhalten). Dieser Prüfpfad ist für die Überwachung und Überprüfung des Zugangs zu Sperrbereichen unerlässlich."},{"n":10,"simulation":false,"prompt":"Ein Administrator erhielt eine E-Mail mit der Mitteilung, dass für das von ihm derzeit betreute Betriebssystem keine Sicherheitsupdates und Patches mehr bereitgestellt werden. Welcher der folgenden Gründe ist am wahrscheinlichsten dafür, dass der Administrator diese Nachricht erhalten hat?","options":[["A","Der Support durch den Hersteller des Computers läuft aus."],["B","Das Betriebssystem gilt als „End of Life“."],["C","Die integrierte Sicherheitssoftware wird aus der nächsten Betriebssystemversion entfernt."],["D","In Kürze wird eine neue Version des Betriebssystems veröffentlicht."]],"answers":["B"],"explanation":"Wenn ein Betriebssystem das Ende seines Lebenszyklus (End of Life, EOL) erreicht, stellt der Anbieter die Veröffentlichung von Sicherheitsupdates und Patches ein. Administratoren werden darüber informiert, damit sie Upgrades oder Migrationen planen können, bevor der Support endet."},{"n":11,"simulation":false,"prompt":"Welche der folgenden Möglichkeiten eignet sich am besten, um benutzerdefinierte Images auf 800 Geräte zu verteilen, die vier Geräteherstellerklassen mit zwei Arten von Benutzergruppen umfassen?","options":[["A","Verwenden Sie „xcopy“, um die Festplatten von einem Gerät auf das andere zu klonen."],["B","Verwenden Sie „robocopy“, um die Dateien auf jedes Gerät zu übertragen."],["C","Verwenden Sie für jedes Gerät ein lokales Tool zur Image-Bereitstellung."],["D","Verwenden Sie ein netzwerkbasiertes Tool zur Remote-Installation."]],"answers":["D"],"explanation":"Ein netzwerkbasiertes Ferninstallations-Tool (wie z. B. Windows Deployment Services, MDT oder eine ähnliche Lösung) lässt sich effizient auf Hunderte von Geräten mit unterschiedlichen Hardware- und Benutzerkonfigurationen skalieren. Es ermöglicht Ihnen, Bereitstellungen nach Herstellerklassen und Benutzergruppen zu segmentieren, Imaging-Prozesse zu automatisieren und die Versionskontrolle zentral zu verwalten – weitaus effektiver als Methoden zum Eins-zu-Eins-Klonen oder zum Kopieren von Dateien."},{"n":12,"simulation":false,"prompt":"Welche der folgenden Arten von Social-Engineering-Angriffen versendet eine unaufgeforderte SMS an das Mobilgerät eines Benutzers?","options":[["A","Identitätsbetrug"],["B","Vishing"],["C","Spear-Phishing"],["D","Smishing"]],"answers":["D"],"explanation":"Smishing bezeichnet das Versenden betrügerischer Nachrichten per SMS oder über andere Textnachrichtenplattformen, um Nutzer dazu zu verleiten, sensible Informationen preiszugeben oder auf bösartige Links zu klicken. Dies unterscheidet es von Phishing per E-Mail (Spear-Phishing), per Telefonanruf (Vishing) oder durch persönliche Täuschung (Identitätsbetrug)."},{"n":13,"simulation":false,"prompt":"Ein Nutzer meldet einem Helpdesk-Mitarbeiter einige Single-Sign-On-Fehler. Derzeit kann sich der Nutzer zwar beim Anwendungsportal des Unternehmens anmelden, hat jedoch keinen Zugriff auf ein bestimmtes SaaS-basiertes Tool. Was würde der Techniker als nächsten Schritt am ehesten vorschlagen?","options":[["A","Das Mobilgerät des Nutzers erneut als MFA-Token registrieren."],["B","Verwenden Sie ein privates Browserfenster, um lokale Sitzungskonflikte zu vermeiden."],["C","Das Single Sign-On umgehen, indem man sich direkt bei der Anwendung authentifiziert."],["D","Das verwendete Gerät auf die Werkseinstellungen zurücksetzen."]],"answers":["B"],"explanation":"Single-Sign-On-Probleme, die nur eine bestimmte Anwendung betreffen, sind häufig auf veraltete oder widersprüchliche Sitzungsdaten im Browser des Benutzers zurückzuführen. Das Öffnen eines privaten (Inkognito-)Fensters gewährleistet eine neue Sitzung ohne zwischengespeicherte Cookies oder Tokens, wodurch der Zugriff auf das SaaS-Tool wiederhergestellt werden kann, ohne andere Konfigurationen zu beeinträchtigen."},{"n":14,"simulation":false,"prompt":"Ein Techniker stellt fest, dass auf einigen Computern in einem kleinen Büro ein Malware-Vorfall aufgetreten ist. Was sollte der Techniker als Nächstes tun?","options":[["A","Die infizierten Systeme unter Quarantäne stellen."],["B","Die Endbenutzer aufklären."],["C","Die Systemwiederherstellung deaktivieren."],["D","Die Anti-Malware-Software aktualisieren und die Computer scannen."]],"answers":["A"],"explanation":"Sobald ein Vorfall bestätigt ist, hat die Eindämmung oberste Priorität. Durch die Isolierung (Quarantäne) der infizierten Rechner wird verhindert, dass sich die Malware auf andere Systeme ausbreitet oder Daten abfließen, was eine sichere Analyse und Behebung ermöglicht."},{"n":15,"simulation":false,"prompt":"Welcher der folgenden Linux-Befehle wird für administrative Zwecke verwendet?","options":[["A","runas"],["B","cmcl"],["C","net user"],["D","su"]],"answers":["D"],"explanation":"Der Befehl „su“ (substitute user) ist ein Standard-Dienstprogramm unter Linux, mit dem ein Administrator die Identität eines anderen Benutzers annehmen kann – meist wird damit zum Root-Konto gewechselt, um erweiterte Berechtigungen zu erhalten. Es ist ein unverzichtbares Werkzeug für administrative Aufgaben auf Unix- und Linux-Systemen."},{"n":16,"simulation":false,"prompt":"Ein Benutzer hat kürzlich eine Anwendung installiert, die auf eine Datenbank auf einem lokalen Server zugreift. Beim Starten der Anwendung werden keine Informationen angezeigt. Welches der folgenden Befehlszeilentools eignet sich am besten zur Fehlerbehebung?","options":[["A","ipconfig"],["B","nslookup"],["C","netstat"],["D","curl"]],"answers":["C"],"explanation":"netstat zeigt aktive Netzwerkverbindungen und Listening-Ports auf dem lokalen Rechner an. Mit diesem Tool können Sie überprüfen, ob die Anwendung erfolgreich eine Verbindung zum Port des Datenbankservers hergestellt hat (oder dies versucht hat), die Adresse und den Port des Remote-Servers verifizieren sowie fehlgeschlagene oder hängende TCP-Sitzungen erkennen, die den Datenabruf verhindern würden."},{"n":17,"simulation":false,"prompt":"Ein kleines Büro meldete einen Phishing-Angriff, der zu einer Malware-Infektion führte. Ein Techniker untersucht den Vorfall und hat Folgendes festgestellt: Alle Endgeräte sind auf dem neuesten Stand und verfügen über die aktuellsten EDR-Signaturen. Die Protokolle bestätigen, dass die Malware auf einem System von EDR unter Quarantäne gestellt wurde. Der potenziell infizierte Rechner wurde neu aufgesetzt. Welche der folgenden Maßnahmen sollte der Techniker als Nächstes ergreifen?","options":[["A","Netzwerksicherheitstools installieren, um das Herunterladen infizierter Dateien aus dem Internet zu verhindern."],["B","Die Ursache des Problems besprechen und den Endbenutzer über Sicherheitshygiene aufklären."],["C","Die Firmware des Routers aktualisieren, um die Integrität des Netzwerkverkehrs sicherzustellen."],["D","Alternative Präventivmaßnahmen vorschlagen, die fortschrittlichere Sicherheitssoftware beinhalten würden."]],"answers":["B"],"explanation":"Nachdem die technischen Kontrollmaßnahmen aktualisiert, die EDR-Signaturen auf den neuesten Stand gebracht und das infizierte System neu aufgesetzt wurden, besteht der nächste Schritt darin, den menschlichen Faktor anzugehen. Indem der Benutzer darin geschult wird, Phishing-Versuche zu erkennen und sichere Vorgehensweisen zu befolgen, lässt sich eine Wiederholung verhindern und die allgemeine Sicherheitslage des Unternehmens stärken."},{"n":18,"simulation":false,"prompt":"Welche der folgenden Aussagen beschreibt eine Sicherheitslücke, die ausgenutzt wurde, bevor ein Patch oder eine Abhilfe verfügbar war?","options":[["A","Spoofing"],["B","Brute-Force"],["C","DoS"],["D","Zero-Day"]],"answers":["D"],"explanation":"Eine Zero-Day-Sicherheitslücke bezeichnet eine Sicherheitslücke, die von Angreifern aktiv ausgenutzt wird, bevor der Softwarehersteller einen Patch oder eine Abhilfe veröffentlicht hat – was bedeutet, dass die Verteidiger „null Tage“ Zeit haben, sich vorzubereiten, sobald der Exploit bekannt wird."},{"n":20,"simulation":false,"prompt":"Ein Helpdesk-Techniker richtet die Spracherkennung auf einem Windows-System ein. Welche der folgenden Einstellungen sollte der Techniker verwenden?","options":[["A","Zeit und Sprache"],["B","Personalisierung"],["C","System"],["D","Barrierefreiheit"]],"answers":["D"],"explanation":"Windows fasst die Spracherkennung und andere Barrierefreiheitsfunktionen unter den Einstellungen für die Barrierefreiheit zusammen. Dort können Sie die Sprachoptionen konfigurieren – einschließlich der Aktivierung der Windows-Spracherkennung und der Anpassung ihrer Einstellungen –, damit Benutzer, die auf Spracheingabe angewiesen sind, das System effektiv bedienen können."},{"n":21,"simulation":false,"prompt":"Ein Benutzer erhält einen neuen PC, kann jedoch eine Anwendung nicht ausführen. Es wird eine Fehlermeldung angezeigt, dass .NET Framework 3.5 erforderlich ist und nicht gefunden wurde. Welche der folgenden Maßnahmen ist der beste Weg, um dieses Problem zu beheben?","options":[["A","Beheben Sie die Abhängigkeit über das Menü „Windows-Funktionen aktivieren oder deaktivieren“."],["B","Laden Sie die Abhängigkeit über ein Repository eines Drittanbieters herunter."],["C","Die Abhängigkeit ignorieren und stattdessen die neueste Version 4 installieren."],["D","Leiten Sie das Trouble-Ticket an das SOC-Team weiter, da das Problem ein großes Sicherheitsrisiko darstellt."]],"answers":["A"],"explanation":"Windows enthält das .NET Framework 3.5 als optionale Funktion. Wenn Sie es über die Systemsteuerung „Programme und Funktionen“ unter „Windows-Funktionen aktivieren oder deaktivieren“ stellt sicher, dass das Betriebssystem die richtige Version direkt von Microsoft installiert, ohne auf nicht vertrauenswürdige Quellen zurückzugreifen oder erforderliche Abhängigkeiten zu überspringen."},{"n":22,"simulation":false,"prompt":"Ein Mitarbeiter verwendet ein Bildbearbeitungsprogramm. Bestimmte Funktionen sind deaktiviert und erfordern eine Anmeldung, über die der Mitarbeiter nicht verfügt. Welche der folgenden Möglichkeiten bietet eine Lösung für dieses Problem?","options":[["A","Lizenzzuweisung"],["B","VPN-Verbindung"],["C","Anwendungsreparatur"],["D","Neuinstallation des Programms"]],"answers":["A"],"explanation":"Wenn Funktionen in einer Anwendung bis zur Anmeldung deaktiviert sind, deutet dies in der Regel darauf hin, dass diese Funktionen durch das Lizenzsystem der Software gesteuert werden. Durch die Zuweisung (oder Aktivierung) der entsprechenden Lizenz erhält der Benutzer Zugriff auf diese Premium-Funktionen, wodurch die volle Funktionalität ohne unnötige Reparatur- oder Neuinstallationsschritte wiederhergestellt wird."},{"n":23,"simulation":false,"prompt":"Ein Techniker stellt mobile Geräte bereit und muss den Zugriff auf sensible Daten verhindern, falls die Geräte verloren gehen. Welche der folgenden Maßnahmen ist die beste Möglichkeit, unbefugten Zugriff zu verhindern, wenn der Benutzer nicht bemerkt, dass das Smartphone verloren gegangen ist?","options":[["A","Verschlüsselung"],["B","Fernlöschung"],["C","Geofencing"],["D","Gesichtserkennung"]],"answers":["A"],"explanation":"Die vollständige Festplatten- (oder Geräte-)Verschlüsselung stellt sicher, dass selbst bei physischem Zugriff einer unbefugten Person auf ein verlorenes Mobilgerät die darauf gespeicherten Daten ohne die richtigen Entschlüsselungsdaten unzugänglich bleiben. Dieser Schutz erfolgt automatisch und kontinuierlich und schützt ruhende Daten unabhängig davon, ob der Benutzer den Verlust des Geräts bemerkt hat oder nicht. Durch die Fernlöschung können Daten entfernt werden, wenn sie ausgelöst wird, allerdings muss das Gerät dafür online sein und der Benutzer (oder Administrator) muss die Löschung initiieren – während die Verschlüsselung stets aktiv ist."},{"n":24,"simulation":false,"prompt":"Welcher der folgenden Wege ist der schnellste, um von Windows 10 auf Windows 11 umzusteigen, ohne Daten zu verlieren?","options":[["A","Verwendung von „gpupdate“"],["B","Image-Bereitstellung"],["C","Neuinstallation"],["D","In-Place-Upgrade"]],"answers":["D"],"explanation":"Bei einem In-Place-Upgrade wird Windows 11 direkt über die vorhandene Windows 10-Installation installiert, wobei Benutzerdateien, Anwendungen und Einstellungen erhalten bleiben. Dies ist wesentlich schneller als das Erstellen und erneute Bereitstellen eines Images und vermeidet das Risiko eines Datenverlusts, das bei einer Neuinstallation besteht."},{"n":25,"simulation":false,"prompt":"Techniker versäumen es, die Kontaktdaten der Benutzer, die Geräte-ID-Nummern und eine klare Beschreibung jedes Problems im Ticket-System zu dokumentieren. Welche der folgenden Maßnahmen sollte ein Helpdesk-Management-Team einführen, damit die Techniker sie bei jedem Einsatz anwenden?","options":[["A","Service-Level-Vereinbarungen"],["B","Anrufkategorien"],["C","Standardarbeitsanweisungen"],["D","Artikel aus der Wissensdatenbank"]],"answers":["C"],"explanation":"Standardarbeitsanweisungen (SOPs) definieren einheitliche, schrittweise Richtlinien, die Techniker befolgen müssen – beispielsweise die Erfassung von Kontaktdaten des Benutzers, Anlagenkennungen und detaillierten Problembeschreibungen bei jedem Ticket. Die Umsetzung von SOPs gewährleistet eine gründliche und einheitliche Dokumentation bei allen Serviceanfragen."},{"n":26,"simulation":false,"prompt":"Die Leistung einer Anwendung verschlechtert sich mit der Zeit. Die Anwendung wird langsamer, gibt jedoch niemals eine Fehlermeldung aus und stürzt nicht ab. Welches der folgenden Tools sollte ein Techniker zur Fehlerbehebung verwenden?","options":[["A","Verlauf der Zuverlässigkeit"],["B","Computerverwaltung"],["C","Ressourcenmonitor"],["D","Festplattendefragmentierung"]],"answers":["C"],"explanation":"Der Ressourcenmonitor bietet Echtzeit-Einblicke in die CPU-, Speicher-, Festplatten- und Netzwerkauslastung nach Prozessen. Indem ein Techniker beobachtet, welche Ressourcen im Laufe der Zeit stetig ansteigen oder zu Engpässen werden, kann er Speicherlecks, E/A-Konflikte oder andere Leistungsprobleme, die die Verlangsamung verursachen, genau lokalisieren."},{"n":27,"simulation":false,"prompt":"Welchen der folgenden Dateisystemtypen verwendet das Linux-Betriebssystem?","options":[["A","exFAT"],["B","APFS"],["C","ext4"],["D","NTFS"]],"answers":["C"],"explanation":"ext4 (Fourth Extended Filesystem) ist das Standard-Dateisystem der meisten Linux-Distributionen. Im Vergleich zu seinen Vorgängern (ext2/ext3) bietet es eine verbesserte Leistung, Zuverlässigkeit und Unterstützung für große Volumes und Dateien."},{"n":28,"simulation":false,"prompt":"Welche der folgenden Methoden würde die Daten unwiederherstellbar machen, aber eine Weiterverwendung des Laufwerks ermöglichen?","options":[["A","Löschen der Partitionen"],["B","Implementierung von EFS"],["C","Durchführen einer Low-Level-Formatierung"],["D","Entmagnetisierung des Geräts"]],"answers":["C"],"explanation":"Eine Low-Level-Formatierung (genauer gesagt eine sichere Löschung, bei der alle Sektoren mit Nullen oder Zufallsdaten überschrieben werden) löscht effektiv alle Daten auf dem Laufwerk, sodass frühere Inhalte nicht mehr wiederherstellbar sind, während die Struktur des Laufwerks für die Wiederverwendung intakt bleibt. Im Gegensatz zur Entmagnetisierung – die das magnetische Medium des Laufwerks zerstört und es unbrauchbar macht – ermöglicht das Überschreiben eine sichere Wiederverwendung des Laufwerks."},{"n":29,"simulation":false,"prompt":"Nach einem kürzlich durchgeführten Upgrade des mobilen Betriebssystems auf einem Smartphone versucht ein Nutzer, auf seine geschäftlichen E-Mails zuzugreifen, doch die Anwendung lässt sich nicht öffnen. Ein Techniker startet das Smartphone neu, doch das Problem besteht weiterhin. Welche der folgenden Maßnahmen ist die wahrscheinlichste Lösung für das Problem?","options":[["A","Aktualisierung der fehlerhaften Software"],["B","Registrierung des Smartphones bei einer MDM-Lösung"],["C","Installation eines Clients eines Drittanbieters"],["D","Löschen der Cache-Partition"]],"answers":["A"],"explanation":"Nach einem größeren Betriebssystem-Upgrade müssen vorhandene Anwendungen häufig aktualisiert werden, um die Kompatibilität mit neuen APIs und Systembibliotheken zu gewährleisten. Durch die Aktualisierung der Unternehmens-E-Mail-App auf die neueste Version wird sichergestellt, dass sie für das aktualisierte Betriebssystem ausgelegt ist und ordnungsgemäß gestartet werden kann."},{"n":30,"simulation":false,"prompt":"Benutzer melden, dass ein ungesichertes Netzwerk mit demselben Namen wie das normale WLAN-Netzwerk sendet. Sie können zwar auf das Internet zugreifen, aber keine Verbindung zu den Dateifreigabeservern herstellen. Welche der folgenden Aussagen beschreibt dieses Problem am besten?","options":[["A","Nicht erreichbarer DNS-Server"],["B","Fehlerhafte Konfiguration des virtuellen lokalen Netzwerks"],["C","Falsche IP-Adresse"],["D","Unbefugter WLAN-Zugangspunkt"]],"answers":["D"],"explanation":"Ein nicht autorisierter Access Point ahmt die legitime SSID nach, sodass sich Clients verbinden können (oft mit Internetzugang über den eigenen Uplink), sie jedoch von internen Ressourcen wie Dateifreigaben isoliert sind. Dieses Verhalten passt zu den Symptomen – Benutzer verbinden sich mit dem scheinbar unternehmensinternen WLAN, können jedoch keine internen Server erreichen."},{"n":31,"simulation":false,"prompt":"Ein Computertechniker implementiert eine Lösung zur Unterstützung einer neuen Richtlinie für das Surfen im Internet im Unternehmen eines Kunden. Die Richtlinie verbietet Benutzern den Zugriff auf nicht autorisierte Websites auf der Grundlage einer Kategorisierung. Was sollte der Techniker auf dem SOHO-Router konfigurieren?","options":[["A","Sicheren Verwaltungszugriff"],["B","Gruppenrichtlinien-Editor"],["C","Inhaltsfilterung"],["D","Firewall"]],"answers":["C"],"explanation":"Mit der Inhaltsfilterung auf einem SOHO-Router können Sie Websites je nach Kategorie (z. B. soziale Medien, Glücksspiel, Nachrichten) blockieren oder zulassen. Indem festgelegt wird, welche Kategorien nicht zugelassen sind, setzt der Router die Browserrichtlinie am Netzwerkrand durch und verhindert so, dass Benutzer auf unzulässige Websites zugreifen können."},{"n":32,"simulation":false,"prompt":"In letzter Zeit hat die Zahl der Nutzer zugenommen, die ihre Smartphone-Passwörter weitergeben. Das Managementteam möchte, dass ein Techniker eine sicherere Methode zur Bildschirmsperre einrichtet. Welche der folgenden Technologien sollte der Techniker verwenden?","options":[["A","Mustersperre"],["B","Gesichtserkennung"],["C","Geräteverschlüsselung"],["D","Mehrfaktorauthentifizierung"]],"answers":["B"],"explanation":"Die Gesichtserkennung nutzt biometrische Merkmale, die für jeden Nutzer einzigartig sind, und bietet somit eine höhere Sicherheit als gemeinsam genutzte Passwörter oder leicht zu erratende Muster-Sperren. Sie stellt sicher, dass nur die registrierte Person das Gerät entsperren kann, wodurch das Risiko eines unbefugten Zugriffs durch gemeinsam genutzte Codes verringert wird."},{"n":33,"simulation":false,"prompt":"Der Laptop eines Endnutzers hat im Büro Probleme mit der Verbindung zum Netzlaufwerk. Der Endnutzer reicht ein Helpdesk-Ticket ein, und ein Support-Techniker kann eine Fernverbindung herstellen und das Problem beheben. Am nächsten Tag ist das Netzlaufwerk jedoch erneut getrennt. Was sollte der Techniker als Nächstes tun?","options":[["A","Eine Fernverbindung zum Computer des Benutzers herstellen, um zu prüfen, ob das Netzlaufwerk noch verbunden ist."],["B","Eine Anleitung zur Behebung des Problems senden, falls es erneut auftritt."],["C","Das Ticket an die nächste Ebene eskalieren."],["D","Das Ticket bis zum nächsten Tag offen lassen und dann schließen."]],"answers":["C"],"explanation":"Da die Behebung nicht von Dauer war und das Problem erneut auftrat, deutet dies darauf hin, dass möglicherweise ein zugrunde liegendes Konfigurations- oder Richtlinienproblem vorliegt, das eine gründlichere Fehlerbehebung erfordert, als sie ein Frontline-Techniker leisten kann. Die Eskalation an die nächste SupportEbene stellt sicher, dass die Grundursache identifiziert und eine dauerhaftere Lösung implementiert wird, anstatt wiederholt eine vorübergehende Abhilfe zu schaffen."},{"n":34,"simulation":false,"prompt":"Welche der folgenden Optionen informiert Mitarbeiter beispielsweise über zulässige Aktivitäten bei der Nutzung der Ressourcen des Unternehmens?","options":[["A","AUP"],["B","MNDA"],["C","DRM"],["D","EULA"]],"answers":["A"],"explanation":"Eine Richtlinie zur zulässigen Nutzung legt fest, welche Aktivitäten Mitarbeitern bei der Nutzung der ITRessourcen des Unternehmens gestattet oder untersagt sind. Sie bietet klare Leitlinien für zulässiges Verhalten und stellt sicher, dass die Nutzer die Regeln für Unternehmenssysteme und -daten verstehen."},{"n":35,"simulation":false,"prompt":"Ein Techniker muss auf einer großen Anzahl von Arbeitsplätzen ein Betriebssystem installieren. Welche der folgenden Methoden ist die schnellste?","options":[["A","Physische Datenträger"],["B","Einbindbare ISO-Datei"],["C","Manuelle Installation"],["D","Image-Bereitstellung"]],"answers":["D"],"explanation":"Die Image-Bereitstellung ermöglicht es Ihnen, ein standardisiertes Betriebssystem-Image mit vorkonfigurierten Einstellungen und Anwendungen zu erstellen und dieses anschließend über das Netzwerk oder per Multicast gleichzeitig auf mehrere Workstations zu übertragen. Dies ist wesentlich schneller als die Verwendung physischer Datenträger, manuelle Installationen oder das nacheinander Einbinden von ISODateien."},{"n":36,"simulation":false,"prompt":"Ein Benutzer arbeitet von zu Hause aus und kann nicht auf Arbeitsdateien auf einem Firmenlaptop zugreifen. Welche der folgenden Einstellungen sollte ein Techniker vornehmen, um das Problem mit dem Netzwerkzugriff zu beheben?","options":[["A","Weitverkehrsnetz"],["B","Drahtloses Netzwerk"],["C","Proxy-Netzwerkeinstellungen"],["D","Virtuelles privates Netzwerk"]],"answers":["D"],"explanation":"Ein VPN erstellt einen sicheren Tunnel vom Heimnetzwerk des Benutzers zum Unternehmensnetzwerk und stellt die erforderlichen Routing- und Zugriffskontrollen bereit, damit der Laptop auf interne Dateiserver zugreifen kann. Ohne ein VPN bleibt das Gerät außerhalb des Unternehmens-LANs und kann nicht direkt auf geschützte Ressourcen zugreifen."},{"n":37,"simulation":false,"prompt":"Ein Techniker beugt ein Problem, bei dem ein Dienst kurzzeitig läuft und an bestimmten Stellen im Prozess stoppt. Der Techniker muss die Ursache dieses Problems ermitteln. Welches der folgenden Tools sollte der Techniker verwenden?","options":[["A","Ereignisanzeige"],["B","Task-Manager"],["C","Internetoptionen"],["D","Prozess-Explorer"]],"answers":["A"],"explanation":"Die Ereignisanzeige protokolliert System-, Anwendungs- und Dienstereignisse, einschließlich Fehlern und Warnungen, wenn ein Dienst unerwartet beendet wird. Die Überprüfung dieser Protokolle liefert detaillierte Fehlercodes und Meldungen, die dabei helfen, die Ursache der Dienstunterbrechungen zu ermitteln."},{"n":38,"simulation":false,"prompt":"Welches der folgenden Beispiele zeigt, dass ein Anwendungsanbieter nicht offengelegte zusätzliche Software in ein Installationspaket aufgenommen hat?","options":[["A","Virus"],["B","Ransomware"],["C","Potenziell unerwünschtes Programm"],["D","Trojaner"]],"answers":["C"],"explanation":"Ein potenziell unerwünschtes Programm (PUP) bezeichnet Software, die mit einem Installationsprogramm gebündelt ist, die der Benutzer nicht ausdrücklich angefordert hat und die oft ohne klare Angabe von Informationen beworben oder installiert wird. Auch wenn PUPs nicht immer bösartig sind, können sie die Leistung beeinträchtigen oder unerwünschtes Verhalten hervorrufen, was der Beschreibung von nicht offengelegter zusätzlicher Software in einem Paket entspricht."},{"n":39,"simulation":false,"prompt":"Ein Techniker muss ein freigegebenes Laufwerk über eine Befehlszeilenschnittstelle zuordnen. Welchen der folgenden Befehle sollte der Techniker verwenden?","options":[["A","pathping"],["B","nslookup"],["C","net use"],["D","tracert"]],"answers":["C"],"explanation":"Der Windows-Befehl „net use“ dient zum Herstellen, Entfernen und Konfigurieren von Verbindungen zu freigegebenen Netzwerkressourcen. Um ein freigegebenes Laufwerk über die Befehlszeile zuzuordnen, würden Sie einen Befehl wie den folgenden ausführen: net use Z: \\\\Servername\\Freigabename Dadurch wird der freigegebene Ordner dem Laufwerksbuchstaben Z: zugewiesen."},{"n":40,"simulation":false,"prompt":"Ein Helpdesk-Team wurde darauf aufmerksam gemacht, dass auf einem firmeneigenen Mobiltelefon eine unbekannte Anwendung zum Knacken von Passwörtern installiert ist. Welche der folgenden Maßnahmen sollte das Helpdesk-Team ergreifen, um weitere unbefugte Installationen zu verhindern?","options":[["A","Gruppenrichtlinien konfigurieren."],["B","PAM implementieren."],["C","Anti-Malware-Software installieren."],["D","MDM bereitstellen."]],"answers":["D"],"explanation":"Eine Mobile-Device-Management-Lösung (MDM) ermöglicht es Administratoren, Richtlinien zur AppInstallation durchzusetzen – indem zugelassene Anwendungen auf eine Whitelist gesetzt und alle anderen blockiert werden. Durch den Einsatz von MDM kann der Helpdesk zentral steuern, welche Apps Benutzer auf firmeneigenen Smartphones installieren dürfen, und so verhindern, dass in Zukunft nicht autorisierte Tools hinzugefügt werden."},{"n":41,"simulation":false,"prompt":"Was wird zusätzlich zu einem Passwort verwendet, um MFA zu implementieren?","options":[["A","Das Senden eines Codes an das Smartphone des Benutzers"],["B","Überprüfung des Geburtsdatums des Benutzers"],["C","Aufforderung an den Benutzer, eine einfache Rechenaufgabe zu lösen"],["D","Die Aufforderung an den Benutzer, eine PIN einzugeben"]],"answers":["A"],"explanation":"Die Multi-Faktor-Authentifizierung (MFA) kombiniert mindestens zwei der folgenden Faktoren: etwas, das Sie wissen (Passwort), etwas, das Sie besitzen (ein vom Smartphone generierter oder per SMS übermittelter Einmalcode), und etwas, das Sie sind (biometrische Merkmale). Das Versenden eines Codes an das Smartphone des Benutzers stellt zusätzlich zum Passwort einen „etwas, das Sie besitzen“-Faktor dar."},{"n":42,"simulation":false,"prompt":"Ein Techniker bereitet sich darauf vor, die Batterien in einem rackmontierten USV-System auszutauschen. Nachdem er sichergestellt hat, dass die Stromversorgung ausgeschaltet und die Batterien vollständig entladen sind, muss der Techniker die Batteriemodule von der Unterseite des Racks entfernen. Welchen der folgenden Schritte sollte der Techniker durchführen?","options":[["A","Sicherstellen, dass das Brandbekämpfungssystem betriebsbereit ist."],["B","Geeignete Hebetechniken und Richtlinien anwenden."],["C","Die ausgebauten Batterien in einen antistatischen Beutel legen."],["D","Eine Atemschutzmaske tragen, um schädliche Dämpfe herauszufiltern."]],"answers":["B"],"explanation":"USV-Batteriemodule sind schwer und unhandlich; die Anwendung korrekter Hebetechniken (z. B. Heben mit den Beinen, gerader Rücken sowie bei Bedarf Heben im Team oder Einsatz mechanischer Hilfsmittel) beugt Verletzungen des Bewegungsapparats vor und gewährleistet einen sicheren Ausbau."},{"n":43,"simulation":false,"prompt":"Ein Techniker richtet ein Überwachungssystem für einen Kunden ein. Der Kunde möchte über die IP-Adresse des Systems auf die Weboberfläche des Systems im LAN zugreifen. Welche der folgenden Maßnahmen sollte der Techniker ergreifen, um externe Anmeldeversuche aus dem Internet zu verhindern?","options":[["A","Port-Mapping"],["B","Subnetting"],["C","Statische IP-Adresse"],["D","Inhaltsfilterung"]],"answers":["A"],"explanation":"Durch die Verwendung von Port-Mapping-Regeln (NAT) auf dem Router können Sie festlegen, dass die HTTP-/HTTPSPorts des Überwachungssystems des Überwachungssystems nur auf der LAN-Schnittstelle weiterleiten und sie auf der WAN-Seite geschlossen lassen. Dadurch wird sichergestellt, dass Benutzer im lokalen Subnetz über die IP-Adresse auf die Kameraoberfläche zugreifen können, während externe Anmeldeversuche aus dem Internet blockiert werden."},{"n":44,"simulation":false,"prompt":"Ein Techniker muss Laptops so konfigurieren, dass nur Administratoren bei Bedarf die Virtualisierungstechnologie aktivieren können. Welche der folgenden Einstellungen sollte der Techniker vornehmen?","options":[["A","BIOS-Passwort"],["B","Gastkonto"],["C","Bildschirmsperre"],["D","AutoRun-Einstellung"]],"answers":["A"],"explanation":"Das Festlegen eines BIOS- (oder UEFI-)Administratorpassworts schränkt den Zugriff auf die FirmwareEinstellungen ein, einschließlich der Aktivierung oder Deaktivierung der Virtualisierungstechnologie. Nur Personen, die das Passwort kennen – vermutlich Administratoren – können das BIOS-Setup aufrufen und diese Änderung vornehmen."},{"n":45,"simulation":false,"prompt":"Welchen der folgenden Dateitypen würde ein Desktop-Support-Techniker am ehesten verwenden, um Aufgaben für die Anmeldung eines Windows-Benutzers zu automatisieren?","options":[["A",".bat"],["B",".sh"],["C",".py"],["D",".js"]],"answers":["A"],"explanation":"Batch-Dateien (.bat) sind klassische Windows-Skriptdateien, die eine Reihe von Befehlszeilenbefehlen ausführen ausführen. Sie können über Gruppenrichtlinien oder den Autostart-Ordner mit Benutzeranmeldeereignissen verknüpft werden, um Aufgaben (wie das Zuordnen von Laufwerken oder das Starten von Anwendungen) zu automatisieren, wenn sich ein Benutzer anmeldet."},{"n":46,"simulation":false,"prompt":"Ein Techniker nutzt KI, um einen Vorschlag zu den Vorteilen einer neuen Software zu entwerfen. Beim Lesen des Entwurfs stellt der Techniker fest, dass dieser sachlich falsche Informationen enthält. Welche der folgenden Aussagen beschreibt dieses Szenario am besten?","options":[["A","Datenschutz"],["B","Halluzinationen"],["C","Angemessene Nutzung"],["D","Plagiat"]],"answers":["B"],"explanation":"Wenn ein KI-Modell plausibel klingende, aber sachlich unrichtige oder erfundene Informationen generiert, spricht man von einer „Halluzination“. Das Erkennen und Korrigieren dieser Fehler ist unerlässlich, um die Genauigkeit und Zuverlässigkeit KI-gestützter Inhalte zu gewährleisten."},{"n":47,"simulation":false,"prompt":"Welche der folgenden Aussagen beschreibt einen Angriff, bei dem ein Angreifer einen gefälschten Zugangspunkt (AP) einrichtet, der Nutzer dazu verleitet, sich mit diesem gefälschten AP statt mit dem legitimen Netzwerk zu verbinden?","options":[["A","Stalkerware"],["B","Evil Twin"],["C","Tailgating"],["D","Shoulder-Surfing"]],"answers":["B"],"explanation":"Bei einem „Evil Twin“-Angriff richtet ein Angreifer einen gefälschten WLAN-Zugangspunkt mit derselben SSID und ähnlichen Einstellungen wie ein legitimes Netzwerk ein. Ahnungslose Nutzer verbinden sich mit diesem gefälschten Zugangspunkt, wodurch der Angreifer den Datenverkehr abfangen, Anmeldedaten erfassen und weitere Angriffe starten kann."},{"n":48,"simulation":false,"prompt":"Ein Benutzer hat beim Surfen auf Websites Probleme mit veralteten Darstellungen. Welche der folgenden Einstellungen sollte ein Techniker verwenden, um dieses Problem zu beheben?","options":[["A","Verwaltungstools"],["B","Windows Defender-Firewall"],["C","Internetoptionen"],["D","Barrierefreiheit"]],"answers":["C"],"explanation":"In den Internetoptionen (unter den Einstellungen für den Browserverlauf) können Sie festlegen, wie oft der Browser nach neueren Versionen gespeicherter Seiten und Inhalte sucht. Durch Anpassen der Einstellung „Nach neueren Versionen gespeicherter Seiten suchen“ wird der Browser dazu veranlasst, aktuelle Bilder abzurufen, anstatt zwischengespeicherte Kopien zu verwenden."},{"n":49,"simulation":false,"prompt":"Jedes Mal, wenn ein Benutzer eine bestimmte Tabellenkalkulation lädt, reagiert sein Computer vorübergehend nicht mehr. Der Benutzer bemerkt außerdem, dass in der Titelleiste angezeigt wird, dass die Anwendungen nicht reagieren. Was würde ein Techniker in diesem Fall am ehesten überprüfen?","options":[["A","Anti-Malware-Protokolle"],["B","Reparaturoptionen für den Arbeitsplatzrechner"],["C","Bandbreitenstatus, wie im Task-Manager angezeigt"],["D","Dateigröße und damit verbundene Speicherauslastung"]],"answers":["D"],"explanation":"Eine sehr große oder komplexe Tabellenkalkulation kann übermäßig viel RAM und CPU-Leistung beanspruchen, was dazu führt, dass die Anwendung hängen bleibt oder nicht mehr reagiert. Durch Überprüfen der Dateigröße und Beobachten, wie viel Arbeitsspeicher Excel (oder das Tabellenkalkulationsprogramm) beim Öffnen der Datei beansprucht, kann der Techniker feststellen, ob eine Ressourcenknappheit die Ursache ist, und Maßnahmen ergreifen – wie das Vereinfachen der Datei oder das Hinzufügen von RAM –, um das Problem zu beheben."},{"n":50,"simulation":false,"prompt":"Ein Benutzer verlegt seinen Windows-Laptop häufig und befürchtet, dass er gestohlen werden könnte. Der Benutzer wünscht sich zusätzliche Sicherheitsmaßnahmen für seinen Laptop. Welche der folgenden integrierten Technologien kann ein Techniker nutzen, um eine vollständige Festplattenverschlüsselung zu aktivieren?","options":[["A","Active Directory"],["B","New Technology File System"],["C","Encrypting File System"],["D","BitLocker"]],"answers":["D"],"explanation":"BitLocker ist eine integrierte Windows-Funktion, die eine vollständige Verschlüsselung des Systemlaufwerks ermöglicht und so alle Daten schützt, falls der Laptop verloren geht oder gestohlen wird. Die Funktion ist (sofern vorhanden) in das TPM integriert, um eine sichere Speicherung der Schlüssel zu gewährleisten, und kann ohne zusätzliche Software über Gruppenrichtlinien oder die Systemsteuerung konfiguriert werden."},{"n":51,"simulation":false,"prompt":"Welche der folgenden Optionen wird verwendet, um unternehmensinterne Einschränkungen auf einem Apple-Gerät anzuwenden?","options":[["A","App Store"],["B","VPN-Konfiguration"],["C","Apple-ID"],["D","Verwaltungsprofil"]],"answers":["D"],"explanation":"Ein MDM-Verwaltungsprofil (Mobile Device Management) ermöglicht es Administratoren, Unternehmensrichtlinien auf Apple-Geräten durchzusetzen, beispielsweise die Einschränkung von AppInstallationen, die Konfiguration von Netzwerkeinstellungen und die Anwendung von Sicherheitsbeschränkungen. Dieses Profil wird auf dem Gerät installiert und zentral verwaltet, um die Einhaltung der Richtlinien sicherzustellen."},{"n":52,"simulation":false,"prompt":"Das neue Smartphone eines Benutzers hält den ganzen Tag über nicht durch. Das Smartphone wird jede Nacht vollständig aufgeladen. Was sollte ein Techniker zur Fehlerbehebung als Erstes überprüfen?","options":[["A","Speicherauslastung"],["B","Ende des Software-Supports"],["C","Leistung des Ladegeräts"],["D","Hintergrundanwendungen"]],"answers":["D"],"explanation":"Hintergrund-Apps können den Akku erheblich belasten, indem sie den ganzen Tag über Prozesse ausführen, Daten synchronisieren oder Standortdienste nutzen. Das Überprüfen und Einschränken oder Deaktivieren unnötiger Hintergrund-Apps hilft dabei, übermäßigen Akkuverbrauch zu erkennen und zu verringern."},{"n":53,"simulation":false,"prompt":"Ein Kunde kann bestimmte Dateien auf seinem System nicht öffnen. Jedes Mal, wenn der Kunde versucht, eine Datei zu öffnen, erhält er die Meldung, dass die Datei verschlüsselt ist. Welche der folgenden Aussagen beschreibt dieses Problem am besten?","options":[["A","Keylogger"],["B","Ransomware"],["C","Phishing"],["D","Cryptominer"]],"answers":["B"],"explanation":"Ransomware ist eine Schadsoftware, die die Dateien eines Benutzers verschlüsselt und anschließend eine Zahlung (ein Lösegeld) als Gegenleistung für den Entschlüsselungscode fordert. Die Tatsache, dass der Benutzer die Dateien nicht öffnen kann, sowie die Meldung, dass sie verschlüsselt sind, sind klassische Anzeichen für einen Ransomware-Angriff."},{"n":54,"simulation":false,"prompt":"In einem Unternehmen treten vermehrt Probleme auf. Ein Techniker stellt fest, dass Anwendungen installiert sind, die standardmäßig nicht installiert werden. Benutzer melden eine erhöhte Anzahl von Systemabfragen bezüglich Softwarelizenzen. Welche der folgenden Maßnahmen würde das Sicherheitsteam höchstwahrscheinlich ergreifen, um die Ursache zu beheben?","options":[["A","Eine interne PKI bereitstellen, um verschlüsselten Webdatenverkehr zu filtern."],["B","Benutzer aus der lokalen Administratorengruppe entfernen."],["C","Strengere Kontrollen einführen, um verdächtige Websites zu blockieren."],["D","Strengere UAC-Einstellungen unter Windows aktivieren."]],"answers":["B"],"explanation":"Wenn Benutzer über lokale Administratorrechte verfügen, können sie nicht autorisierte Anwendungen installieren – was zu Lizenzabfragen, nicht unterstützter Software und potenziellen Sicherheitsrisiken führt. Durch das Entfernen von Benutzern aus der lokalen Administratorengruppe erfordern Installationen erweiterte Berechtigungen, wodurch sichergestellt wird, dass nur genehmigte Software installiert wird, und diese wiederkehrenden Probleme reduziert werden."},{"n":55,"simulation":false,"prompt":"Ein Support-Spezialist muss entscheiden, ob auf einem neuen Computer eine 32-Bit- oder eine 64-BitBetriebssystemarchitektur installiert werden soll. Welche der folgenden Spezifikationen hilft dem Spezialisten bei der Entscheidung, welche Betriebssystemarchitektur verwendet werden soll?","options":[["A","16 GB RAM"],["B","Intel i7-CPU"],["C","500 GB Festplatte"],["D","1 Gbit/s Ethernet"]],"answers":["B"],"explanation":"Die Architektur der CPU bestimmt, ob sie ein 64-Bit-Betriebssystem ausführen kann. Die meisten Intel i7Prozessoren sind 64-Bit-fähig, während die bloße Kenntnis der RAM-Kapazität (z. B. 16 GB) keine Garantie dafür ist, dass der Prozessor 64-Bit-Operationen unterstützt. Sobald Sie sich vergewissert haben, dass die CPU 64-Bit-fähig ist (wie bei einem Intel i7), können Sie ein 64-Bit-Betriebssystem installieren, um den verfügbaren Arbeitsspeicher voll auszunutzen."},{"n":56,"simulation":false,"prompt":"Was von Folgendem verhindert das gewaltsame Eindringen in ein Gebäude?","options":[["A","PIV-Karte"],["B","Bewegungsgesteuerte Beleuchtung"],["C","Videoüberwachung"],["D","Poller"]],"answers":["D"],"explanation":"Poller sind stabile, fest installierte Pfosten, die rund um Gebäude oder sensible Bereiche angebracht werden, um Fahrzeuge physisch abzublocken und Rammangriffe oder gewaltsames Eindringen mit Fahrzeugen zu verhindern. Im Gegensatz zu Überwachungskameras oder Beleuchtung stellen Poller eine direkte physische Barriere dar."},{"n":57,"simulation":false,"prompt":"Ein Techniker wird damit beauftragt, einen Benutzer aus dem System zu entfernen. Welche der folgenden Aufgaben stehen üblicherweise auf einer Checkliste für die Deaktivierung? (Wählen Sie zwei aus.)","options":[["A","Die Festplatte im Laptop des Benutzers unter Quarantäne stellen."],["B","Die Schlüsselanhänger des Benutzers für den Türzugang deaktivieren."],["C","Löschen aller personenbezogenen Daten, die mit dem Benutzer in Verbindung stehen."],["D","Das E-Mail-Konto des Benutzers sperren."],["E","Die Netzwerkanschlüsse unter dem Schreibtisch des Benutzers deaktivieren."],["F","Fügen Sie die MAC-Adresse des Computers des Benutzers einer Sperrliste hinzu."]],"answers":["B","D"],"explanation":"Deaktivieren Sie die Schlüsselanhänger des Benutzers für den Zugang zu den Türen Schlüsselanhänger (oder Ausweise) gewähren physischen Zugang zu Büros, Serverräumen oder Sicherheitsbereichen. Durch ihre Deaktivierung wird verhindert, dass der ehemalige Mitarbeiter nach Beendigung seines Arbeitsverhältnisses das Firmengelände betritt. Das E-Mail-Konto des Benutzers sperren E-Mails sind oft das Tor zu Unternehmensressourcen (Passwortzurücksetzungen, vertrauliche Kommunikation, Dateifreigabe). Durch die Sperrung des Kontos werden weitere Anmeldungen sofort unterbunden, der unbefugte Zugriff auf archivierte E-Mails verhindert und potenzieller Missbrauch blockiert."},{"n":58,"simulation":false,"prompt":"Ein Unternehmen möchte Baseline-Images auf neuen Computern bereitstellen, sobald diese im Netzwerk hochgefahren werden. Welchen der folgenden Startvorgänge sollte das Unternehmen für diese Aufgabe verwenden?","options":[["A","ISO"],["B","Sicher"],["C","USB"],["D","PXE"]],"answers":["D"],"explanation":"Die Preboot Execution Environment (PXE) ermöglicht es neuen Computern, über das Netzwerk zu booten, indem sie ein Boot-Image von einem PXE-Server abrufen. Auf diese Weise können Sie Baseline-Images automatisch bereitstellen, sobald die Rechner hochfahren und ihre netzwerkbasierten Boot-Anweisungen erhalten, ohne auf lokale Medien wie USB-Sticks oder ISOs zurückgreifen zu müssen."},{"n":59,"simulation":false,"prompt":"Ein Benutzer hat über mehrere Jahre hinweg Daten in dieselbe Tabellenkalkulation eingegeben. Nachdem er eine beträchtliche Datenmenge hinzugefügt hat, kann er die Datei nun nicht mehr öffnen. Welche der folgenden Maßnahmen sollte ein Techniker ergreifen, um das Problem zu beheben?","options":[["A","Die Tabellenkalkulation auf den letzten Wiederherstellungspunkt zurücksetzen."],["B","Die RAM-Kapazität erhöhen."],["C","Das Speicherlaufwerk defragmentieren."],["D","Die Geschwindigkeit der Netzwerkverbindung erhöhen."]],"answers":["B"],"explanation":"Da Tabellenkalkulationen immer umfangreicher und komplexer werden, benötigen sie mehr Arbeitsspeicher, um Daten zu laden und zu bearbeiten. Wenn die Datei so groß wird, dass der verfügbare Arbeitsspeicher nicht mehr ausreicht, kann die Anwendung die Datei möglicherweise nicht öffnen. Durch Hinzufügen von mehr Arbeitsspeicher erhält die Tabellenkalkulationssoftware die Ressourcen, die sie zum Laden und Bearbeiten des erweiterten Datensatzes benötigt."},{"n":60,"simulation":false,"prompt":"Ein Techniker installiert eine VPN-Client-Software, die einen Softwarefehler des Herstellers enthält. Nachdem der Hersteller ein Update für die Software veröffentlicht hat, versucht der Techniker, die Software neu zu installieren, erhält jedoch immer wieder die Fehlermeldung, dass der Netzwerkadapter für das VPN bereits vorhanden ist. Was sollte der Techniker als Nächstes tun, um dieses Problem zu beheben?","options":[["A","Die neuesten Sicherheitsupdates für das Betriebssystem installieren."],["B","Den Netzwerkadapter der neuen Software zuordnen."],["C","Die Firmware des Netzwerkadapters aktualisieren."],["D","Versteckte Netzwerkadapter löschen."]],"answers":["D"],"explanation":"Beim Deinstallieren und Neuinstallieren von netzwerkbasierter Software wie einem VPN-Client können verwaisten oder „Geister“-Adapter im System verbleiben, insbesondere wenn sie im Geräte-Manager nicht mehr sichtbar sind. Das Entfernen dieser versteckten Adapter ebnet den Weg für die aktualisierte ClientSoftware, ihre virtuelle Netzwerkschnittstelle ohne Konflikte neu zu erstellen."},{"n":61,"simulation":false,"prompt":"Welcher der folgenden Gründe ist der beste für ein Netzwerk-Engineering-Team, einem Helpdesk-Techniker IP-Adressierungsinformationen zur Verfügung zu stellen, die auf Arbeitsstationen verwendet werden sollen, die in einem sicheren Netzwerksegment bereitgestellt werden?","options":[["A","Nur bestimmte DNS-Server dürfen auf das Internet zugreifen."],["B","Die Netzwerk-Zulassungsliste ist auf eine bestimmte Adresse festgelegt."],["C","DHCP-Dienste sind für dieses Subnetz nicht aktiviert."],["D","NAC-Server erlauben nur die Installation von Sicherheitsupdates."]],"answers":["C"],"explanation":"Wenn ein Subnetz kein DHCP anbietet, können Arbeitsstationen die IP-Konfiguration nicht automatisch beziehen. Durch die Bereitstellung der korrekten statischen IP-Adresse, Subnetzmaske, des Gateways und des DNS an die Helpdesk-Techniker wird sichergestellt, dass die neu bereitgestellten Rechner im sicheren Netzwerksegment kommunizieren können, ohne auf DHCP angewiesen zu sein."},{"n":62,"simulation":false,"prompt":"Ein Techniker verwendet einen Anmeldedaten-Manager, um eine große Anzahl von Anmeldedaten zu schützen. Was ist für die Verwendung dieser Anwendung wichtig?","options":[["A","Eingeschränkte Anmeldezeiten"],["B","Sicheres Master-Passwort"],["C","TPM-Modul"],["D","Windows-Sperrbildschirm"]],"answers":["B"],"explanation":"Ein Anmeldedaten-Manager verschlüsselt und speichert mehrere Anmeldedaten hinter einem einzigen MasterPasswort. Es ist von entscheidender Bedeutung, dass dieses Master-Passwort sicher ist und geschützt aufbewahrt wird; wenn es kompromittiert wird, sind alle gespeicherten Anmeldedaten gefährdet."},{"n":63,"simulation":false,"prompt":"Bei welcher der folgenden Methoden wird die Zustimmung eines Benutzers über eine Push-Benachrichtigung eingeholt, um dessen Identität zu überprüfen?","options":[["A","Call"],["B","Authentifikator"],["C","Hardware-Token"],["D","SMS"]],"answers":["B"],"explanation":"Moderne Authentifizierungs-Apps (wie Microsoft Authenticator oder Google Authenticator mit Push-Funktion) können eine Push-Benachrichtigung an das registrierte Gerät des Benutzers senden. Der Benutzer genehmigt oder lehnt die Anmeldeanfrage über die Benachrichtigung ab, wodurch ein schneller und sicherer zweiter Authentifizierungsfaktor bereitgestellt wird."},{"n":64,"simulation":false,"prompt":"Ein Kunde möchte von zu Hause aus arbeiten können, möchte aber nicht dafür verantwortlich sein, Unternehmensgeräte hin und her zu transportieren. Welche der folgenden Möglichkeiten würde es dem Benutzer ermöglichen, per Fernzugriff auf einen WindowsPC in der Zentrale zuzugreifen und diesen zu nutzen? (Wählen Sie zwei aus.)","options":[["A","SPICE"],["B","SSH"],["C","RDP"],["D","VPN"],["E","RMM"],["F","WinRM"]],"answers":["C","D"],"explanation":"RDP (Remote Desktop Protocol): Ermöglicht es dem Benutzer, von zu Hause aus eine Verbindung zur Desktop-Umgebung des Windows-PCs herzustellen und diese zu steuern. VPN (Virtual Private Network): Stellt einen sicheren Tunnel zum Büronetzwerk her, damit das Heimgerät des Benutzers den Windows-PC erreichen kann, bevor die RDP-Sitzung gestartet wird."},{"n":65,"simulation":false,"prompt":"Ein Unternehmen möchte ein einziges Betriebssystem für seine Workstations und Server verwenden und Lizenzgebühren vermeiden. Welches der folgenden Betriebssysteme würde das Unternehmen am ehesten wählen?","options":[["A","Linux"],["B","Windows"],["C","macOS"],["D","Chrome OS"]],"answers":["A"],"explanation":"Linux-Distributionen sind Open-Source und in der Regel lizenzgebührenfrei, wodurch sie sich sowohl für Desktop-Arbeitsplätze als auch für Server eignen. Unternehmen können auf allen ihren Systemen dasselbe Linux-Betriebssystem einsetzen, ohne dass dabei Kosten pro Arbeitsplatz oder pro Server anfallen – im Gegensatz zu proprietären Systemen wie Windows oder macOS."},{"n":66,"simulation":false,"prompt":"Ein Benutzer versucht, auf einem Mobiltelefon ein HD-Video zu öffnen, das auf einer beliebten MedienStreaming-Website gehostet wird. Der Benutzer erhält Fehlermeldungen wegen abgelaufener Verbindungszeit. Im Bereich des Mobilfunkempfangssymbols werden zwei Balken neben „3G“ angezeigt. Welche der folgenden Ursachen ist am wahrscheinlichsten für das Problem?","options":[["A","Der Nutzer hat WLAN nicht aktiviert."],["B","Das Abonnement für die Website ist abgelaufen."],["C","Die Bandbreite ist nicht hoch genug."],["D","Der Speicher des Mobilgeräts ist voll."]],"answers":["C"],"explanation":"Das Streamen von HD-Videos erfordert eine beträchtliche Netzwerkbandbreite, in der Regel mehrere Mbit/s. Bei einer 3G-Verbindung mit nur zwei Signalbalken ist die verfügbare Bandbreite wahrscheinlich zu begrenzt oder zu unbeständig, um einen HD-Stream aufrechtzuerhalten, was zu Zeitüberschreitungen führt."},{"n":67,"simulation":false,"prompt":"Ein Techniker stellt fest, dass die wöchentliche Sicherung zu lange dauert. Die täglichen Sicherungen sind inkrementell. Welche der folgenden Maßnahmen würde das Problem am ehesten beheben?","options":[["A","Änderung des Sicherungsfensters"],["B","Durchführung inkrementeller wöchentlicher Backups"],["C","Erweiterung des Backup-Speichers"],["D","Durchführung synthetischer wöchentlicher Vollsicherungen"]],"answers":["D"],"explanation":"Synthetische Vollsicherungen konsolidieren die letzte Vollsicherung und die nachfolgenden inkrementellen Sicherungen zu einer neuen Vollsicherung auf dem Sicherungsspeicher, ohne dabei wiederholt alle Daten aus den Produktionssystemen auszulesen. Dieser Ansatz reduziert die zeitliche Belastung des Netzwerks und der Quellsysteme während des wöchentlichen Sicherungsfensters erheblich und stellt dennoch einen vollständigen Sicherungssatz für die Wiederherstellung bereitstellt."},{"n":68,"simulation":false,"prompt":"Ein Helpdesk-Techniker muss RAM aus ausgemusterten Workstations entfernen und andere Workstations, auf denen Anwendungen laufen, die mehr Arbeitsspeicher benötigen, mit diesem RAM aufrüsten. Welche der folgenden Maßnahmen würde der Techniker höchstwahrscheinlich ergreifen?","options":[["A","Den Arbeitsspeicher aus Sicherheitsgründen entmagnetisieren."],["B","Verwenden Sie antistatische Beutel für Lagerung und Transport."],["C","Das Netzteil anschließen, um jede Workstation zu erden."],["D","Den Arbeitsspeicher in identischen Paaren einbauen."]],"answers":["B"],"explanation":"Beim Umgang mit und beim Transport von RAM-Modulen ist es unerlässlich, diese vor elektrostatischer Entladung (ESD) zu schützen. Die Aufbewahrung der ausgebauten RAM-Module in antistatischen Beuteln verhindert Schäden während des Transports oder während der Lagerung, bevor sie in andere Arbeitsstationen eingebaut werden."},{"n":69,"simulation":false,"prompt":"Der Computer eines Kunden hat keine aktive Verbindung zum Netzwerk. Ein Techniker führt einige Schritte zur Fehlerbehebung durch, kann das Problem jedoch nicht beheben. Der Techniker hat alle ihm zur Verfügung stehenden Möglichkeiten ausgeschöpft. Der Kunde äußert sich frustriert über die Zeit, die zur Behebung dieses Problems benötigt wird. Was sollte der Techniker tun?","options":[["A","Das Problem an einen erfahrenen Kollegen weiterleiten und dem Kunden die nächsten Schritte erläutern."],["B","Den Kunden abweisen und einen neuen Termin für die Fehlerbehebung zu einem späteren Zeitpunkt vereinbaren."],["C","Den Kunden unterbrechen und darauf hinweisen, dass Support-Tickets zur Fehlerbehebung einige Zeit in Anspruch nehmen können."],["D","Eine positive Haltung bewahren und weiterhin Fragen zum Umfang des Problems stellen."]],"answers":["A"],"explanation":"Wenn Sie Ihr Fachwissen zur Fehlerbehebung ausgeschöpft haben und der Kunde frustriert ist, besteht der richtige nächste Schritt darin, das Ticket an einen erfahreneren Techniker oder ein spezialisiertes Team weiterzuleiten. Kommunizieren Sie dem Kunden gleichzeitig klar und deutlich, was Sie tun und was er als Nächstes erwarten kann. Dies sorgt für Transparenz, hilft bei der Steuerung der Erwartungen und stellt sicher, dass das Problem so schnell wie möglich gelöst wird."},{"n":70,"simulation":false,"prompt":"Ein leitender Angestellter eines Unternehmens besucht derzeit ein großes Musikfestival mit zahlreichen Besuchern und hat Probleme, auf sein geschäftliches E-Mail-Konto zuzugreifen. Die E-Mail-Anwendung lädt keine E-Mails herunter und scheint bei Verbindungsversuchen ins Stocken zu geraten. Was ist die wahrscheinlichste Ursache für die Störung?","options":[["A","Auf dem Smartphone ist kein Speicherplatz mehr verfügbar."],["B","Die Firewalls des Unternehmens sind so konfiguriert, dass sie den Fernzugriff auf E-Mail-Ressourcen blockieren."],["C","Zu viele Geräte im selben Bereich versuchen, eine Verbindung zum Mobilfunknetz herzustellen."],["D","Der Veranstalter des Festivals verbietet die Internetnutzung während der Veranstaltung und hat das Internetsignal blockiert."]],"answers":["C"],"explanation":"Große Menschenansammlungen wie Musikfestivals überlasten oft die lokalen Mobilfunkmasten aufgrund der schieren Anzahl der Geräte, die um Bandbreite und Signal konkurrieren, die lokalen Mobilfunkmasten oft überlasten. Diese Überlastung kann dazu führen, dass mobile Anwendungen, wie z. B. E-Mail-Clients, beim Versuch, Nachrichten herunterzuladen, ins Stocken geraten oder ausfallen."},{"n":71,"simulation":false,"prompt":"Ein Unternehmen hat kürzlich auf eine cloudbasierte Office-Suite umgestellt und möchte die Umgebung vor externen Angreifern schützen. Welche der folgenden Methoden ist am effektivsten?","options":[["A","Mehrfaktorauthentifizierung"],["B","Verschlüsselung"],["C","Backups"],["D","Starke Passwörter"]],"answers":["A"],"explanation":"Zwar sind sichere Passwörter und Verschlüsselung wichtig, doch bietet die Multi-Faktor-Authentifizierung (MFA) den wirksamsten Schutz vor externen Angreifern, die es auf cloudbasierte Dienste abgesehen haben. Durch die Anforderung eines zweiten Verifizierungsschritts, wie beispielsweise einer Push-Benachrichtigung, eines Einmalcodes oder eines Hardware-Tokens, stellt die MFA sicher, dass Angreifer selbst bei Kompromittierung der Anmeldedaten ohne diesen zusätzlichen Faktor keinen Zugriff erlangen können. Dies verringert das Risiko unbefugter Kontoübernahmen in Cloud-Umgebungen erheblich."},{"n":73,"simulation":false,"prompt":"Ein Benutzer meldet, dass auf seinem Computer mindestens zweimal täglich ein BSODFehler auftritt. Was sollte der Techniker verwenden, um die Ursache zu ermitteln?","options":[["A","Ereignisanzeige"],["B","Leistungsmonitor"],["C","Systeminformationen"],["D","Geräte-Manager"]],"answers":["A"],"explanation":"Die Ereignisanzeige protokolliert Systemfehler, einschließlich der kritischen Ereignisse, die zu Vorfällen mit dem „Blue Screen of Death“ (BSOD) führen oder diese beinhalten. Durch die Überprüfung der Protokolle „System“ und „Anwendung“, insbesondere der Fehlerträge und etwaiger Bugcheck-Codes, können Sie den fehlerhaften Treiber, Dienst oder die Hardwarekomponente identifizieren, die für die Abstürze verantwortlich ist."},{"n":74,"simulation":false,"prompt":"Ein Techniker richtet einen Windows-Server ein, um Remote-Desktop-Verbindungen für mehrere Benutzer zu ermöglichen. Welche der folgenden Einstellungen sollte der Techniker auf der Workstation konfigurieren?","options":[["A","Firewall"],["B","Computerverwaltung"],["C","Benutzerkonten"],["D","Barrierefreiheit"]],"answers":["A"],"explanation":"Um Remotedesktopverbindungen zu ermöglichen, muss in der Windows-Firewall auf dem Server (oder der als Host fungierenden Workstation) die Regel „Remotedesktop“ (TCP-Port 3389) aktiviert sein. Dadurch wird der erforderliche Port geöffnet, sodass mehrere Benutzer RDP-Sitzungen herstellen können. Die anderen Einstellungen (Benutzerkonten, Computerverwaltung, Barrierefreiheit) haben keinen direkten Einfluss auf den Netzwerkzugriff für RDP."},{"n":75,"simulation":false,"prompt":"Ein Techniker vermutet, dass eine Anwendung, die ein Benutzer aus dem Internet heruntergeladen hat, möglicherweise nicht die legitime Version ist, obwohl der Name derselbe ist. Der Techniker muss überprüfen, ob die Anwendung legitim ist. Was sollte der Techniker tun?","options":[["A","Den Hash-Wert mit dem des Herstellers vergleichen."],["B","Den Task-Manager starten und die Prozess-ID vergleichen."],["C","Die Anwendung im abgesicherten Modus ausführen."],["D","Überprüfen, ob der Dateiname korrekt ist."]],"answers":["A"],"explanation":"Durch die Berechnung der Prüfsumme der heruntergeladenen Anwendung (z. B. SHA-256 oder MD5) und den Abgleich mit dem vom Softwareanbieter veröffentlichten offiziellen Hash-Wert kann der Techniker die Integrität und Authentizität der Datei überprüfen. Ein übereinstimmender Hash-Wert bestätigt, dass die Anwendung echt und unverändert ist, während jede Abweichung auf eine potenziell gefälschte oder manipulierte Datei hindeutet."},{"n":77,"simulation":false,"prompt":"Ein Techniker muss ein Netzlaufwerk auf einem älteren Gerät zuordnen, auf dem ein Betriebssystem läuft, das nicht mehr weiterentwickelt wird. Welches der folgenden Skripte eignet sich am besten, um das Laufwerk mithilfe einfacher Windows-Befehle zuzuordnen?","options":[["A","Shell"],["B","Batch"],["C","VB"],["D","Java"]],"answers":["B"],"explanation":"Ein Batch-Skript ist die beste Wahl für die Zuordnung eines Netzlaufwerks mithilfe einfacher Windows-Befehle, da es Befehlszeilenanweisungen wie „net use“ sowohl in älteren als auch in modernen Windows-Umgebungen ausführen kann."},{"n":78,"simulation":false,"prompt":"Ein Nutzer berichtet, dass sein Browser nach dem Klicken auf eine Werbeanzeige langsam ist. Ein Techniker überprüft die Netzwerkverbindungen des Computers und stellt eine große Anzahl ausgehender Verbindungen. Welche der folgenden Maßnahmen sollte der Techniker als Nächstes ergreifen?","options":[["A","Die Firewall aktivieren."],["B","Antiviren-Scans durchführen."],["C","Den Computer neu starten."],["D","Das System unter Quarantäne stellen."]],"answers":["D"],"explanation":"Der Techniker sollte das System als Nächstes unter Quarantäne stellen, um zu verhindern, dass sich potenzielle Malware ausbreitet oder mit anderen Systemen kommuniziert, insbesondere angesichts der verdächtigen ausgehenden Verbindungen."},{"n":79,"simulation":false,"prompt":"Verschiedene Warnmeldungen auf dem Windows 11-Laptop eines Benutzers stören diesen ständig während Videokonferenzen. Welche der folgenden Maßnahmen sollte ein Support-Techniker empfehlen, um das Problem am besten zu beheben?","options":[["A","Verwenden Sie mehrere Audioausgabegeräte für die verschiedenen Quellanwendungen."],["B","Deaktivieren Sie alle Benachrichtigungen in den verschiedenen Anwendungen in der Reihenfolge ihres Erscheinens."],["C","Die Option „Sounds“ in der Systemsteuerung so konfigurieren, dass „Keine Sounds“ eingestellt ist."],["D","Stellen Sie die Windows-Benachrichtigungseinstellungen auf „Nicht stören“ ein."]],"answers":["D"],"explanation":"Wenn Sie die Windows-Benachrichtigungen auf „Nicht stören“ einstellen, werden Warnmeldungen und Unterbrechungen während Videokonferenzen unterdrückt und bietet somit die beste Lösung für das Problem."},{"n":80,"simulation":false,"prompt":"Die Mitarbeiter des Unternehmens haben keine festen Arbeitsplätze und arbeiten regelmäßig an verschiedenen Computern und an unterschiedlichen Standorten. Welche der folgenden Maßnahmen sollte das Unternehmen umsetzen, um die Datensicherheit zu gewährleisten und die Menge der zu übertragenden Benutzerdaten zu minimieren?","options":[["A","Zentrale Zertifikatsspeicherung"],["B","E-Mail in der Cloud"],["C","Tragbare Laufwerke"],["D","Roaming-Profile"]],"answers":["D"],"explanation":"Roaming-Profile ermöglichen es, dass Benutzerdaten und -einstellungen den Mitarbeitern folgen, wenn sie sich an verschiedenen Computern anmelden. Dadurch wird die Datensicherheit gewährleistet und die Notwendigkeit einer manuellen Übertragung von Benutzerdaten minimiert."},{"n":81,"simulation":false,"prompt":"Ein Benutzer lädt eine Anwendung mit einem Plug-in herunter, das so konzipiert ist, dass es automatisch zur Eingabe eines OTP auffordert, wenn der Benutzer eine bestimmte Website aufruft. Das Plug-in wird ohne Warnungen oder Fehler installiert. Beim ersten Aufruf der Website wird die Eingabeaufforderung nicht angezeigt, und der Benutzer kann nicht auf die Website zugreifen. Welche der folgenden Browsereinstellungen sollte der Benutzer konfigurieren?","options":[["A","Erweiterungen/Add-Ins"],["B","Gültigkeit des Zertifikats"],["C","Proxy-Einstellungen"],["D","Vertrauenswürdige Quellen"]],"answers":["A"],"explanation":"Der Benutzer sollte die Einstellungen für Erweiterungen/Add-Ins konfigurieren, da das Plug-in (die Erweiterung) möglicherweise deaktiviert oder blockiert ist, wodurch es nicht wie vorgesehen zur Eingabe des OTP auffordert."},{"n":82,"simulation":false,"prompt":"Ein Techniker muss bei einem Kunden, der die Verbindungen aus dem Internet zu seinem Netzwerk einschränken möchte, einen WLAN-Router installieren. Was sollte der Techniker tun?","options":[["A","Inhaltsfilterung verwenden."],["B","Das Standardpasswort ändern."],["C","Die SSID-Einstellungen konfigurieren."],["D","UPnP deaktivieren."]],"answers":["D"],"explanation":"Das Deaktivieren von UPnP (Universal Plug and Play) hilft dabei, unerwünschte oder unbefugte Verbindungen aus dem Internet einzuschränken, indem verhindert wird, dass Geräte automatisch Ports am Router öffnen."},{"n":83,"simulation":false,"prompt":"Ein Techniker installiert eine cloudbasierte Office-Suite und erhält immer wieder eine Fehlermeldung, dass die Installation nicht verfügbar ist. Welchen der folgenden Schritte zur Fehlerbehebung sollte der Techniker als Erstes versuchen?","options":[["A","Neuinstallation der Office-Suite"],["B","Eine Open-Source-Alternative herunterladen"],["C","Die Begrenzung der Geräteanzahl für die Lizenz überprüfen"],["D","Das Betriebssystem des Geräts aktualisieren"]],"answers":["C"],"explanation":"Der Techniker sollte zunächst die Gerätebegrenzung der Lizenz überprüfen, da eine Überschreitung der zulässigen Anzahl von Installationen die Installation der cloudbasierten Produktivitätssuite verhindern kann."},{"n":84,"simulation":false,"prompt":"Ein Benutzer möchte eine defekte Festplatte so entsorgen, dass die Daten nicht wiederhergestellt werden können. Welche der folgenden Methoden eignet sich am besten für zu Hause?","options":[["A","Standardformatierung"],["B","Low-Level-Formatierung"],["C","Schreddern"],["D","Entmagnetisierung"],["E","Bohren"]],"answers":["E"],"explanation":"Durch das Bohren werden die Platten der Festplatte physisch zerstört, wodurch eine Datenwiederherstellung unmöglich wird; dies ist eine wirksame Methode für zu Hause, um sicherzustellen, dass Daten nicht wiederhergestellt werden können."},{"n":85,"simulation":false,"prompt":"Der Laptop eines Kunden lässt sich nicht einschalten. Der Kunde ist verzweifelt und in Panik, da der Laptop Familienfotos enthält, die niemals ersetzt werden können. Welche der folgenden Kommunikationstechniken ist für den Techniker in dieser Situation am wichtigsten?","options":[["A","Der Techniker sollte dem Kunden die entsprechende SLA-Vereinbarung vorlegen."],["B","Der Techniker sollte den Kunden über Ersatzoptionen gegen einen Aufpreis informieren."],["C","Der Techniker sollte Selbstvertrauen ausstrahlen und eine positive Haltung bewahren."],["D","Der Techniker sollte angemessene Business-Casual-Kleidung tragen, um Fachkompetenz auszustrahlen."]],"answers":["C"],"explanation":"Selbstbewusstsein auszustrahlen und eine positive Einstellung zu bewahren, ist äußerst wichtig, um den Kunden zu beruhigen und ihm in einer stressigen Situation seine Sorgen zu nehmen."},{"n":86,"simulation":false,"prompt":"Welche der folgenden Sicherheitstechnologien ist darauf ausgelegt, Sicherheitstransparenz zu ermöglichen und auf Datenverkehr außerhalb des Hosts sowie auf Netzwerkebene zu reagieren?","options":[["A","RADIUS"],["B","UAC"],["C","XDR"],["D","Antivirus"]],"answers":["C"],"explanation":"XDR (Extended Detection and Response) wurde entwickelt, um Sicherheitstransparenz und Reaktionsmöglichkeiten über den Host hinaus zu bieten, einschließlich auf Netzwerkebene."},{"n":87,"simulation":false,"prompt":"Ein Techniker schließt die Installation eines Betriebssystems ab, die erfolgreich zu sein scheint. Als der Techniker jedoch den für die Installation verwendeten USB-Stick entfernt und das System neu startet, erscheint die folgende Fehlermeldung: Kein Betriebssystem gefunden. Was sollte der Techniker als Nächstes tun, um das Problem zu beheben?","options":[["A","Das Betriebssystem von einem neuen ISO-Image neu installieren."],["B","UEFI-Geräte im BIOS aktivieren."],["C","Im Wiederherstellungsmodus neu starten und Fehlerbehebung durchführen."],["D","Die Speichertreiber für das Motherboard installieren."],["E","Das SATA-Kabel neu einstecken."]],"answers":["B"],"explanation":"Durch die Aktivierung von UEFI-Geräten im BIOS wird sichergestellt, dass das System das auf einem UEFIkonfigurierten Laufwerk installierte Betriebssystem erkennen und davon booten kann, wodurch der Fehler „Kein Betriebssystem gefunden“ nach der Installation behoben wird."},{"n":88,"simulation":false,"prompt":"Ein Mitarbeiter versucht während einer Geschäftsreise, seinen Firmenlaptop mit dem WLAN eines Flughafens zu verbinden. Sobald die Verbindung zum Netzwerk hergestellt ist, erscheint ein Popup-Fenster mit dem Flughafenlogo, das der Mitarbeiter sofort schließt. Die Internetverbindung funktioniert nicht richtig, und der Mitarbeiter kann auf keine Websites zugreifen. Was sollte ein Helpdesk-Mitarbeiter dem Mitarbeiter vorschlagen?","options":[["A","Suchen Sie nach einer Wandsteckdose mit RJ45-Anschluss und versuchen Sie, den Laptop daran anzuschließen."],["B","Wenden Sie sich an die IT-Abteilung des Flughafens."],["C","Dem Mitarbeiter mitteilen, dass die Unternehmensrichtlinien die Verbindung mit öffentlichen WLAN-Netzen verbieten."],["D","Stellen Sie die Verbindung zum Netzwerk erneut her und lesen Sie das Pop-up-Fenster sorgfältig durch."]],"answers":["D"],"explanation":"Es ist notwendig, die Verbindung zum Netzwerk erneut herzustellen und das Popup-Fenster sorgfältig zu lesen, da viele öffentliche WLAN-Netzwerke von den Nutzern verlangen, dass sie mit einem Captive Portal interagieren (z. B. durch Akzeptieren der Nutzungsbedingungen), bevor der Internetzugang gewährt wird."},{"n":89,"simulation":false,"prompt":"Ein Techniker installiert ein Bluetooth-Headset für einen Benutzer. Während des Tests kommt der Ton weiterhin über den Lautsprecher des Computers. Der Techniker überprüft, ob das Headset im GeräteManager angezeigt wird. Was würde der Techniker höchstwahrscheinlich tun, um dieses Problem zu beheben?","options":[["A","Die Treiber für das drahtlose Headset aktualisieren."],["B","Die Batterie des Headsets austauschen und es später erneut versuchen."],["C","Überprüfen, ob der Ton in der Systemsteuerung stummgeschaltet ist."],["D","Das Headset in den Soundeinstellungen als Standardgerät festlegen."]],"answers":["D"],"explanation":"Der Techniker sollte das Headset in den Soundeinstellungen als Standardgerät festlegen, um sicherzustellen, dass der Ton an das Bluetooth-Headset statt an die Lautsprecher des Computers weitergeleitet wird."},{"n":90,"simulation":false,"prompt":"Welches der folgenden Protokolle bietet AAA für Netzwerkdienste?","options":[["A","RADIUS"],["B","Kerberos"],["C","TKIP"],["D","WPA3"]],"answers":["A"],"explanation":"RADIUS ist ein Protokoll, das Authentifizierung, Autorisierung und Abrechnung (AAA) für Netzwerkdienste bereitstellt."},{"n":91,"simulation":false,"prompt":"Die Anwendung eines Benutzers funktioniert nur mit einer älteren Version des Betriebssystems. Das Betriebssystem nähert sich dem Ende seiner Lebensdauer. Aus Sicherheitsgründen migriert das Unternehmen auf die aktuelle Version des Betriebssystems. Welche der folgenden Möglichkeiten ist der effizienteste Weg, um die Migration abzuschließen und gleichzeitig den Zugriff auf die Anwendung aufrechtzuerhalten?","options":[["A","Terminalserver"],["B","Bare-Metal-Server"],["C","Multiboot"],["D","Virtualisierung"]],"answers":["D"],"explanation":"Durch Virtualisierung können das alte Betriebssystem und die dazugehörigen Anwendungen in einer virtuellen Maschine ausgeführt werden, sodass der Zugriff weiterhin möglich ist, während das Host-System auf das aktuelle Betriebssystem migriert wird."},{"n":92,"simulation":false,"prompt":"Ein Techniker muss Gastanmeldungen auf Desktop-Computern, die einer Domäne angehören, deaktivieren. Welche der folgenden Optionen sollte der Techniker verwenden?","options":[["A","Gruppenrichtlinie"],["B","Firewall"],["C","Microsoft Management Control"],["D","MSConfig"]],"answers":["A"],"explanation":"Gruppenrichtlinien ermöglichen die zentrale Verwaltung und Konfiguration von Einstellungen, einschließlich der Deaktivierung von Gastanmeldungen auf Desktop-Computern, die einer Domäne angehören."},{"n":93,"simulation":false,"prompt":"Nach der Verwendung einer Festplattenoptimierungssoftware eines Drittanbieters startet ein Techniker einen Laptop neu und erhält die Meldung „Kein Betriebssystem gefunden“. Der Techniker stellt fest, dass das BIOS die SSD ordnungsgemäß erkennt. Was sollte der Techniker als Nächstes tun?","options":[["A","Die BitLocker-Einstellungen im BIOS aktualisieren."],["B","Die CMOS-Batterie austauschen."],["C","Vom Installationsmedium booten und den MBR reparieren"],["D","Das System vom Unternehmensnetzwerk isolieren."]],"answers":["C"],"explanation":"Der nächste Schritt ist die Reparatur des Master Boot Record (MBR) mithilfe des Installationsmediums, da die Festplattenoptimierungssoftware möglicherweise die Boot-Informationen beschädigt oder entfernt hat, was den Fehler „Kein Betriebssystem gefunden“ verursacht hat."},{"n":94,"simulation":false,"prompt":"Ein Benutzer meldet den Verlust seines Firmenhandys. Welche der folgenden Maßnahmen schützt die lokal auf dem Telefon gespeicherten Daten vor unbefugtem Zugriff?","options":[["A","Passwort-Manager"],["B","Entmagnetisierung"],["C","Fernlöschung"],["D","Antivirus"]],"answers":["C"],"explanation":"Die Fernlöschung schützt die Daten, indem sie vom verlorenen Smartphone gelöscht werden, wodurch unbefugter Zugriff verhindert wird."},{"n":95,"simulation":false,"prompt":"Ein Benutzer erhält bei der Verwendung von MFA eine Push-Benachrichtigung, um eine Anmeldeanfrage zu genehmigen oder abzulehnen. Welche der folgenden Aussagen beschreibt diese Sicherheitsmaßnahme?","options":[["A","Einmalpasswort"],["B","Zero-Trust-Modell"],["C","Authentifizierungs-App"],["D","Verwaltung privilegierter Zugriffe"]],"answers":["C"],"explanation":"Eine Authentifizierungs-App sendet Push-Benachrichtigungen, um Anmeldeanfragen im Rahmen der MultiFaktor-Authentifizierung (MFA) zu genehmigen oder abzulehnen."},{"n":96,"simulation":false,"prompt":"Ein Administrator untersucht einen technischen Ausfall. Das Managementteam wünscht Informationen, die eine Zusammenfassung des Ausfalls und der ergriffenen Maßnahmen enthalten. Welche der folgenden Unterlagen sollte der Administrator dem Managementteam zur Verfügung stellen?","options":[["A","Artikel aus der Wissensdatenbank"],["B","Vertraulichkeitsvereinbarung"],["C","Störungsbericht"],["D","Standardarbeitsanweisung"]],"answers":["C"],"explanation":"Ein Störungsbericht enthält eine Zusammenfassung des Ausfalls und der ergriffenen Maßnahmen und stellt somit die vom Managementteam benötigte Dokumentation dar."},{"n":97,"simulation":false,"prompt":"Ein Techniker führt eine Fehlerbehebung an einem Druckspooler durch, der auf einem Windows 11Desktopcomputer wiederholt nicht startet. Der Techniker stellt fest, dass die Ursache darin liegt, dass erforderliche Abhängigkeiten nicht ausgeführt werden. Welches der folgenden Tools verwendet der Techniker?","options":[["A","Prozesse"],["B","Dienste"],["C","Autostart"],["D","Leistung"]],"answers":["B"],"explanation":"Mit dem Dienst-Tool in Windows kann der Techniker Dienstabhängigkeiten identifizieren und den Druckspooler-Dienst verwalten."},{"n":98,"simulation":false,"prompt":
