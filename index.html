<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--blue:#145dcc;--blue2:#eaf2ff;--line:#d8e0ec;--good:#157347;--bad:#b42318;--warn:#9a6700;--shadow:0 12px 35px rgba(20,45,90,.11)}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,select,input{font:inherit}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 3px 16px rgba(20,45,90,.06)}
.topin{max-width:1100px;margin:auto;padding:12px 16px}.brandrow{display:flex;align-items:center;gap:12px;justify-content:space-between}.brand{font-weight:850;font-size:clamp(17px,3.6vw,24px)}
.badges{display:flex;gap:8px;align-items:center}.badge{border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-weight:750;background:#fff}.timer{font-variant-numeric:tabular-nums}.timer.low{color:var(--bad);border-color:#f2b8b5;background:#fff4f3}

main{max-width:1100px;margin:24px auto;padding:0 16px 100px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:clamp(18px,4vw,32px)}

.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#edf2f8;color:#26374f}.danger{background:#fff1f0;color:var(--bad);border:1px solid #f4c7c4}.flag{background:#fff8df;color:#775500;border:1px solid #ead58b}.flag.on{background:#ffe791}
.qhead{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}.qnum{font-size:14px;font-weight:850;color:var(--blue);letter-spacing:.03em}.qtext{font-size:clamp(18px,4vw,24px);font-weight:760;line-height:1.42;margin:10px 0 20px}.type{font-size:13px;border-radius:999px;background:var(--blue2);color:#164f9e;padding:6px 10px;font-weight:800;white-space:nowrap}

.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:24px;flex-wrap:wrap}.navgroup{display:flex;gap:10px;flex-wrap:wrap}.status{color:var(--muted);font-size:14px}.hint{background:#fff8e6;border:1px solid #f0d27a;padding:12px 14px;border-radius:12px;color:#6e5500;margin:12px 0}
.reviewgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin-top:18px}.qchip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 4px;font-weight:800;cursor:pointer}.qchip.done{background:#eaf7ef;border-color:#90d0aa}.qchip.flagged{outline:3px solid #f2ca4c}.qchip.empty{background:#fff0ef;border-color:#efb7b3}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin:14px 0}.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.resultbox{text-align:center}.score{font-size:clamp(52px,12vw,92px);font-weight:950;line-height:1}.pass{color:var(--good)}.fail{color:var(--bad)}.resultlist{margin-top:22px;text-align:left}.resitem{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.resitem.good{border-left:6px solid var(--good)}.resitem.bad{border-left:6px solid var(--bad)}.explain{color:#45556f;line-height:1.45;margin-top:8px}.correct{font-weight:850;color:var(--good)}
.pbq{background:linear-gradient(180deg,#f7fbff,#fff);border:2px solid #9fc2f5}.pbqgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.field{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.field label{font-weight:800;display:block;margin-bottom:7px}.field select{width:100%;padding:10px;border:1px solid #bcc8d9;border-radius:9px;background:#fff}.emailrow{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff;margin:10px 0}.emailtitle{font-weight:900;margin-bottom:9px}
.small{font-size:13px;color:var(--muted)}.hidden{display:none!important}.footerNote{max-width:900px;margin:18px auto;color:var(--muted);font-size:12px;text-align:center;line-height:1.4}
@media(max-width:600px){main{margin-top:14px}.topin{padding:10px 12px}.badge{padding:6px 8px;font-size:13px}.brand{font-size:16px}.card{border-radius:14px}.btn{flex:1}.nav .btn{flex:0 1 auto}}

.modegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:24px}.modecard{border:1px solid var(--line);border-radius:16px;padding:18px;text-align:left;background:#fff}.modecard h3{margin:0 0 7px}.modecard p{color:var(--muted);min-height:48px}.topicgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:18px}.topicbtn{padding:14px;border:1px solid var(--line);background:#fff;border-radius:12px;font-weight:800;cursor:pointer;text-align:left}.feedback{margin-top:16px;padding:15px;border-radius:12px;line-height:1.5}.feedback.good{background:#eaf7ef;border:1px solid #90d0aa}.feedback.bad{background:#fff0ef;border:1px solid #efb7b3}.trainstat{font-size:14px;color:var(--muted);margin-bottom:10px}.terminal{background:#111;color:#eee;padding:14px;border-radius:10px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow:auto;white-space:pre-wrap}.smallbtn{padding:9px 12px}
</style></head><body>
