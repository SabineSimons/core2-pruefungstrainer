<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Core 2 Prüfungstrainer</title></head><body><p>Core 2 Prüfungstrainer wird geladen...</p><script>
const CURRENT="https://raw.githubusercontent.com/SabineSimons/core2-pruefungstrainer/c8f0923be25229c3778f707cf4e53d16347a724f/index.html";
fetch(CURRENT).then(r=>{if(!r.ok)throw new Error('Trainer konnte nicht geladen werden: '+r.status);return r.text()}).then(loader=>{
const visualPatch=String.raw`
html=html.replace('</style>',\`.option.answer-correct{background:#e3f6e9!important;border:3px solid #16834f!important;box-shadow:0 0 0 2px rgba(22,131,79,.08)}.option.answer-wrong{background:#ffe8e6!important;border:3px solid #c62828!important;box-shadow:0 0 0 2px rgba(198,40,40,.07)}.answerbadge{margin-left:auto;flex:0 0 auto;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:950;letter-spacing:.02em}.answer-correct .answerbadge{background:#16834f;color:#fff}.answer-wrong .answerbadge{background:#c62828;color:#fff}.feedback.good{border:2px solid #16834f!important}.feedback.bad{border:2px solid #c62828!important}@media(max-width:600px){.answerbadge{display:block;margin:7px 0 0 0;width:max-content}}\\n</style>\`);
html=html.replace('function trainNext(){',\`function decorateTrainingAnswers(){if(!train||!train.checked)return;let q=train.items[train.index];document.querySelectorAll('.option').forEach(el=>{let inp=el.querySelector('input');if(!inp)return;let val=inp.value||'';let isCorrect=q.answers.includes(val);let wasSelected=train.selected.includes(val);if(isCorrect){el.classList.add('answer-correct');let b=document.createElement('span');b.className='answerbadge';b.textContent=wasSelected?'✓ RICHTIG':'✓ RICHTIGE ANTWORT';el.appendChild(b)}else if(wasSelected){el.classList.add('answer-wrong');let b=document.createElement('span');b.className='answerbadge';b.textContent='✕ DEINE ANTWORT – FALSCH';el.appendChild(b)}})}\\nfunction trainNext(){\`);
html=html.replace("function trainCheck(){if(!train.selected.length)return alert('Bitte erst eine Antwort auswählen.');train.checked=true;let q=train.items[train.index];markTrainProgress(q.n,train.topic);train.ok=eq(train.selected,q.answers);if(train.ok){train.correct++;clearTrainError(q.n)}else addTrainError(q.n);renderTraining()}","function trainCheck(){if(!train.selected.length)return alert('Bitte erst eine Antwort auswählen.');train.checked=true;let q=train.items[train.index];markTrainProgress(q.n,train.topic);train.ok=eq(train.selected,q.answers);if(train.ok){train.correct++;clearTrainError(q.n)}else addTrainError(q.n);renderTraining();decorateTrainingAnswers()}");
`;
loader=loader.replace('return html;}\nfetch(SOURCE)',visualPatch+'return html;}\nfetch(SOURCE)');
document.open();document.write(loader);document.close();
}).catch(e=>{document.body.innerHTML='<h2>Trainer konnte nicht geladen werden</h2><p>'+String(e)+'</p>';});
</script></body></html>
