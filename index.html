<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Core 2 Prüfungstrainer</title>
</head>
<body>
<p>Core 2 Prüfungstrainer wird geladen...</p>
<script>
fetch('alte-version-bis-pruefung.html')
 .then(r=>{if(!r.ok)throw new Error('Gesicherter Trainer konnte nicht geladen werden: '+r.status);return r.text()})
 .then(wrapper=>{
   const marker='return html;}';
   if(!wrapper.includes(marker))throw new Error('Fortsetzungs-Erweiterung konnte nicht eingesetzt werden.');
   const injection="html=html.replace('</body>','<scr'+'ipt src=\"core2-old-topic-resume.js\"></scr'+'ipt></body>');return html;}";
   wrapper=wrapper.replace(marker,injection);
   document.open();
   document.write(wrapper);
   document.close();
 })
 .catch(e=>{document.body.innerHTML='<h2>Trainer konnte nicht geladen werden</h2><p>'+String(e)+'</p>'});
</script>
</body>
</html>
