<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Core 2 Prüfungstrainer</title></head><body><p>Core 2 Prüfungstrainer wird geladen...</p><script>
const SOURCE="https://raw.githubusercontent.com/SabineSimons/core2-pruefungstrainer/fec6dbf7b76a672dd6b8a2499a6901fbd666cd99/index.html";
function patch(html){
html=html.replace("220-1202 Lern- & Prüfungstrainer</h1>","220-1202 Lern- & Prüfungstrainer</h1><div class=\"small\" style=\"margin-top:8px;font-weight:800;color:var(--good)\">Version 03.09.2026 · Antwort-Markierung aktiv</div>");
html=html.replace(/(const TRAIN_ERR_KEY='[^']+';)/,"$1\nconst TRAIN_PROGRESS_KEY='sabine_core2_2201202_topic_progress_v1';");
html=html.replace("{id:'pbq72',n:72,title:'PBQ · Verdächtige E-Mails',prompt:'Klassifizieren Sie die E-Mails und wählen Sie gemäß Unternehmensrichtlinie die passende Maßnahme.',kind:'pbq72'},\n {id:'pbq282'","{id:'pbq72',n:72,title:'PBQ · Verdächtige E-Mails',prompt:'Klassifizieren Sie die E-Mails und wählen Sie gemäß Unternehmensrichtlinie die passende Maßnahme.',kind:'pbq72'},\n {id:'pbq76',n:76,title:'PBQ · Quarantäne & Audio-Dienste',prompt:'Mehrere Benutzer melden Audio- sowie Leistungsprobleme nach dem Herunterladen nicht autorisierter Software. Stellen Sie die betroffenen Geräte unter Quarantäne und konfigurieren Sie die Audio-Dienste.',kind:'pbq76'},\n {id:'pbq282'");
html=html.replace("function pbq282(v){","function pbq76(v){let devs=['Host 2','Host 3','Host 4','Host 5','Host 6','Host 7','Host 8','Media Server','Database Server','File Server'];let audio=['Started','Stopped'];return `<div class=\"hint\">Original-Simulation 76 aus der PDF. Die Lösung wird dort grafisch dargestellt und ist nicht eindeutig als Text ausgeschrieben. Deshalb wird diese Aufgabe nicht automatisch als richtig/falsch gewertet.</div><div class=\"field\"><label>Geräte unter Quarantäne</label>${devs.map(d=>`<label class=\"option\"><input type=\"checkbox\" ${Array.isArray(v.quarantine)&&v.quarantine.includes(d)?'checked':''} onchange=\"pbq76Toggle('${d}',this.checked)\"><span>${d}</span></label>`).join('')}</div><div class=\"pbqgrid\">${devs.map(d=>`<div class=\"field\"><label>${d} · Windows Audio</label>${sel('pbq76','audio_'+d.replaceAll(' ','_'),audio,v['audio_'+d.replaceAll(' ','_')])}</div>`).join('')}</div>`}\nfunction pbq76Toggle(device,on){let a=state.answers.pbq76||(state.answers.pbq76={quarantine:[]});a.quarantine=Array.isArray(a.quarantine)?a.quarantine:[];if(on&&!a.quarantine.includes(device))a.quarantine.push(device);if(!on)a.quarantine=a.quarantine.filter(x=>x!==device);save()}\nfunction pbq282(v){");
html=html.replace(/if\(it\.kind==='pbq72'\)body=pbq72\(v\);\s*if\(it\.kind==='pbq282'\)body=pbq282\(v\);/g,"if(it.kind==='pbq72')body=pbq72(v);if(it.kind==='pbq76')body=pbq76(v);if(it.kind==='pbq282')body=pbq282(v);");
html=html.replace("function clearTrainError(n){setTrainErrors(getTrainErrors().filter(x=>x!==n))}","function clearTrainError(n){setTrainErrors(getTrainErrors().filter(x=>x!==n))}\nfunction getTrainProgress(){try{return JSON.parse(localStorage.getItem(TRAIN_PROGRESS_KEY)||'{\"topics\":{},\"all\":{}}')}catch(e){return {topics:{},all:{}}}}\nfunction setTrainProgress(o){localStorage.setItem(TRAIN_PROGRESS_KEY,JSON.stringify(o||{topics:{},all:{}}))}\nfunction markTrainProgress(n,topic){let p=getTrainProgress();if(!p.topics)p.topics={};if(!p.all)p.all={};p.all[n]=true;if(topic&&topic!=='all'&&topic!=='errors'){if(!p.topics[topic])p.topics[topic]={};p.topics[topic][n]=true}setTrainProgress(p)}\nfunction topicProgress(name){let ids=BANK.filter(q=>topicFor(q,name)).map(q=>q.n),p=getTrainProgress(),t=(p.topics&&p.topics[name])||{},done=ids.filter(n=>t[n]).length;return {done,total:ids.length,pct:ids.length?Math.round(done/ids.length*100):0}}\nfunction overallProgress(){let p=getTrainProgress(),ids=[...new Set(BANK.map(q=>q.n))],a=p.all||{},done=ids.filter(n=>a[n]).length;return {done,total:ids.length,pct:ids.length?Math.round(done/ids.length*100):0}}\nfunction resetTopicProgress(encoded){let name=decodeURIComponent(encoded);if(!confirm('Fortschritt für „'+name+'“ wirklich zurücksetzen?'))return;let p=getTrainProgress();if(!p.topics)p.topics={};p.topics[name]={};setTrainProgress(p);topicMenu()}\nfunction resetAllProgress(){if(!confirm('Kompletten Core-2-Fortschritt wirklich zurücksetzen? Themenfortschritt, Fehlerliste und gespeicherte Prüfung werden gelöscht.'))return;localStorage.removeItem(TRAIN_PROGRESS_KEY);localStorage.removeItem(TRAIN_ERR_KEY);clearExam();train=null;state=null;home()}");
html=html.replace("<button class=\"btn primary\" onclick=\"topicMenu()\">Themen wählen</button><div class=\"quicktopics\" style=\"display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;justify-content:center\">${Object.keys(TOPICS).map(n=>`<button class=\"btn secondary\" style=\"padding:8px 10px;font-size:13px\" onclick=\"startTopic('${topicArg(n)}')\">${n}</button>`).join('')}</div>","<button class=\"btn primary\" onclick=\"topicMenu()\">Themen wählen</button><div class=\"quicktopics\" style=\"display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px\">${Object.keys(TOPICS).map(n=>{let p=topicProgress(n);return `<div style=\"border:1px solid var(--line);border-radius:12px;padding:9px\"><button class=\"btn secondary\" style=\"width:100%;padding:8px 10px;font-size:13px\" onclick=\"startTopic('${topicArg(n)}')\">${n} · ${p.done}/${p.total} · ${p.pct}%</button><button class=\"btn danger\" style=\"width:100%;margin-top:6px;padding:7px 9px;font-size:12px\" onclick=\"resetTopicProgress('${topicArg(n)}')\">↺ Dieses Thema zurücksetzen</button></div>`}).join('')}</div>");
html=html.replace("${resume?`<p class=\"small\">Gespeicherte Prüfung: Frage ${old.index+1} von ${old.items?.length||90} · ${Object.keys(old.answers||{}).length} Antworten</p>`:''}</section><div class=\"footerNote\">Basis:","${resume?`<p class=\"small\">Gespeicherte Prüfung: Frage ${old.index+1} von ${old.items?.length||90} · ${Object.keys(old.answers||{}).length} Antworten</p>`:''}<div class=\"modecard\" style=\"max-width:720px;margin:18px auto 0;text-align:center\"><h3>📊 Gesamtfortschritt</h3><p><b>${overallProgress().done} von ${overallProgress().total}</b> Fragen bearbeitet · <b>${overallProgress().pct}%</b></p><button class=\"btn danger\" onclick=\"resetAllProgress()\">🗑️ Kompletten Fortschritt zurücksetzen</button></div></section><div class=\"footerNote\">Basis:");
html=html.replace(/function topicMenu\(\)\{.*?\}\nfunction startTraining/s,"function topicMenu(){stopTimer();$('#top').classList.add('hidden');app.innerHTML=`<section class=\"card\"><div class=\"qnum\">THEMEN-TRAINING</div><div class=\"qtext\">Thema auswählen oder Fortschritt einzeln zurücksetzen</div><div class=\"topicgrid\">${Object.keys(TOPICS).map(n=>{let p=topicProgress(n);return `<div class=\"modecard\" style=\"text-align:left\"><h3>${n}</h3><p><b>${p.done} von ${p.total}</b> erledigt · <b>${p.pct}%</b></p><button class=\"btn primary\" style=\"width:100%\" onclick=\"startTopic('${topicArg(n)}')\">Thema starten</button><button class=\"btn danger\" style=\"width:100%;margin-top:8px\" onclick=\"resetTopicProgress('${topicArg(n)}')\">↺ Fortschritt dieses Themas zurücksetzen</button></div>`}).join('')}</div><div class=\"actions\"><button class=\"btn secondary\" onclick=\"home()\">← Hauptmenü</button><button class=\"btn danger\" onclick=\"resetAllProgress()\">🗑️ Kompletten Fortschritt zurücksetzen</button></div></section>`}\nfunction startTraining");
html=html.replace("function trainCheck(){if(!train.selected.length)return alert('Bitte erst eine Antwort auswählen.');train.checked=true;let q=train.items[train.index];train.ok=","function trainCheck(){if(!train.selected.length)return alert('Bitte erst eine Antwort auswählen.');train.checked=true;let q=train.items[train.index];markTrainProgress(q.n,train.topic);train.ok=");
html=html.replace(/function submitExam\(auto\)\{[^\n]*results\(\)\}/,"function submitExam(auto){if(!state||state.status!=='running')return;state.status='done';state.auto=auto;state.finished=Date.now();let correct=0;state.grades={};for(const it of state.items){if(it.kind==='pbq76'){state.grades[it.id]=null;continue}let ok=it.kind==='mc'?eq(state.answers[it.id],it.q.answers):gradePBQ(it,state.answers[it.id]);state.grades[it.id]=ok;if(ok)correct++}state.correct=correct;save();stopTimer();results()}");
html=html.replace(/function results\(\)\{[^\n]*<\/section>`\}/,"function results(){stopTimer();$('#top').classList.add('hidden');let total=state.items.length,ungraded=state.items.filter(it=>state.grades[it.id]===null).length,graded=total-ungraded,pct=graded?Math.round(state.correct/graded*100):0,passed=pct>=75;let wrong=state.items.filter(it=>state.grades[it.id]===false);app.innerHTML=`<section class=\"card resultbox\"><div class=\"qnum\">AUSWERTUNG</div><div class=\"score ${passed?'pass':'fail'}\">${pct}%</div><h2>${state.correct} von ${graded} bewerteten Aufgaben richtig</h2><p>${state.auto?'Die 90 Minuten sind abgelaufen. Die Prüfung wurde automatisch abgegeben.':'Prüfung abgegeben.'}${ungraded?' · '+ungraded+' Original-Simulation unbewertet.':''}</p><div class=\"actions\"><button class=\"btn primary\" onclick=\"newExamFromResult()\">Neue Prüfung</button><button class=\"btn secondary\" onclick=\"showAllExamQuestions()\">Alle Fragen (${total})</button><button class=\"btn secondary\" onclick=\"showWrong()\">Nur Fehler (${wrong.length})</button></div></section>`}");
html=html.replace(/function checkPBQTrain\(\)\{[^\n]*\}/,"function checkPBQTrain(){let it=state.items[state.index];if(it.kind==='pbq76'){$('#pbqfb').innerHTML=`<div class=\"feedback good\"><b>ℹ️ Original-Simulation</b><br>Diese Aufgabe ist in der Originaldatei grafisch gelöst und wird deshalb hier nicht automatisch als richtig/falsch bewertet.</div><div class=\"actions\"><button class=\"btn primary\" onclick=\"nextPBQTrain()\">Nächste Simulation →</button></div>`;return}let ok=gradePBQ(it,state.answers[it.id]);$('#pbqfb').innerHTML=`<div class=\"feedback ${ok?'good':'bad'}\"><b>${ok?'✅ Richtig':'❌ Noch nicht richtig'}</b><br><b>Lösung:</b> ${esc(correctText(it))}<br>${esc(explanation(it))}</div><div class=\"actions\"><button class=\"btn primary\" onclick=\"nextPBQTrain()\">Nächste Simulation →</button></div>`}");
html=html.replace('</style>',".option.answer-correct{background:#e3f6e9!important;border:3px solid #16834f!important}.option.answer-wrong{background:#ffe8e6!important;border:3px solid #c62828!important}.answerbadge{margin-left:auto;flex:0 0 auto;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:950}.answer-correct .answerbadge{background:#16834f;color:#fff}.answer-wrong .answerbadge{background:#c62828;color:#fff}@media(max-width:600px){.answerbadge{margin-left:6px;font-size:11px;padding:4px 7px}}</style>");
html=html.replace("function trainNext(){","function decorateTrainingAnswers(){if(!train||!train.checked)return;let q=train.items[train.index];document.querySelectorAll('.option').forEach(el=>{let letterEl=el.querySelector('.letter');if(!letterEl)return;let val=(letterEl.textContent||'').replace('.','').trim();let isCorrect=q.answers.includes(val);let wasSelected=train.selected.includes(val);if(isCorrect){el.classList.add('answer-correct');let b=document.createElement('span');b.className='answerbadge';b.textContent=wasSelected?'✓ RICHTIG':'✓ RICHTIGE ANTWORT';el.appendChild(b)}else if(wasSelected){el.classList.add('answer-wrong');let b=document.createElement('span');b.className='answerbadge';b.textContent='✕ DEINE ANTWORT – FALSCH';el.appendChild(b)}})}\nfunction trainNext(){");
html=html.replace("function trainCheck(){if(!train.selected.length)return alert('Bitte erst eine Antwort auswählen.');train.checked=true;let q=train.items[train.index];markTrainProgress(q.n,train.topic);train.ok=eq(train.selected,q.answers);if(train.ok){train.correct++;clearTrainError(q.n)}else addTrainError(q.n);renderTraining()}","function trainCheck(){if(!train.selected.length)return alert('Bitte erst eine Antwort auswählen.');train.checked=true;let q=train.items[train.index];markTrainProgress(q.n,train.topic);train.ok=eq(train.selected,q.answers);if(train.ok){train.correct++;clearTrainError(q.n)}else addTrainError(q.n);renderTraining();decorateTrainingAnswers()}");
return html;}
fetch(SOURCE).then(r=>{if(!r.ok)throw new Error('Trainer konnte nicht geladen werden: '+r.status);return r.text()}).then(html=>{html=patch(html);document.open();document.write(html);document.close();}).catch(e=>{document.body.innerHTML='<h2>Trainer konnte nicht geladen werden</h2><p>'+String(e)+'</p>';});
</script></body></html>
