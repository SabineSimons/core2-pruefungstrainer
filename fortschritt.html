<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CompTIA A+ Core 2 · Vollständiger Trainer</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}iframe{display:block}</style></head><body><iframe id="trainer" src="index.html?v=12" title="Core 2 Prüfungstrainer"></iframe><script>
const frame=document.getElementById('trainer');
frame.addEventListener('load',()=>{
 const d=frame.contentDocument;
 const s=d.createElement('script');
 s.textContent=String.raw`
(function(){
const QKEY='sabine_core2_2201202_progress_v8';
const PKEY='sabine_core2_2201202_pbq_progress_v8';
const TKEY='sabine_core2_2201202_topic_state_v10';
let activeTopic=null,activeTopicMode=null;
function read(k,fallback=[]){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(fallback))}catch(e){return fallback}}
function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
function uniq(a){return [...new Set(a)]}
function qDone(){return read(QKEY,[])} function pDone(){return read(PKEY,[])}
function markQ(n){write(QKEY,uniq([...qDone(),n]))} function markP(n){write(PKEY,uniq([...pDone(),n]))}
function pc(d,t){return t?Math.round(d/t*100):0}
function topicPool(name){return BANK.filter(q=>topicFor(q,name))}
function topicData(){return read(TKEY,{})}
function topicRecord(name){let all=topicData(),pool=topicPool(name),valid=new Set(pool.map(q=>q.n));if(!all[name]){all[name]={order:[],index:0,done:qDone().filter(n=>valid.has(n)),errors:getTrainErrors().filter(n=>valid.has(n)),correct:0};write(TKEY,all)}else{all[name].done=(all[name].done||[]).filter(n=>valid.has(n));all[name].errors=(all[name].errors||[]).filter(n=>valid.has(n));all[name].order=(all[name].order||[]).filter(n=>valid.has(n));all[name].index=Math.max(0,Math.min(Number(all[name].index)||0,pool.length));all[name].correct=Number(all[name].correct)||0;write(TKEY,all)}return all[name]}
function setTopicRecord(name,rec){let all=topicData();all[name]=rec;write(TKEY,all)}
function topicStats(name){const pool=topicPool(name),rec=topicRecord(name),valid=new Set(pool.map(q=>q.n));return {done:uniq(rec.done||[]).filter(n=>valid.has(n)).length,total:pool.length,errors:uniq(rec.errors||[]).filter(n=>valid.has(n)).length,index:rec.index||0}}
function allStats(){const done=new Set(qDone());return {done:BANK.filter(q=>done.has(q.n)).length,total:BANK.length}}
function pbqStats(){const done=new Set(pDone());return {done:PBQS.filter(x=>done.has(x.n)).length,total:PBQS.length}}
function examStats(){const x=load();if(!x||x.status!=='running')return {done:0,total:90,running:false,index:0};return {done:Object.keys(x.answers||{}).length,total:(x.items||[]).length||90,running:true,index:(x.index||0)+1}}
function repairKnownMultiData(){const q156=BANK.find(q=>q.n===156);if(q156&&q156.answers.length===1&&/Wählen Sie zwei/i.test(q156.prompt)&&/Aktiv zuhören und Notizen machen/i.test(q156.explanation||''))q156.answers=['B','E'];const q157=BANK.find(q=>q.n===157);if(q157&&/Wählen Sie drei/i.test(q157.prompt)&&/\.pkg, \.dmg und \.app/i.test(q157.explanation||'')){q157.options=[['A','.mac'],['B','.pkg'],['C','.deb'],['D','.dmg'],['E','.msi'],['F','.appx'],['G','.app'],['H','.apk']];q157.answers=['B','D','G']}const q182=BANK.find(q=>q.n===182);if(q182&&/Wählen Sie drei/i.test(q182.prompt)&&/Datenaufbewahrung/i.test(q182.explanation||'')){q182.options=[['A','Lokale Benutzerkonten'],['B','Zugriff auf persönliche Geräte'],['C','API-Token-Konfiguration'],['D','Mehrfaktorauthentifizierung'],['E','Private Kanäle'],['F','Profile für Kollaborationstools'],['G','VPN-Verbindung'],['H','Anforderungen an die Datenaufbewahrung']];q182.answers=['D','E','H']}}
repairKnownMultiData();
const css=document.createElement('style');css.textContent='.topicquickgrid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}.topicpanel{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;color:var(--ink)}.topicpanel strong{display:block;font-size:14px}.topicmeta,.pmeta{display:flex;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:12px;font-weight:750}.topicprogress,.pbar{margin-top:7px;height:7px;background:#e7edf6;border-radius:999px;overflow:hidden}.topicprogress>i,.pbar>i{display:block;height:100%;background:linear-gradient(90deg,#145dcc,#4b8df8)}.topicactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.topicactions .btn{padding:8px 10px;font-size:12px;flex:1 1 auto}.topicactions .btn:disabled{opacity:.55;cursor:not-allowed}.progressbox{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe;text-align:left}.progressbox strong{display:block;font-size:13px}.resetzone{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}.option.answer-correct{border-color:#42b96b!important;background:#eaf7ef!important;color:#157347}.option.answer-wrong{border-color:#e57373!important;background:#fff0ef!important;color:#b42318}';document.head.appendChild(css);
function progressBox(title,done,total,extra){const p=pc(done,total);return '<div class="progressbox"><strong>'+title+'</strong><div class="pmeta"><span>'+done+' / '+total+'</span><span>'+p+'%</span></div><div class="pbar"><i style="width:'+p+'%"></i></div>'+(extra?'<div class="small" style="margin-top:8px">'+extra+'</div>':'')+'</div>'}
function enc(s){return encodeURIComponent(s)}
function topicCard(name){const st=topicStats(name),p=pc(st.done,st.total),fresh=st.done===0,finished=st.total>0&&st.done>=st.total;return '<div class="topicpanel"><strong>'+name+'</strong><div class="topicmeta"><span>'+st.total+' Fragen</span><span>'+st.done+'/'+st.total+' erledigt · '+p+'%</span></div><div class="topicprogress"><i style="width:'+p+'%"></i></div><div class="topicactions"><button class="btn primary" '+(finished?'disabled':'')+' onclick="continueTopic(\''+enc(name)+'\')">'+(finished?'✓ Fertig':fresh?'▶ Starten':'▶ Weiter')+'</button><button class="btn secondary" onclick="startTopicErrors(\''+enc(name)+'\')">Nur Fehler ('+st.errors+')</button><button class="btn secondary" onclick="startTopicFresh(\''+enc(name)+'\')">↻ Von vorn</button></div></div>'}
function orderedItems(name,rec){const pool=topicPool(name),by=new Map(pool.map(q=>[q.n,q])),ids=(rec.order||[]).filter(n=>by.has(n)),missing=shuffle(pool.filter(q=>!ids.includes(q.n))).map(q=>q.n);rec.order=[...ids,...missing];return rec.order.map(n=>by.get(n)).filter(Boolean)}
function startTopicFresh(encoded){const name=decodeURIComponent(encoded),pool=shuffle(topicPool(name));const rec={order:pool.map(q=>q.n),index:0,done:[],errors:[],correct:0};setTopicRecord(name,rec);activeTopic=name;activeTopicMode='normal';train={topic:name,items:pool,index:0,selected:[],checked:false,correct:0};renderTraining();scrollTo(0,0)}
function continueTopic(encoded){const name=decodeURIComponent(encoded),rec=topicRecord(name),pool=topicPool(name);if(!pool.length)return;if(!(rec.order||[]).length){const doneSet=new Set(rec.done||[]),seen=shuffle(pool.filter(q=>doneSet.has(q.n))),rest=shuffle(pool.filter(q=>!doneSet.has(q.n)));rec.order=[...seen,...rest].map(q=>q.n);rec.index=Math.min(seen.length,pool.length);setTopicRecord(name,rec)}const items=orderedItems(name,rec);if(rec.index>=items.length){alert('Dieses Thema ist bereits komplett erledigt. Für einen Neustart bitte „Von vorn“ wählen.');return}activeTopic=name;activeTopicMode='normal';train={topic:name,items,index:rec.index,selected:[],checked:false,correct:rec.correct||0};renderTraining();scrollTo(0,0)}
function startTopicErrors(encoded){const name=decodeURIComponent(encoded),rec=topicRecord(name),ids=new Set(rec.errors||[]),pool=topicPool(name).filter(q=>ids.has(q.n));if(!pool.length){stopTimer();$('#top').classList.add('hidden');app.innerHTML='<section class="card hero"><h2>Keine Fehler in „'+name+'“ 🎉</h2><p>Für dieses Thema sind aktuell keine falschen Antworten gespeichert.</p><div class="actions"><button class="btn primary" onclick="continueTopic(\''+enc(name)+'\')">Thema weiter</button><button class="btn secondary" onclick="topicMenu()">Themenübersicht</button></div></section>';return}activeTopic=name;activeTopicMode='errors';train={topic:name+' · Nur Fehler',items:shuffle(pool),index:0,selected:[],checked:false,correct:0};renderTraining();scrollTo(0,0)}
function paintAnswers(){if(!train||!train.checked)return;const q=train.items[train.index],correct=new Set(q.answers||[]),chosen=new Set(train.selected||[]);document.querySelectorAll('.option').forEach(el=>{el.classList.remove('answer-correct','answer-wrong');const inp=el.querySelector('input'),l=inp?inp.value:(el.querySelector('.letter')?.textContent||'').replace('.','').trim();if(correct.has(l))el.classList.add('answer-correct');else if(chosen.has(l))el.classList.add('answer-wrong')})}
const originalRenderTraining=renderTraining;renderTraining=function(){originalRenderTraining();setTimeout(paintAnswers,0)};
const originalStartTraining=startTraining;startTraining=function(topic){activeTopic=null;activeTopicMode=null;originalStartTraining(topic)};
const originalStartErrorTraining=startErrorTraining;startErrorTraining=function(){activeTopic=null;activeTopicMode=null;originalStartErrorTraining()};
const originalTrainCheck=trainCheck;trainCheck=function(){const q=train&&train.items[train.index];originalTrainCheck();if(train&&train.checked&&q){markQ(q.n);if(activeTopic){const rec=topicRecord(activeTopic);if(!(rec.done||[]).includes(q.n))rec.done=[...(rec.done||[]),q.n];if(train.ok)rec.errors=(rec.errors||[]).filter(n=>n!==q.n);else if(!(rec.errors||[]).includes(q.n))rec.errors=[...(rec.errors||[]),q.n];if(activeTopicMode==='normal'){rec.order=train.items.map(x=>x.n);rec.index=Math.min(train.index+1,train.items.length);rec.correct=train.correct||0}setTopicRecord(activeTopic,rec)}}setTimeout(paintAnswers,0)};
const originalTrainNext=trainNext;trainNext=function(){if(activeTopic&&activeTopicMode==='normal'){const rec=topicRecord(activeTopic);rec.index=Math.min(train.index+1,train.items.length);rec.order=train.items.map(x=>x.n);rec.correct=train.correct||0;setTopicRecord(activeTopic,rec)}originalTrainNext()};
const originalCheckPBQ=checkPBQTrain;checkPBQTrain=function(){const it=state&&state.items&&state.items[state.index];originalCheckPBQ();if(it)markP(it.n)};
function clearCore2Progress(){if(!confirm('Wirklich nur den gespeicherten Fortschritt löschen? Fragen, Antworten und der Core-2-Trainer selbst bleiben erhalten.'))return;Object.keys(localStorage).filter(k=>k.startsWith('sabine_core2_')).forEach(k=>localStorage.removeItem(k));activeTopic=null;activeTopicMode=null;train=null;state=null;home()}
window.continueTopic=continueTopic;window.startTopicErrors=startTopicErrors;window.startTopicFresh=startTopicFresh;window.clearCore2Progress=clearCore2Progress;
topicMenu=function(){activeTopic=null;activeTopicMode=null;stopTimer();$('#top').classList.add('hidden');app.innerHTML='<section class="card"><div class="qnum">THEMEN-TRAINING</div><div class="qtext">Was willst du heute quälen?</div><div class="topicgrid">'+Object.keys(TOPICS).map(n=>topicCard(n)).join('')+'</div><div class="actions"><button class="btn secondary" onclick="home()">← Hauptmenü</button></div></section>'};
home=function(){activeTopic=null;activeTopicMode=null;stopTimer();$('#top').classList.add('hidden');const old=load(),resume=old&&old.status==='running',errCount=getTrainErrors().length,as=allStats(),ps=pbqStats(),es=examStats();app.innerHTML='<section class="card hero"><div class="qnum">COMPTIA A+ · CORE 2</div><h1>220-1202 Lern- & Prüfungstrainer</h1><p class="big">Original-Fragenpool · Themen · PBQs · 90 Fragen / 90 Minuten</p><p>Bei jedem neuen Training werden die Fragen neu gemischt. Laufende Themen und eine laufende Prüfung bleiben gespeichert.</p><div class="modegrid"><div class="modecard"><h3>📚 Fragentrainer</h3><p>Alle Fragen oder gezielt nur deine bisherigen Fehler.</p><div class="actions" style="justify-content:flex-start;margin-top:10px"><button class="btn primary" onclick="startTraining(\'all\')">Alle Fragen</button><button class="btn secondary" onclick="startErrorTraining()">Nur Fehler ('+errCount+')</button></div>'+progressBox('Fortschritt · alle Fragen',as.done,as.total,as.total+' Fragen insgesamt')+'</div><div class="modecard"><h3>🧩 Themen-Training</h3><p>Jedes Thema einzeln fortsetzen, nur Fehler üben oder neu starten.</p><button class="btn primary" onclick="topicMenu()">Themen wählen</button><div class="topicquickgrid">'+Object.keys(TOPICS).map(n=>topicCard(n)).join('')+'</div></div><div class="modecard"><h3>🛠️ Simulationstrainer</h3><p>Die aus der Datei rekonstruierbaren PBQs separat üben.</p><button class="btn primary" onclick="startPBQTraining()">PBQs starten</button>'+progressBox('Fortschritt · Simulationen',ps.done,ps.total,ps.total+' PBQs insgesamt')+'</div><div class="modecard"><h3>⏱️ Volltrainer</h3><p>90 Fragen · 90 Minuten · Fortschritt · Fähnchen · Übersicht · vorzeitige Abgabe · Auswertung.</p>'+(resume?'<button class="btn primary" onclick="resumeExam()">▶ Prüfung fortsetzen</button> ':'')+'<button class="btn '+(resume?'secondary':'primary')+'" onclick="newExam()">Neue Prüfung</button>'+progressBox('Fortschritt · Volltrainer',es.done,es.total,resume?('Gespeicherte Prüfung · aktuelle Frage '+es.index+' von '+es.total):'Keine laufende Prüfung')+'</div></div><div class="resetzone"><button class="btn danger" onclick="clearCore2Progress()">🗑️ Fortschritt löschen</button><div class="small" style="margin-top:8px">Löscht ausschließlich den gespeicherten Fortschritt – nicht den Core-2-Trainer.</div></div></section><div class="footerNote">Basis: die bereitgestellte 220-1202-Core-2-Datei.</div>'};home();
})();`;
 d.body.appendChild(s);
});
</script></body></html>
