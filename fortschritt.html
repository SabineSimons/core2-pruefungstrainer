<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CompTIA A+ Core 2 · Vollständiger Trainer</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}iframe{display:block}</style></head><body><iframe id="trainer" src="index.html" title="Core 2 Prüfungstrainer"></iframe><script>
const f=document.getElementById('trainer');
f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;try{
const QKEY='sabine_core2_2201202_topic_progress_v1';
const PKEY='sabine_core2_2201202_pbq_progress_v1';
const getJson=(k,def=[])=>{try{return JSON.parse(w.localStorage.getItem(k)||JSON.stringify(def))}catch(e){return def}};
const uniq=a=>[...new Set(a)];
const getDone=()=>getJson(QKEY,[]);
const markQ=n=>w.localStorage.setItem(QKEY,JSON.stringify(uniq([...getDone(),n])));
const getPBQDone=()=>getJson(PKEY,[]);
const markPBQ=n=>w.localStorage.setItem(PKEY,JSON.stringify(uniq([...getPBQDone(),n])));
const pct=(done,total)=>total?Math.round(done/total*100):0;
const topicCount=name=>{const pool=w.BANK.filter(q=>w.topicFor(q,name)),done=new Set(getDone());return {done:pool.filter(q=>done.has(q.n)).length,total:pool.length}};
const allCount=()=>{const done=new Set(getDone());return {done:w.BANK.filter(q=>done.has(q.n)).length,total:w.BANK.length}};
const pbqCount=()=>{const done=new Set(getPBQDone());return {done:w.PBQS.filter(x=>done.has(x.n)).length,total:w.PBQS.length}};
const examCount=()=>{const s=w.load();if(!s||s.status!=='running')return {done:0,total:90,running:false,index:0};return {done:Object.keys(s.answers||{}).length,total:(s.items||[]).length||90,running:true,index:(s.index||0)+1}};
const style=d.createElement('style');style.textContent=`
.progressbox{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe;text-align:left}.progressbox strong{display:block;font-size:13px;margin-bottom:7px}.pmeta,.topicmeta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;font-weight:750}.pbar,.topicprogress{margin-top:7px;height:7px;background:#e7edf6;border-radius:999px;overflow:hidden}.pbar>i,.topicprogress>i{display:block;height:100%;background:linear-gradient(90deg,#145dcc,#4b8df8)}.topicquickgrid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}.topicquick{display:block;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;color:var(--ink);cursor:pointer}.topicquick:hover{border-color:#9db9e9;background:#f8fbff}.topicquick strong{display:block;font-size:14px}.topicquick .topicmeta{font-size:11px}.option.answer-correct{border-color:#42b96b!important;background:#eaf7ef!important;color:#157347}.option.answer-wrong{border-color:#e57373!important;background:#fff0ef!important}.answer-correct .letter{color:#157347}.answer-wrong .letter{color:#b42318}
`;d.head.appendChild(style);
function bindTopics(root=d){root.querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();w.startTraining(decodeURIComponent(b.dataset.topic))}))}
function topicCard(n,cls='topicbtn'){const p=topicCount(n),pc=pct(p.done,p.total);return `<button type="button" class="${cls}" data-topic="${encodeURIComponent(n)}"><strong>${n}</strong><div class="topicmeta"><span>${p.total} Fragen</span><span>${p.done}/${p.total} erledigt · ${pc}%</span></div><div class="topicprogress"><i style="width:${pc}%"></i></div></button>`}
function progressBox(title,done,total,extra=''){const pc=pct(done,total);return `<div class="progressbox"><strong>${title}</strong><div class="pmeta"><span>${done} / ${total}</span><span>${pc}%</span></div><div class="pbar"><i style="width:${pc}%"></i></div>${extra?`<div class="small" style="margin-top:8px">${extra}</div>`:''}</div>`}
function paintAnswers(){try{if(!w.train||!w.train.checked)return;const q=w.train.items[w.train.index],correct=new Set(q.answers||[]),chosen=new Set(w.train.selected||[]);d.querySelectorAll('.option').forEach(el=>{el.classList.remove('answer-correct','answer-wrong');const v=(el.querySelector('.letter')?.textContent||'').replace('.','').trim();if(correct.has(v))el.classList.add('answer-correct');else if(chosen.has(v))el.classList.add('answer-wrong')})}catch(e){console.error(e)}}
const baseRenderTraining=w.renderTraining;w.renderTraining=function(){baseRenderTraining();setTimeout(paintAnswers,0)};
const baseTrainCheck=w.trainCheck;w.trainCheck=function(){const q=w.train&&w.train.items[w.train.index];baseTrainCheck();if(w.train&&w.train.checked&&q)markQ(q.n);setTimeout(paintAnswers,0)};
const baseCheckPBQ=w.checkPBQTrain;w.checkPBQTrain=function(){let n=null;try{const it=w.state&&w.state.items&&w.state.items[w.state.index];if(it)n=it.n}catch(e){}baseCheckPBQ();if(n!==null)markPBQ(n)};
w.topicMenu=function(){w.stopTimer();w.$('#top').classList.add('hidden');w.app.innerHTML=`<section class="card"><div class="qnum">THEMEN-TRAINING</div><div class="qtext">Was willst du heute quälen?</div><div class="topicgrid">${Object.keys(w.TOPICS).map(n=>topicCard(n)).join('')}</div><div class="actions"><button class="btn secondary" id="backHome">← Hauptmenü</button></div></section>`;bindTopics();d.getElementById('backHome').onclick=w.home};
w.home=function(){w.stopTimer();w.$('#top').classList.add('hidden');const old=w.load(),resume=old&&old.status==='running',errCount=w.getTrainErrors().length,ac=allCount(),pc=pbqCount(),ec=examCount();w.app.innerHTML=`<section class="card hero"><div class="qnum">COMPTIA A+ · CORE 2</div><h1>220-1202 Lern- & Prüfungstrainer</h1><p class="big">Original-Fragenpool · Themen · PBQs · 90 Fragen / 90 Minuten</p><p>Bei jedem neuen Training werden die Fragen neu gemischt. Eine laufende Prüfung bleibt dagegen in ihrer gespeicherten Reihenfolge.</p><div class="modegrid">
<div class="modecard"><h3>📚 Fragentrainer</h3><p>Alle Fragen oder gezielt nur deine bisherigen Fehler. Nach jeder Antwort sofort richtig/falsch + Erklärung.</p><div class="actions" style="justify-content:flex-start;margin-top:10px"><button class="btn primary" id="allQ">Alle Fragen</button><button class="btn secondary" id="errQ">Nur Fehler (${errCount})</button></div>${progressBox('Fortschritt · alle Fragen',ac.done,ac.total,ac.total+' Fragen insgesamt')}</div>
<div class="modecard"><h3>🧩 Themen-Training</h3><p>Alle Themen direkt anklickbar – mit Fragenzahl und deinem gespeicherten Fortschritt.</p><button class="btn primary" id="chooseTopics">Themen wählen</button><div class="topicquickgrid">${Object.keys(w.TOPICS).map(n=>topicCard(n,'topicquick')).join('')}</div></div>
<div class="modecard"><h3>🛠️ Simulationstrainer</h3><p>Die aus der PDF sauber rekonstruierbaren PBQs separat üben.</p><button class="btn primary" id="pbqStart">PBQs starten</button>${progressBox('Fortschritt · Simulationen',pc.done,pc.total,pc.total+' PBQs insgesamt')}</div>
<div class="modecard"><h3>⏱️ Volltrainer</h3><p>90 Fragen · 90 Minuten · Fortschritt · Fähnchen · Übersicht · vorzeitige Abgabe · Auswertung.</p>${resume?'<button class="btn primary" id="resumeExam">▶ Prüfung fortsetzen</button> ':''}<button class="btn ${resume?'secondary':'primary'}" id="newExam">Neue Prüfung</button>${progressBox('Fortschritt · Volltrainer',ec.done,ec.total,resume?('Gespeicherte Prüfung · aktuelle Frage '+ec.index+' von '+ec.total):'Keine laufende Prüfung')}</div>
</div></section><div class="footerNote">Basis: die bereitgestellte 220-1202-Core-2-Datei. Keine fachliche Eigenkorrektur der dort angegebenen Lösungen.</div>`;
d.getElementById('allQ').onclick=()=>w.startTraining('all');d.getElementById('errQ').onclick=w.startErrorTraining;d.getElementById('chooseTopics').onclick=w.topicMenu;d.getElementById('pbqStart').onclick=w.startPBQTraining;d.getElementById('newExam').onclick=w.newExam;if(resume)d.getElementById('resumeExam').onclick=w.resumeExam;bindTopics()};
w.home();
}catch(e){console.error(e)}});
</script></body></html>
