<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CompTIA A+ Core 2 · Fortschritt</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}iframe{display:block}</style></head><body><iframe id="trainer" src="index.html" title="Core 2 Prüfungstrainer"></iframe><script>
const f=document.getElementById('trainer');
f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;try{
const KEY='sabine_core2_2201202_topic_progress_v1';
const getDone=()=>{try{return JSON.parse(w.localStorage.getItem(KEY)||'[]')}catch(e){return[]}};
const mark=n=>{let a=getDone();if(!a.includes(n)){a.push(n);w.localStorage.setItem(KEY,JSON.stringify(a))}};
const count=name=>{const pool=w.BANK.filter(q=>w.topicFor(q,name)),done=new Set(getDone());return {done:pool.filter(q=>done.has(q.n)).length,total:pool.length}};
const style=d.createElement('style');style.textContent='.topicprogress{margin-top:8px;height:7px;background:#e7edf6;border-radius:999px;overflow:hidden}.topicprogress>i{display:block;height:100%;background:linear-gradient(90deg,#145dcc,#4b8df8)}.topicmeta{display:flex;justify-content:space-between;gap:8px;margin-top:6px;color:#667085;font-size:12px;font-weight:700}.option.answer-correct{border-color:#42b96b!important;background:#eaf7ef!important;color:#157347}.option.answer-wrong{border-color:#e57373!important;background:#fff0ef!important}.answer-correct .letter{color:#157347}';d.head.appendChild(style);
const paint=()=>{try{if(!w.train||!w.train.checked)return;const q=w.train.items[w.train.index],correct=new Set(q.answers||[]);d.querySelectorAll('.option').forEach(el=>{const inp=el.querySelector('input');if(!inp)return;const v=inp.value;if(correct.has(v))el.classList.add('answer-correct');else if(inp.checked)el.classList.add('answer-wrong')})}catch(e){}};
const oldCheck=w.trainCheck;
w.trainCheck=function(){const before=w.train&&w.train.checked;oldCheck();if(!before&&w.train&&w.train.checked){const q=w.train.items[w.train.index];if(q)mark(q.n)}paint()};
const oldRender=w.trainRender;w.trainRender=function(){oldRender();setTimeout(paint,0)};
w.topicMenu=function(){w.stopTimer();w.$('#top').classList.add('hidden');w.app.innerHTML=`<section class="card"><div class="qnum">THEMEN-TRAINING</div><div class="qtext">Was willst du heute quälen?</div><div class="topicgrid">${Object.keys(w.TOPICS).map(n=>{const p=count(n),pct=p.total?Math.round(p.done/p.total*100):0;return `<button class="topicbtn" onclick="startTopic('${w.topicArg(n)}')">${n}<br><small>${p.total} Fragen</small><div class="topicprogress"><i style="width:${pct}%"></i></div><div class="topicmeta"><span>${p.done} / ${p.total} erledigt</span><span>${pct}%</span></div></button>`}).join('')}</div><div class="actions"><button class="btn secondary" onclick="home()">← Hauptmenü</button></div></section>`};
}catch(e){console.error(e)}});
</script></body></html>
