<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CompTIA A+ Core 2 · Vollständiger Trainer</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}iframe{display:block}</style></head><body><iframe id="trainer" src="index.html?v=9" title="Core 2 Prüfungstrainer"></iframe><script>
const frame=document.getElementById('trainer');
frame.addEventListener('load',()=>{
 const d=frame.contentDocument;
 const s=d.createElement('script');
 s.textContent=String.raw`
(function(){
const QKEY='sabine_core2_2201202_progress_v8';
const PKEY='sabine_core2_2201202_pbq_progress_v8';
function read(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return []}}
function write(k,a){localStorage.setItem(k,JSON.stringify([...new Set(a)]))}
function qDone(){return read(QKEY)} function pDone(){return read(PKEY)}
function markQ(n){write(QKEY,[...qDone(),n])} function markP(n){write(PKEY,[...pDone(),n])}
function pc(d,t){return t?Math.round(d/t*100):0}
function topicStats(name){const pool=BANK.filter(q=>topicFor(q,name));const done=new Set(qDone());return {done:pool.filter(q=>done.has(q.n)).length,total:pool.length}}
function allStats(){const done=new Set(qDone());return {done:BANK.filter(q=>done.has(q.n)).length,total:BANK.length}}
function pbqStats(){const done=new Set(pDone());return {done:PBQS.filter(x=>done.has(x.n)).length,total:PBQS.length}}
function examStats(){const x=load();if(!x||x.status!=='running')return {done:0,total:90,running:false,index:0};return {done:Object.keys(x.answers||{}).length,total:(x.items||[]).length||90,running:true,index:(x.index||0)+1}}
const css=document.createElement('style');css.textContent='.topicquickgrid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}.topicquick{display:block;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;color:var(--ink);cursor:pointer}.topicquick strong{display:block;font-size:14px}.topicmeta,.pmeta{display:flex;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:12px;font-weight:750}.topicprogress,.pbar{margin-top:7px;height:7px;background:#e7edf6;border-radius:999px;overflow:hidden}.topicprogress>i,.pbar>i{display:block;height:100%;background:linear-gradient(90deg,#145dcc,#4b8df8)}.progressbox{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe;text-align:left}.progressbox strong{display:block;font-size:13px}.option.answer-correct{border-color:#42b96b!important;background:#eaf7ef!important;color:#157347}.option.answer-wrong{border-color:#e57373!important;background:#fff0ef!important;color:#b42318}';document.head.appendChild(css);
function progressBox(title,done,total,extra){const p=pc(done,total);return '<div class="progressbox"><strong>'+title+'</strong><div class="pmeta"><span>'+done+' / '+total+'</span><span>'+p+'%</span></div><div class="pbar"><i style="width:'+p+'%"></i></div>'+(extra?'<div class="small" style="margin-top:8px">'+extra+'</div>':'')+'</div>'}
function topicCard(name,cls){const st=topicStats(name),p=pc(st.done,st.total);return '<button type="button" class="'+(cls||'topicbtn')+'" onclick="startTraining(decodeURIComponent(\''+encodeURIComponent(name)+'\'))"><strong>'+name+'</strong><div class="topicmeta"><span>'+st.total+' Fragen</span><span>'+st.done+'/'+st.total+' erledigt · '+p+'%</span></div><div class="topicprogress"><i style="width:'+p+'%"></i></div></button>'}
function paintAnswers(){if(!train||!train.checked)return;const q=train.items[train.index],correct=new Set(q.answers||[]),chosen=new Set(train.selected||[]);document.querySelectorAll('.option').forEach(el=>{el.classList.remove('answer-correct','answer-wrong');const inp=el.querySelector('input'),l=inp?inp.value:(el.querySelector('.letter')?.textContent||'').replace('.','').trim();if(correct.has(l))el.classList.add('answer-correct');else if(chosen.has(l))el.classList.add('answer-wrong')})}
function fixMulti(){if(!train||train.checked)return;const q=train.items[train.index];if(!q||!q.answers||q.answers.length<2)return;const opts=[...document.querySelectorAll('.option')];opts.forEach(el=>{const old=el.querySelector('input');if(!old)return;const v=old.value,checked=(train.selected||[]).includes(v);const cb=document.createElement('input');cb.type='checkbox';cb.value=v;cb.checked=checked;cb.addEventListener('click',e=>e.stopPropagation());cb.addEventListener('change',()=>{let a=train.selected||[];if(cb.checked){if(!a.includes(v))a=[...a,v]}else a=a.filter(x=>x!==v);train.selected=a;el.classList.toggle('selected',cb.checked)});old.replaceWith(cb);el.onclick=(e)=>{if(e.target===cb)return;cb.checked=!cb.checked;cb.dispatchEvent(new Event('change'))};});}
const originalRenderTraining=renderTraining;renderTraining=function(){originalRenderTraining();setTimeout(()=>{fixMulti();paintAnswers()},0)};
const originalTrainCheck=trainCheck;trainCheck=function(){const q=train&&train.items[train.index];originalTrainCheck();if(train&&train.checked&&q)markQ(q.n);setTimeout(paintAnswers,0)};
const originalCheckPBQ=checkPBQTrain;checkPBQTrain=function(){const it=state&&state.items&&state.items[state.index];originalCheckPBQ();if(it)markP(it.n)};
topicMenu=function(){stopTimer();$('#top').classList.add('hidden');app.innerHTML='<section class="card"><div class="qnum">THEMEN-TRAINING</div><div class="qtext">Was willst du heute quälen?</div><div class="topicgrid">'+Object.keys(TOPICS).map(n=>topicCard(n,'topicbtn')).join('')+'</div><div class="actions"><button class="btn secondary" onclick="home()">← Hauptmenü</button></div></section>'};
home=function(){stopTimer();$('#top').classList.add('hidden');const old=load(),resume=old&&old.status==='running',errCount=getTrainErrors().length,as=allStats(),ps=pbqStats(),es=examStats();app.innerHTML='<section class="card hero"><div class="qnum">COMPTIA A+ · CORE 2</div><h1>220-1202 Lern- & Prüfungstrainer</h1><p class="big">Original-Fragenpool · Themen · PBQs · 90 Fragen / 90 Minuten</p><p>Bei jedem neuen Training werden die Fragen neu gemischt. Eine laufende Prüfung bleibt dagegen in ihrer gespeicherten Reihenfolge.</p><div class="modegrid"><div class="modecard"><h3>📚 Fragentrainer</h3><p>Alle Fragen oder gezielt nur deine bisherigen Fehler.</p><div class="actions" style="justify-content:flex-start;margin-top:10px"><button class="btn primary" onclick="startTraining(\'all\')">Alle Fragen</button><button class="btn secondary" onclick="startErrorTraining()">Nur Fehler ('+errCount+')</button></div>'+progressBox('Fortschritt · alle Fragen',as.done,as.total,as.total+' Fragen insgesamt')+'</div><div class="modecard"><h3>🧩 Themen-Training</h3><p>Alle Themen direkt anklickbar – mit Fragenzahl und gespeichertem Fortschritt.</p><button class="btn primary" onclick="topicMenu()">Themen wählen</button><div class="topicquickgrid">'+Object.keys(TOPICS).map(n=>topicCard(n,'topicquick')).join('')+'</div></div><div class="modecard"><h3>🛠️ Simulationstrainer</h3><p>Die aus der Datei rekonstruierbaren PBQs separat üben.</p><button class="btn primary" onclick="startPBQTraining()">PBQs starten</button>'+progressBox('Fortschritt · Simulationen',ps.done,ps.total,ps.total+' PBQs insgesamt')+'</div><div class="modecard"><h3>⏱️ Volltrainer</h3><p>90 Fragen · 90 Minuten · Fortschritt · Fähnchen · Übersicht · vorzeitige Abgabe · Auswertung.</p>'+(resume?'<button class="btn primary" onclick="resumeExam()">▶ Prüfung fortsetzen</button> ':'')+'<button class="btn '+(resume?'secondary':'primary')+'" onclick="newExam()">Neue Prüfung</button>'+progressBox('Fortschritt · Volltrainer',es.done,es.total,resume?('Gespeicherte Prüfung · aktuelle Frage '+es.index+' von '+es.total):'Keine laufende Prüfung')+'</div></div></section><div class="footerNote">Basis: die bereitgestellte 220-1202-Core-2-Datei.</div>'};home();
})();`;
 d.body.appendChild(s);
});
</script></body></html>
