<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CompTIA A+ Core 2 · Fortschritt</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}iframe{display:block}</style></head><body><iframe id="trainer" src="index.html" title="Core 2 Prüfungstrainer"></iframe><script>
const f=document.getElementById('trainer');
f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;try{
const KEY='sabine_core2_2201202_topic_progress_v1';
const getDone=()=>{try{return JSON.parse(w.localStorage.getItem(KEY)||'[]')}catch(e){return[]}};
const mark=n=>{let a=getDone();if(!a.includes(n)){a.push(n);w.localStorage.setItem(KEY,JSON.stringify(a))}};
const count=name=>{const pool=w.BANK.filter(q=>w.topicFor(q,name)),done=new Set(getDone());return {done:pool.filter(q=>done.has(q.n)).length,total:pool.length}};
const pct=p=>p.total?Math.round(p.done/p.total*100):0;
const style=d.createElement('style');style.textContent=`
.topicprogress{margin-top:8px;height:7px;background:#e7edf6;border-radius:999px;overflow:hidden}.topicprogress>i{display:block;height:100%;background:linear-gradient(90deg,#145dcc,#4b8df8)}.topicmeta{display:flex;justify-content:space-between;gap:8px;margin-top:6px;color:#667085;font-size:12px;font-weight:700}.topicquickgrid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}.topicquick{display:block;width:100%;padding:11px 12px;border:1px solid #d8e0ec;border-radius:12px;background:#fff;text-align:left;color:#172033;cursor:pointer}.topicquick:hover{border-color:#9db9e9;background:#f8fbff}.topicquick strong{display:block;font-size:14px}.topicquick .topicmeta{font-size:11px}.option.answer-correct{border-color:#42b96b!important;background:#eaf7ef!important;color:#157347}.option.answer-wrong{border-color:#e57373!important;background:#fff0ef!important}.answer-correct .letter{color:#157347}.answer-wrong .letter{color:#b42318}
`;d.head.appendChild(style);
function bindTopics(root=d){root.querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();const n=decodeURIComponent(b.dataset.topic);w.startTraining(n)}))}
function topicCard(n,cls='topicbtn'){const p=count(n),pc=pct(p);return `<button type="button" class="${cls}" data-topic="${encodeURIComponent(n)}"><strong>${n}</strong><div class="topicmeta"><span>${p.total} Fragen</span><span>${p.done}/${p.total} erledigt · ${pc}%</span></div><div class="topicprogress"><i style="width:${pc}%"></i></div></button>`}
function paint(){try{if(!w.train||!w.train.checked)return;const q=w.train.items[w.train.index],correct=new Set(q.answers||[]),chosen=new Set(w.train.selected||[]);d.querySelectorAll('.option').forEach(el=>{el.classList.remove('answer-correct','answer-wrong');const v=(el.querySelector('.letter')?.textContent||'').replace('.','').trim();if(correct.has(v))el.classList.add('answer-correct');else if(chosen.has(v))el.classList.add('answer-wrong')})}catch(e){console.error(e)}}
const baseRenderTraining=w.renderTraining;
w.renderTraining=function(){baseRenderTraining();setTimeout(paint,0)};
const baseTrainCheck=w.trainCheck;
w.trainCheck=function(){const q=w.train&&w.train.items[w.train.index];baseTrainCheck();if(w.train&&w.train.checked&&q)mark(q.n);setTimeout(paint,0)};
w.topicMenu=function(){w.stopTimer();w.$('#top').classList.add('hidden');w.app.innerHTML=`<section class="card"><div class="qnum">THEMEN-TRAINING</div><div class="qtext">Was willst du heute quälen?</div><div class="topicgrid">${Object.keys(w.TOPICS).map(n=>topicCard(n)).join('')}</div><div class="actions"><button class="btn secondary" id="backHome">← Hauptmenü</button></div></section>`;bindTopics();d.getElementById('backHome').onclick=w.home};
w.home=function(){w.stopTimer();w.$('#top').classList.add('hidden');const old=w.load();const resume=old&&old.status==='running';const errCount=w.getTrainErrors().length;w.app.innerHTML=`<section class="card hero"><div class="qnum">COMPTIA A+ · CORE 2</div><h1>220-1202 Lern- & Prüfungstrainer</h1><p class="big">Original-Fragenpool · Themen · PBQs · 90 Fragen / 90 Minuten</p><p>Bei jedem neuen Training werden die Fragen neu gemischt. Eine laufende Prüfung bleibt dagegen in ihrer gespeicherten Reihenfolge.</p><div class="modegrid"><div class="modecard"><h3>📚 Fragentrainer</h3><p>Alle Fragen oder gezielt nur deine bisherigen Fehler. Nach jeder Antwort sofort richtig/falsch + Erklärung.</p><div class="actions" style="justify-content:flex-start;margin-top:10px"><button class="btn primary" id="allQ">Alle Fragen</button><button class="btn secondary" id="errQ">Nur Fehler (${errCount})</button></div></div><div class="modecard"><h3>🧩 Themen-Training</h3><p>Alle Themen direkt anklickbar – mit Fragenzahl und deinem gespeicherten Fortschritt.</p><button class="btn primary" id="chooseTopics">Themen wählen</button><div class="topicquickgrid">${Object.keys(w.TOPICS).map(n=>topicCard(n,'topicquick')).join('')}</div></div><div class="modecard"><h3>🛠️ Simulationstrainer</h3><p>Die aus der PDF sauber rekonstruierbaren PBQs separat üben.</p><button class="btn primary" id="pbqStart">PBQs starten</button></div><div class="modecard"><h3>⏱️ Vollprüfung</h3><p>90 Fragen · 90 Minuten · Fortschritt · Fähnchen · Übersicht · vorzeitige Abgabe · Auswertung.</p>${resume?'<button class="btn primary" id="resumeExam">▶ Prüfung fortsetzen</button> ':''}<button class="btn ${resume?'secondary':'primary'}" id="newExam">Neue Prüfung</button></div></div>${resume?`<p class="small">Gespeicherte Prüfung: Frage ${old.index+1} von ${old.items?.length||90} · ${Object.keys(old.answers||{}).length} Antworten</p>`:''}</section><div class="footerNote">Basis: die bereitgestellte 220-1202-Core-2-Datei. Keine fachliche Eigenkorrektur der dort angegebenen Lösungen.</div>`;
d.getElementById('allQ').onclick=()=>w.startTraining('all');d.getElementById('errQ').onclick=w.startErrorTraining;d.getElementById('chooseTopics').onclick=w.topicMenu;d.getElementById('pbqStart').onclick=w.startPBQTraining;d.getElementById('newExam').onclick=w.newExam;if(resume)d.getElementById('resumeExam').onclick=w.resumeExam;bindTopics()};
w.home();
}catch(e){console.error(e)}});
</script></body></html>
